<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="610" viewBox="0 0 1110 610" role="img" aria-labelledby="title desc">
<title id="title">GroovePuter Cardputer ADV PERFORM keymap — NOTE MODE OFF</title>
<desc id="desc">Legacy command keymap for GroovePuter PERFORM mode when NOTE mode is disabled.</desc>
