<text class="body" x="52" y="497">NOTE mode OFF: note rows are no longer reserved by the performance keyboard.</text>
<text class="body" x="52" y="521">Confirmed legacy commands: I randomizes Synth A, O Synth B, P drums, K/L adjust BPM.</text>
