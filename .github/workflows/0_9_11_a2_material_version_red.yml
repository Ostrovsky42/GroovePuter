name: 0.9.11 A2 Material Version RED

on:
  push:
    branches:
      - feature/20260909-0.9.11-a2-canonical-promotion
    paths:
      - "tests/test_0_9_11_a2_material_version.cpp"
      - ".github/workflows/0_9_11_a2_material_version_red.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-version-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove checkout is the event SHA
        run: |
          actual="$(git rev-parse HEAD)"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "HEAD=$actual"
          test "$actual" = "$GITHUB_SHA"

      - name: Require missing exact-version RED
        shell: bash
        run: |
          mkdir -p build/host-tests
          set +e
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Wno-c++20-extensions -I. \
            tests/test_0_9_11_a2_material_version.cpp \
            -o build/host-tests/test_0_9_11_a2_material_version \
            > /tmp/a2-version-red.log 2>&1
          status=$?
          set -e
          cat /tmp/a2-version-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected A2 material-version RED, but the contract test compiled"
            exit 1
          fi
          grep -Eq "material_version.h|MaterialVersionToken|versionForPattern|versionForMelody" \
            /tmp/a2-version-red.log
          echo "A2 material-version RED confirmed: exact accepted state has no token"

      - name: Diff hygiene
        run: git diff --check
