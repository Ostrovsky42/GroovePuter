name: Fix session header independence

on:
  push:
    branches:
      - feature/workflow-session-persistence
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'feature/workflow-session-persistence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/workflow-session-persistence
          fetch-depth: 0

      - name: Apply fix
        run: python3 tools/fix_session_header_independence.py

      - name: Run focused tests
        run: |
          python3 tests/test_ui_session_source_regressions.py
          python3 tests/test_theme_selection_source_regressions.py
          mkdir -p build/host-tests
          g++ -std=c++17 -Wall -Wextra -Werror -I. \
            tests/test_ui_session_state.cpp \
            -o build/host-tests/test_ui_session_state
          build/host-tests/test_ui_session_state

      - name: Commit production fix
        run: |
          rm -f tools/fix_session_header_independence.py
          rm -f .github/workflows/fix-session-header-independence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: decouple session codec from UI headers"
          git push origin HEAD:feature/workflow-session-persistence
