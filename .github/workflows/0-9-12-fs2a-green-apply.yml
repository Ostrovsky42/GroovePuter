name: 0.9.12 FS2A Green Apply

on:
  push:
    branches:
      - feature/20260914-fs2a-current-next-causality

permissions:
  contents: write

jobs:
  apply-green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove source ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor bd69c09e1aacbd383f09c4db69c17736104b1ddd HEAD
          printf 'apply_source_sha=%s\n' "$(git rev-parse HEAD)"

      - name: Apply exact FS2A production patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fs2a_apply_green.py
          mapfile -t changed < <(git diff --name-only)
          printf 'changed=%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'src/dsp/miniacid_engine.cpp'
          printf '%s\n' "${changed[@]}" | grep -Fx 'src/dsp/miniacid_engine.h'
          ! git diff --name-only | grep -E 'melody_storage|melody_promotion|song|project|ui/'

      - name: Install host dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev libsdl2-gfx-dev

      - name: FS2A current-next causality
        shell: bash
        run: bash tests/run_fs2a_current_next_causality_tests.sh

      - name: M4 primitive regression
        shell: bash
        run: bash tests/run_m4_next_material_tests.sh

      - name: Scope and durability audit
        shell: bash
        run: |
          set -euo pipefail
          ! git diff | grep -E '^\+.*(commitSelectedScene|MelodyPromotion|filesystem|open\(|fopen\(|SD\.|ACCEPT)'
          ! git diff --name-only | grep -E '^src/state/(melody_storage|melody_promotion)'
          ! git diff --name-only | grep -E '^src/ui/'
          git diff --check

      - name: Commit verified production delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dsp/miniacid_engine.h src/dsp/miniacid_engine.cpp
          git diff --cached --check
          git commit -m 'feat: add FS2A current-next lifecycle gate'
          final_sha="$(git rev-parse HEAD)"
          git push origin HEAD:feature/20260914-fs2a-current-next-causality
          printf 'green_commit_sha=%s\n' "$final_sha"
