name: D2 focused red fixes

on:
  push:
    branches:
      - agent/20260821-02-0.9.9-d2-phrase-live-arrangement
    paths:
      - 'tools/d2_fix_reds.py'
      - '.github/workflows/d2-fix-reds.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/20260821-02-0.9.9-d2-phrase-live-arrangement
          fetch-depth: 0
      - name: Apply exact fixes
        run: python3 tools/d2_fix_reds.py
      - name: Commit production/test fixes and remove bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/dsp/generated_phrase_song.h tests/test_phrase_ui_source_regressions.py
          git rm -- tools/d2_fix_reds.py .github/workflows/d2-fix-reds.yml
          git commit -m "fix(d2): close Phrase compile and legacy UI gates"
          git push origin HEAD:agent/20260821-02-0.9.9-d2-phrase-live-arrangement
