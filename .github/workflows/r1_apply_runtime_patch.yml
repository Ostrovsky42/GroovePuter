name: R1 one-shot release parity patch

on:
  push:
    branches:
      - agent/20260827-07-0.9.9-phrase-r1-crossbar-lifetime-executor
    paths:
      - '.github/workflows/r1_apply_runtime_patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/20260827-07-0.9.9-phrase-r1-crossbar-lifetime-executor
          fetch-depth: 0

      - name: Apply asserted R1 runtime patch
        run: python3 tools/r1_patch_miniacid.py

      - name: Remove one-shot tooling and commit
        run: |
          rm tools/r1_patch_miniacid.py
          rm .github/workflows/r1_apply_runtime_patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/dsp/miniacid_engine.h src/dsp/miniacid_engine.cpp \
                  tools/r1_patch_miniacid.py \
                  .github/workflows/r1_apply_runtime_patch.yml
          git diff --cached --check
          git commit -m "fix(0.9.9-phrase): enforce R1 hard-barrier release parity"
          git push origin HEAD:agent/20260827-07-0.9.9-phrase-r1-crossbar-lifetime-executor
