name: G4-I8 apply bounded compatibility binding

on:
  push:
    branches:
      - feature/20260910-03-0.9.11-g4-i8-bass-family-compatibility-binding
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-binding:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/20260910-03-0.9.11-g4-i8-bass-family-compatibility-binding

      - name: Apply bounded production edit
        run: python3 tools/gf2/apply_g4_i8_binding.py

      - name: Commit exact production delta
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/generation/composition/generation_profile.cpp; then
            echo "G4-I8 production delta already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generation/composition/generation_profile.cpp
          git commit -m "feat(g4-i8): bind bass selection to rhythm family"
          git push origin HEAD:feature/20260910-03-0.9.11-g4-i8-bass-family-compatibility-binding
