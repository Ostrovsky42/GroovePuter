name: Groove Vocabulary Stage 2 temporary Atlas relation fix

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/20260808-04-groove-vocabulary-stage2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply patch
        run: |
          python3 .github/stage2_atlas_deep_relation_patch.py
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_rhythm_stage2_atlas_realization.cpp
          git commit -m 'test: match Deep Chord Stage 1 grammar exactly'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
