name: G4-I8 bass family compatibility binding

on:
  push:
    branches:
      - feature/20260910-03-0.9.11-g4-i8-bass-family-compatibility-binding
  workflow_dispatch:

permissions:
  contents: read

env:
  C0R_OBSERVER_SHA: a1451f5d76acd4be68ccef22fde7d786dc0c1a11

jobs:
  bass-family-binding:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Exact-head provenance
        shell: bash
        run: |
          set -euo pipefail
          echo "EXPECTED=${GITHUB_SHA}"
          echo "ACTUAL=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: G4-I8 bass family compatibility binding
        shell: bash
        run: bash tests/run_gf2_g4_i8_tests.sh

      - name: Upload G4-I8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gf2-g4-i8-bass-family-binding
          path: build/host-tests/gf2-g4-i8
          if-no-files-found: warn

  generation-host-matrix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Exact-head provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Generation Stage 13/14/15 host matrix
        shell: bash
        run: bash tests/run_generation_stage13_tests.sh

  c0r6-observer-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Exact-head provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Overlay research-only C0R6 observer
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${C0R_OBSERVER_SHA}^{commit}"
          observer_paths=(
            tests/support/build_gf2_gate_b_g4_c0r3_probe.sh
            tests/support/gf2_gate_b_g4_c0r6_full_structural_census_test.sh
            tools/gf2/g4_c0r3_dump.cpp
            tools/gf2/g4_c0r3_tonal_probe.cpp
            tools/gf2/g4_c0r3_tonal_probe.h
            tools/gf2/g4_c0r4_bass_candidates_probe.cpp
            tools/gf2/g4_c0r4_bass_candidates_probe.h
            tools/gf2/g4_c0r4_role_plan_probe.cpp
            tools/gf2/g4_c0r4_role_plan_probe.h
            tools/gf2/g4_c0r6_structural_separation.py
            tools/gf2/g4_c0r_corpus.py
          )
          git checkout "${C0R_OBSERVER_SHA}" -- "${observer_paths[@]}"
          if ! git diff --quiet "${GITHUB_SHA}" -- src/; then
            echo "G4_I8_C0R_REPLAY_FAIL observer overlay touched src/" >&2
            git diff --stat "${GITHUB_SHA}" -- src/ >&2
            exit 1
          fi
          echo "G4-I8 C0R6 observer firewall: src/ DELTA = NONE"

      - name: Production-backed C0R6 structural census on I8
        shell: bash
        run: bash tests/support/gf2_gate_b_g4_c0r6_full_structural_census_test.sh

      - name: Upload C0R6 replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gf2-g4-i8-c0r6-replay
          path: build/host-tests/gf2-gate-b/g4-c0r6-structural-census
          if-no-files-found: warn

      - name: Restore exact I8 tree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "${GITHUB_SHA}"
          git clean -fd
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"

  target-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Exact-head provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Prepare SDL build dependencies
        id: sdl_setup
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libsdl2-dev \
            libsdl2-gfx-dev

      - name: Prepare Arduino CLI
        id: arduino_cli_setup
        continue-on-error: true
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Prepare pinned M5Stack dependencies
        id: arduino_deps_setup
        if: ${{ always() && steps.arduino_cli_setup.outcome == 'success' }}
        continue-on-error: true
        run: bash scripts/install_arduino_deps.sh

      - name: Run exact-SHA GF2 target matrix
        id: validation
        if: ${{ always() }}
        continue-on-error: true
        env:
          GF2_SDL_SETUP_STATUS: ${{ steps.sdl_setup.outcome }}
          GF2_ARDUINO_CLI_SETUP_STATUS: ${{ steps.arduino_cli_setup.outcome }}
          GF2_ARDUINO_DEPS_SETUP_STATUS: ${{ steps.arduino_deps_setup.outcome }}
        run: bash scripts/validate_gf2_targets.sh --all

      - name: Preserve target evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gf2-g4-i8-target-validation
          path: build/gf2-validation
          if-no-files-found: warn

      - name: Enforce mandatory target status
        if: ${{ always() }}
        shell: bash
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        run: |
          if [[ "${VALIDATION_OUTCOME}" != "success" ]]; then
            echo "G4-I8 target matrix is not GREEN: ${VALIDATION_OUTCOME}" >&2
            exit 1
          fi
          echo "G4-I8 target matrix is GREEN"
