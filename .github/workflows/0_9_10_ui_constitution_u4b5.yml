name: 0.9.10 UI Constitution U4B5

on:
  push:
    branches:
      - tmp/20260906-ui-u4b5-runtime-phrase-undo

permissions:
  contents: read

jobs:
  u4b5-runtime-phrase-undo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run U4B5 focused gate
        run: |
          set -o pipefail
          bash tests/run_ui_constitution_u4b5_tests.sh 2>&1 | tee ui-constitution-u4b5.log
      - name: Upload U4B5 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-constitution-u4b5-log
          path: ui-constitution-u4b5.log
          if-no-files-found: error
