name: Legacy scale quantizer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-scale-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run legacy scale quantizer matrix
        env:
          ASAN_OPTIONS: "detect_leaks=0"
        run: bash tests/run_legacy_scale_quantizer_tests.sh
