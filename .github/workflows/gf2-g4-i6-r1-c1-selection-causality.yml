name: GF2 G4-I6-R1-C1 Acid selection causality

on:
  push:
    branches:
      - feature/20260911-01-g4-cc1a-p1-acid-articulation-authority
    paths:
      - 'tools/gf2/g4_i6_r1_c1_selection_causality.cpp'
      - 'tools/gf2/g4_i6_r1_c1_trace_capacity.h'
      - '.github/workflows/gf2-g4-i6-r1-c1-selection-causality.yml'
      - 'docs/research/GF2_G4_I6_R1_C1_SELECTION_CAUSALITY.tsv'
      - 'docs/research/GF2_G4_I6_R1_C1_ACID_SELECTION_RNG_CAUSALITY.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libsdl2-dev libsdl2-gfx-dev pkg-config

      - name: Regenerate current I6 projection without refreshing evidence
        shell: bash
        run: |
          mkdir -p build/host-tests/gf2-g4-i6-r1-c1
          set +e
          bash tests/run_gf2_g4_i6_tests.sh > build/host-tests/gf2-g4-i6-r1-c1/i6.log 2>&1
          rc=$?
          set -e
          cat build/host-tests/gf2-g4-i6-r1-c1/i6.log
          test "$rc" -eq 1
          grep -F 'G4-I6 global ownership census: PASS' build/host-tests/gf2-g4-i6-r1-c1/i6.log >/dev/null
          grep -F 'G4-I6 full derived corpus deterministic repeat: PASS' build/host-tests/gf2-g4-i6-r1-c1/i6.log >/dev/null
          grep -F 'G4-I6 corrected methodology controls: PASS' build/host-tests/gf2-g4-i6-r1-c1/i6.log >/dev/null
          grep -F 'G4-I6 committed evidence freshness: RED' build/host-tests/gf2-g4-i6-r1-c1/i6.log >/dev/null

      - name: Build and run exact selection causality trace
        shell: bash
        run: |
          ROOT="$PWD"
          BUILD="$ROOT/build/host-tests/gf2-g4-i6-r1-c1"
          mapfile -t SOURCES < <(
            sed -n '/COMMON_SOURCES=(/,/)/p' "$ROOT/tests/run_stage15_tonal_integration_tests.sh" |
              grep -F '"${ROOT}/src/' |
              sed -E 's/.*"\$\{ROOT\}(.*)".*/\1/'
          )
          RESOLVED=()
          for source in "${SOURCES[@]}"; do RESOLVED+=("$ROOT$source"); done
          g++ -std=c++17 -Wall -Wextra -Werror -Wvla \
            -Wno-c++20-extensions -Wno-unused-but-set-variable \
            -I"$ROOT" \
            -include "$ROOT/tools/gf2/g4_i6_r1_c1_trace_capacity.h" \
            "${RESOLVED[@]}" \
            "$ROOT/tools/gf2/g4_i6_r1_c1_selection_causality.cpp" \
            -o "$BUILD/g4-i6-r1-c1-selection-causality"
          "$BUILD/g4-i6-r1-c1-selection-causality" \
            "$BUILD/GF2_G4_I6_R1_C1_SELECTION_CAUSALITY.tsv" |
            tee "$BUILD/causality.log"

      - name: Cross-check historical and current evidence against causal trace
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path

          build = Path('build/host-tests/gf2-g4-i6-r1-c1')
          old_path = Path('docs/research/GF2_G4_I6_OWNERSHIP_CENSUS.tsv')
          new_path = Path('build/host-tests/gf2-g4-i6/run-a/GF2_G4_I6_OWNERSHIP_CENSUS.tsv')
          trace_path = build / 'GF2_G4_I6_R1_C1_SELECTION_CAUSALITY.tsv'

          def rows(path):
              with path.open(newline='') as fh:
                  return list(csv.DictReader(fh, delimiter='\t'))

          old = rows(old_path)
          new = rows(new_path)
          trace = rows(trace_path)
          if len(old) != 12672 or len(new) != 12672 or len(trace) != 1152:
              raise SystemExit(f'ROW_COUNT_FAIL old={len(old)} new={len(new)} trace={len(trace)}')

          census_key = lambda r: (r['owner_genre'], r['recipe_name'], r['identity_ordinal'], r['P_level'])
          trace_key = lambda r: (r['owner'], r['profile'], r['identity'], r['level'])
          old_by = {census_key(r): r for r in old}
          new_by = {census_key(r): r for r in new}
          trace_by = {trace_key(r): r for r in trace}
          if len(old_by) != 12672 or len(new_by) != 12672 or len(trace_by) != 1152:
              raise SystemExit('DUPLICATE_KEY_FAIL')

          changed_rows = 0
          non_acid_changed = 0
          field_counts = Counter()
          combos = Counter()
          bass_same_downstream = 0
          unexplained = 0
          changed_owner = Counter()

          for key in old_by:
              a, b = old_by[key], new_by[key]
              diffs = [name for name in a if a[name] != b[name]]
              if not diffs:
                  continue
              changed_rows += 1
              if key[0] != 'Acid' or key[1] not in {'BASE','Chicago Jack','Rolling Acid'}:
                  non_acid_changed += 1
              changed_owner[key[1]] += 1
              field_counts.update(diffs)
              bass = 'bass_identity' in diffs
              chord = 'chord_identity' in diffs
              melodic = 'melodic_identity' in diffs
              motif = 'motif_identity' in diffs
              if not bass and (chord or melodic or motif):
                  bass_same_downstream += 1
              if bass:
                  combos[(chord, melodic, motif)] += 1

          expected_fields = Counter({
              'materialized_signature': 948,
              'bass_identity': 948,
              'chord_identity': 681,
              'melodic_identity': 687,
              'motif_identity': 519,
          })
          if changed_rows != 948 or non_acid_changed != 0 or field_counts != expected_fields:
              raise SystemExit(f'CENSUS_DELTA_FAIL changed={changed_rows} non_acid={non_acid_changed} fields={field_counts}')
          if changed_owner != Counter({'BASE':333, 'Chicago Jack':294, 'Rolling Acid':321}):
              raise SystemExit(f'OWNER_DELTA_FAIL {changed_owner}')
          expected_combos = Counter({
              (False,False,False): 51,
              (False,True,False): 39,
              (False,True,True): 177,
              (True,False,False): 210,
              (True,True,False): 129,
              (True,True,True): 342,
          })
          if combos != expected_combos or bass_same_downstream != 0:
              raise SystemExit(f'COMBINATION_FAIL combos={combos} bass_same_downstream={bass_same_downstream}')

          seed_stats = Counter()
          representatives = {}
          classes = {
              'A': (True, True, True),
              'B': (True, False, False),
              'C': (False, True, True),
              'D': (False, False, False),
          }

          for key, t in trace_by.items():
              old_row = old_by.get(key)
              new_row = new_by.get(key)
              if old_row is None or new_row is None:
                  unexplained += 1
                  continue
              for role in ('bass','chord','melodic','motif'):
                  col = 'bass_identity' if role == 'bass' else f'{role}_identity'
                  trace_old = t['old_bass_id'] if role == 'bass' else t[f'{role}_id_old']
                  trace_new = t['new_bass_id'] if role == 'bass' else t[f'{role}_id_new']
                  if trace_old != old_row[col] or trace_new != new_row[col]:
                      unexplained += 1

              b = t['old_bass_id'] != t['new_bass_id']
              c = t['chord_id_old'] != t['chord_id_new']
              m = t['melodic_id_old'] != t['melodic_id_new']
              o = t['motif_id_old'] != t['motif_id_new']

              if t['bass_seed_old'] != t['bass_seed_new'] or t['bass_draw_old'] != t['bass_draw_new']:
                  unexplained += 1
              if not b:
                  if (t['chord_seed_old'] != t['chord_seed_new'] or
                      t['melodic_seed_old'] != t['melodic_seed_new'] or
                      t['motif_seed_old'] != t['motif_seed_new'] or c or m or o):
                      unexplained += 1
              else:
                  seed_stats['bass_changed'] += 1
                  if t['chord_seed_old'] != t['chord_seed_new']:
                      seed_stats['chord_seed_changed'] += 1
                  if t['melodic_seed_old'] != t['melodic_seed_new']:
                      seed_stats['melodic_seed_changed'] += 1
                  if m:
                      if t['motif_seed_old'] != t['motif_seed_new']:
                          seed_stats['motif_seed_changed_when_melodic_changed'] += 1
                  else:
                      if t['motif_seed_old'] == t['motif_seed_new']:
                          seed_stats['motif_seed_same_when_melodic_same'] += 1
                      else:
                          unexplained += 1
                  signature = (c,m,o)
                  for label, wanted in classes.items():
                      if signature == wanted and label not in representatives:
                          representatives[label] = t

          if unexplained != 0:
              raise SystemExit(f'UNEXPLAINED_DELTA {unexplained}')
          if seed_stats['bass_changed'] != 948 or seed_stats['chord_seed_changed'] != 948 or seed_stats['melodic_seed_changed'] != 948:
              raise SystemExit(f'DOWNSTREAM_SEED_CHAIN_FAIL {seed_stats}')
          if seed_stats['motif_seed_changed_when_melodic_changed'] != 687:
              raise SystemExit(f'MOTIF_SEED_CHANGED_COUNT_FAIL {seed_stats}')
          if seed_stats['motif_seed_same_when_melodic_same'] != 261:
              raise SystemExit(f'MOTIF_SEED_SAME_COUNT_FAIL {seed_stats}')
          if set(representatives) != set(classes):
              raise SystemExit(f'REPRESENTATIVE_CLASS_MISSING {set(classes)-set(representatives)}')

          summary = [
              'rng_model=STATELESS_DOMAIN',
              'hypothesis=H2_CONFIRMED',
              'H1_SHARED_STREAM=REJECTED',
              'H3_ADMISSIBILITY=NOT_OBSERVED',
              'total_rows=12672',
              'acid_trace_rows=1152',
              'changed_rows=948',
              'non_acid_changed=0',
              'bass_changed=948',
              'bass_same_downstream_changed=0',
              'chord_changed=681',
              'melodic_changed=687',
              'motif_changed=519',
              'bass_changed_only=51',
              'all_four_changed=342',
              'unexplained=0',
              'unexpected=0',
              'old_bass_total_weight=345',
              'new_bass_total_weight=445',
              'bass_seed_changed=0',
              'bass_draw_changed=0',
              'chord_seed_changed_given_bass_changed=948',
              'melodic_seed_changed_given_bass_changed=948',
              'motif_seed_changed_given_melodic_changed=687',
              'motif_seed_same_given_melodic_same=261',
          ]
          for (c,m,o), count in sorted(combos.items()):
              summary.append(f'combo bass=1 chord={int(c)} melodic={int(m)} motif={int(o)} rows={count}')
          for owner in ('BASE','Chicago Jack','Rolling Acid'):
              summary.append(f'owner_changed[{owner}]={changed_owner[owner]}')
          for label in ('A','B','C','D'):
              r = representatives[label]
              summary.append(
                  f'representative[{label}]={r["profile"]}/identity={r["identity"]}/{r["level"]};'
                  f'bass={r["old_bass_id"]}->{r["new_bass_id"]};'
                  f'chord={r["chord_id_old"]}->{r["chord_id_new"]};'
                  f'melodic={r["melodic_id_old"]}->{r["melodic_id_new"]};'
                  f'motif={r["motif_id_old"]}->{r["motif_id_new"]}'
              )

          (build / 'analysis-summary.txt').write_text('\n'.join(summary) + '\n')
          print('\n'.join(summary))

          committed_trace = Path('docs/research/GF2_G4_I6_R1_C1_SELECTION_CAUSALITY.tsv')
          if committed_trace.exists():
              if committed_trace.read_bytes() != trace_path.read_bytes():
                  raise SystemExit('COMMITTED_CAUSALITY_TRACE_STALE')
              print('committed_causality_trace=UP_TO_DATE')
          else:
              print('committed_causality_trace=PENDING')
          PY

      - name: Verify production and evidence freeze
        shell: bash
        run: |
          git diff --name-only 47e09186c1ade6cca8ed79c567fca919399fb98e...HEAD > build/host-tests/gf2-g4-i6-r1-c1/changed-since-old-evidence.txt
          test -z "$(git diff --name-only f411300cf6d011caddd5a1d793b39338eba01468...HEAD -- 'src/**')"
          test -z "$(git diff --name-only f411300cf6d011caddd5a1d793b39338eba01468...HEAD -- docs/research/GF2_G4_I6_OWNERSHIP_CENSUS.tsv docs/research/GF2_G4_I6_OWNERSHIP_ANOMALIES.tsv)"
          echo 'production_changes=NONE'
          echo 'committed_i6_evidence_changes=NONE'

      - name: Upload C1 causal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-i6-r1-c1-selection-causality
          path: |
            build/host-tests/gf2-g4-i6-r1-c1/
            build/host-tests/gf2-g4-i6/run-a/GF2_G4_I6_OWNERSHIP_CENSUS.tsv
            build/host-tests/gf2-g4-i6/run-a/GF2_G4_I6_OWNERSHIP_ANOMALIES.tsv
          if-no-files-found: error
