name: Groove Vocabulary Stage 1 and 2 final temporary size audit

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  firmware-size-audit:
    if: github.event.pull_request.head.ref == 'agent/20260808-04-groove-vocabulary-stage2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install pinned M5Stack dependencies
        run: bash scripts/install_arduino_deps.sh

      - name: Build all measured revisions
        env:
          DEV_SHA: 18f1e49d2eda0528f758bbe0d374e5699f18857c
          STAGE1_SHA: 17d89391ebd20562732ac09f5d0eceba16b83c26
          STAGE2_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/groove-vocabulary-stage12-size.tsv"
          printf 'revision\tprofile\tsha\ttext\tdata\tbss\tdram_data\tdram_bss\tdram_total\tbin_bytes\n' > "$REPORT"

          size_tool() {
            find "$HOME/.arduino15/packages" -type f -name xtensa-esp32s3-elf-size -perm -111 -print \
              | sort -V | tail -n 1
          }

          collect() {
            local revision="$1" profile="$2" sha="$3" build_dir="$4"
            local elf="$build_dir/GroovePuter.ino.elf"
            local bin="$build_dir/GroovePuter.ino.bin"
            local tool
            tool="$(size_tool)"
            test -x "$tool" && test -f "$elf" && test -f "$bin"
            read -r text data bss _ < <("$tool" "$elf" | awk 'NR==2 {print $1, $2, $3, $4}')
            read -r dram_data dram_bss < <(
              "$tool" -A "$elf" | awk '
                $1 == ".dram0.data" { data = $2 }
                $1 == ".dram0.bss" { bss = $2 }
                END { print data + 0, bss + 0 }
              '
            )
            local dram_total=$((dram_data + dram_bss))
            local bin_bytes
            bin_bytes="$(stat -c %s "$bin")"
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$revision" "$profile" "$sha" "$text" "$data" "$bss" \
              "$dram_data" "$dram_bss" "$dram_total" "$bin_bytes" >> "$REPORT"
          }

          build_revision() {
            local revision="$1" sha="$2"
            git checkout --force "$sha"
            local normal="$RUNNER_TEMP/${revision}-normal"
            local midi="$RUNNER_TEMP/${revision}-midi-only"
            BUILD_PATH="$normal" bash scripts/build.sh --warnings all
            bash scripts/check_cardputer_dram_budget.sh "$normal/GroovePuter.ino.elf"
            collect "$revision" normal "$sha" "$normal"
            BUILD_PATH="$midi" bash scripts/build_seqtrak_midi_only.sh --warnings all
            collect "$revision" midi-only "$sha" "$midi"
          }

          git fetch origin "$DEV_SHA" "$STAGE1_SHA" "$STAGE2_SHA"
          build_revision dev "$DEV_SHA"
          build_revision stage1 "$STAGE1_SHA"
          build_revision stage2 "$STAGE2_SHA"
          cat "$REPORT"
          cp "$REPORT" "$GITHUB_WORKSPACE/groove-vocabulary-stage12-size.tsv"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: groove-vocabulary-stage12-size-audit
          path: groove-vocabulary-stage12-size.tsv
          if-no-files-found: error
