name: TEMP U4B1 Green Builder

on:
  push:
    branches:
      - tmp/20260906-ui-u4b1-green-builder

permissions:
  contents: write

jobs:
  build-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: tmp/20260906-ui-u4b1-green-builder

      - name: Apply guarded U4B1 renderer patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/ui/pages/synth_sequencer_page.cpp')
          s = p.read_text()

          def replace_one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor count={count}')
              return text.replace(old, new, 1)

          if 'phrase_notes_lane_layout.h' in s:
              raise SystemExit('U4B1 renderer already wired')

          s = replace_one(
              s,
              '#include "../phrase_notes_projection.h"\n#include "../phrase_notes_viewport.h"\n',
              '#include "../phrase_notes_projection.h"\n#include "../phrase_notes_lane_layout.h"\n#include "../phrase_notes_viewport.h"\n',
              'include')

          s = replace_one(
              s,
              '''  const uint32_t windowEndSubtick = windowStartSubtick + windowSubticks;\n\n  gfx.drawRect(timelineX, timelineY, timelineW, maxRows * rowH, COLOR_LABEL);\n''',
              '''  const uint32_t windowEndSubtick = windowStartSubtick + windowSubticks;\n  const PhraseNotesLaneLayout::Layout laneLayout = PhraseNotesLaneLayout::build(\n      phrase, windowStartSubtick, windowSubticks,\n      static_cast<uint8_t>(maxRows));\n\n  gfx.drawRect(timelineX, timelineY, timelineW, maxRows * rowH, COLOR_LABEL);\n''',
              'layout build')

          s = replace_one(
              s,
              '''    const int row = i % maxRows;\n    const int y = timelineY + row * rowH + 2;\n''',
              '''    const uint8_t lane = laneLayout.laneByEvent[i];\n    if (lane == PhraseNotesLaneLayout::kOverflowLane) continue;\n    const int row = static_cast<int>(lane);\n    const int y = timelineY + row * rowH + 2;\n''',
              'row mapping')

          p.write_text(s)
          PY

      - name: Verify focused U4B1 gate
        shell: bash
        run: bash tests/run_ui_constitution_u4b1_tests.sh

      - name: Verify diff scope
        shell: bash
        run: |
          git diff --check
          printf '%s\n' src/ui/pages/synth_sequencer_page.cpp > /tmp/expected
          git diff --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual

      - name: Commit GREEN
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/pages/synth_sequencer_page.cpp
          git commit -m 'feat(ui): render Phrase events on temporal lanes'
          git push origin HEAD:tmp/20260906-ui-u4b1-green-builder
