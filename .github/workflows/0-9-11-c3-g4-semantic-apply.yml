name: 0.9.11 C3 G4 Final Gate

on:
  push:
    branches:
      - feature/20260913-c3-g4-exec
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-c3-g4:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove C3 production lineage
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3dcd53d5c759f0607364b254f060b4875094fcfc HEAD

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-gfx-dev pkg-config

      - name: G4 C0 materialized and cross-genre corpus
        run: bash tests/run_gf2_g4_c0_tests.sh

      - name: G4 I3 phrase truthfulness
        run: bash tests/run_gf2_g4_i3_tests.sh

      - name: G4 I4 Dub Techno structural ownership
        run: bash tests/run_gf2_g4_i4_tests.sh

      - name: G4 I5 House structural ownership
        run: bash tests/run_gf2_g4_i5_tests.sh

      - name: Stage15 tonal integration
        run: bash tests/run_stage15_tonal_integration_tests.sh

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install pinned M5Stack dependencies
        run: bash scripts/install_arduino_deps.sh

      - name: Build Cardputer ADV product image
        shell: bash
        run: |
          set -euo pipefail
          BUILD_PATH="${GITHUB_WORKSPACE}/build/c3-cardputer-product" \
            bash scripts/build_cardputer_memory_baseline.sh normal product --warnings all

      - name: Enforce Cardputer DRAM budget
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check_cardputer_dram_budget.sh \
            "${GITHUB_WORKSPACE}/build/c3-cardputer-product/GroovePuter.ino.elf"

      - name: Prove verification did not mutate tracked source
        run: |
          set -euo pipefail
          git diff --exit-code
