name: 0.9.11 C3 G4 Semantic Apply

on:
  push:
    branches:
      - feature/20260913-c3-g4-exec
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-g4:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prove exact C2 lineage
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d24a54396ee3ef8ccac2d924d7958f6a3bf2327c HEAD
      - name: Apply deterministic G4 production delta
        run: |
          set -euo pipefail
          python3 tools/c3_g4_semantic_patch.py
          git diff --check
          git diff --stat
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-gfx-dev pkg-config
      - name: G4 C0 cross-genre materialization
        run: bash tests/run_gf2_g4_c0_tests.sh
      - name: G4 I3 phrase truthfulness
        run: bash tests/run_gf2_g4_i3_tests.sh
      - name: G4 I4 Dub Techno structural ownership
        run: bash tests/run_gf2_g4_i4_tests.sh
      - name: G4 I5 House structural ownership
        run: bash tests/run_gf2_g4_i5_tests.sh
      - name: Publish bounded G4 production commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generation/composition/generation_profile.cpp \
                  src/generation/composition/rhythm_selection.cpp \
                  src/generation/migration/phrase_execution.cpp
          unexpected="$(git diff --cached --name-only | grep -Ev '^(src/generation/composition/(generation_profile|rhythm_selection)\.cpp|src/generation/migration/phrase_execution\.cpp)$' || true)"
          test -z "${unexpected}"
          git commit -m "feat(c3): transplant G4 genre ownership semantics"
          git push origin HEAD:feature/20260913-c3-g4-exec
