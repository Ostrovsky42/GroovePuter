name: Tape resource recovery

on:
  pull_request:
    paths:
      - "src/dsp/tape_fx.cpp"
      - "src/dsp/tape_fx.h"
      - "src/dsp/tape_looper.cpp"
      - "src/dsp/tape_looper.h"
      - "src/dsp/miniacid_engine.cpp"
      - "scenes.h"
      - "tests/test_tape_unavailable_contract.cpp"
      - "tests/test_tape_resource_recovery_source_regressions.py"
      - "tests/run_tape_resource_recovery_tests.sh"
      - "docs/releases/0_9_4_TRACK_A_RESOURCE_RECOVERY.md"
      - ".github/workflows/tape-resource-recovery.yml"
  push:
    branches:
      - dev_0.9.4
    paths:
      - "src/dsp/tape_fx.cpp"
      - "src/dsp/tape_fx.h"
      - "src/dsp/tape_looper.cpp"
      - "src/dsp/tape_looper.h"
      - "src/dsp/miniacid_engine.cpp"
      - "scenes.h"
      - "tests/test_tape_unavailable_contract.cpp"
      - "tests/test_tape_resource_recovery_source_regressions.py"
      - "tests/run_tape_resource_recovery_tests.sh"
      - "docs/releases/0_9_4_TRACK_A_RESOURCE_RECOVERY.md"
      - ".github/workflows/tape-resource-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tape-resource-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run Tape resource-recovery contracts
        run: bash tests/run_tape_resource_recovery_tests.sh
