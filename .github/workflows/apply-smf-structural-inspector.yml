name: Apply SMF Structural Inspector

on:
  push:
    branches:
      - agent/smf-structural-inspector
    paths:
      - tools/apply_smf_structural_inspector.py
      - .github/workflows/apply-smf-structural-inspector.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded Stage 1B patches
        run: python3 tools/apply_smf_structural_inspector.py
      - name: Run host tests
        run: bash tests/run_host_tests.sh
      - name: Commit integrated implementation
        run: |
          rm tools/apply_smf_structural_inspector.py
          rm .github/workflows/apply-smf-structural-inspector.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: integrate SMF structural inspector"
          git push
