name: 0.9.11 M-WORKING Task 3 apply

on:
  push:
    branches:
      - feature/20260911-0.9.11-m-working-green

permissions:
  contents: write

jobs:
  apply-task3:
    if: "${{ github.event.head_commit.message == 'ci(0.9.11): apply Task 3 working storage rewrite' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/20260911-0.9.11-m-working-green

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libsdl2-dev \
            libsdl2-gfx-dev

      - name: Apply guarded Task 3 rewrite
        run: |
          python3 tests/apply_m_working_task3.py
          git diff --check
          if git grep -n 'currentPhrase_' -- src/dsp/miniacid_engine.h src/dsp/miniacid_engine.cpp; then
            echo 'Task 3 STOP: currentPhrase_ remains in engine source' >&2
            exit 1
          fi
          git diff -- src/dsp/miniacid_engine.h src/dsp/miniacid_engine.cpp

      - name: Verify bounded storage
        run: bash tests/run_0_9_11_m_working_storage_tests.sh

      - name: Verify Melody compatibility after physical replacement
        run: bash tests/run_0_9_11_m_working_melody_compat_tests.sh

      - name: Verify M3 and M4 material causality
        run: |
          bash tests/run_m3_material_authority_tests.sh
          bash tests/run_m4_next_material_tests.sh

      - name: Verify A2-B promotion transaction baseline
        run: bash tests/run_0_9_11_a2b_promotion_transaction_tests.sh

      - name: Commit verified Task 3 production change
        run: |
          test -n "$(git status --porcelain -- src/dsp/miniacid_engine.h src/dsp/miniacid_engine.cpp)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dsp/miniacid_engine.h src/dsp/miniacid_engine.cpp
          git commit -m 'refactor(0.9.11): reuse phrase buffer as working storage'
          git push origin HEAD:feature/20260911-0.9.11-m-working-green
