name: R1 Embedded Diagnostics

on:
  push:
    branches:
      - feature/20260908-01-test-liveness-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cardputer-base:
    name: Diagnostic Cardputer — exact M4 base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9d959174cdc8be120f995ba64d507abbcaff6dbe
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"
      - name: Install pinned M5Stack dependencies
        run: bash scripts/install_arduino_deps.sh
      - name: Compile and capture
        shell: bash
        run: |
          set +e
          bash scripts/build.sh --warnings all > cardputer-base.log 2>&1
          rc=$?
          cat cardputer-base.log
          exit "$rc"
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-cardputer-base-log
          path: cardputer-base.log

  cardputer-head:
    name: Diagnostic Cardputer — exact R1 head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"
      - name: Install pinned M5Stack dependencies
        run: bash scripts/install_arduino_deps.sh
      - name: Compile and capture
        shell: bash
        run: |
          set +e
          bash scripts/build.sh --warnings all > cardputer-head.log 2>&1
          rc=$?
          cat cardputer-head.log
          exit "$rc"
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-cardputer-head-log
          path: cardputer-head.log

  seqtrak-base:
    name: Diagnostic SEQTRAK — exact M4 base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9d959174cdc8be120f995ba64d507abbcaff6dbe
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"
      - name: Install pinned M5Stack dependencies
        run: bash scripts/install_arduino_deps.sh
      - name: Compile and capture
        shell: bash
        run: |
          set +e
          bash scripts/build_seqtrak_midi_only.sh --warnings all > seqtrak-base.log 2>&1
          rc=$?
          cat seqtrak-base.log
          exit "$rc"
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-seqtrak-base-log
          path: seqtrak-base.log

  seqtrak-head:
    name: Diagnostic SEQTRAK — exact R1 head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"
      - name: Install pinned M5Stack dependencies
        run: bash scripts/install_arduino_deps.sh
      - name: Compile and capture
        shell: bash
        run: |
          set +e
          bash scripts/build_seqtrak_midi_only.sh --warnings all > seqtrak-head.log 2>&1
          rc=$?
          cat seqtrak-head.log
          exit "$rc"
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-seqtrak-head-log
          path: seqtrak-head.log

  stage12-head:
    name: Diagnostic Stage 12 — exact R1 head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Run and capture Stage 12
        shell: bash
        env:
          ASAN_OPTIONS: "detect_leaks=0"
        run: |
          set +e
          bash tests/run_phrase_stage12_tests.sh > stage12-head.log 2>&1
          rc=$?
          cat stage12-head.log
          exit "$rc"
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-stage12-head-log
          path: stage12-head.log
