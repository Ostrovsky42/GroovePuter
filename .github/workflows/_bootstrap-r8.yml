name: bootstrap R8 keymap

on:
  push:
    branches:
      - agent/20260817-0.9.8-r8-global-ctrl-z

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/20260817-0.9.8-r8-global-ctrl-z
      - name: Patch current key contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, expected=1):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != expected:
                  raise SystemExit(f"{path}: expected {expected}, found {s.count(old)} for {old!r}")
              p.write_text(s.replace(old, new))

          rep('src/ui/undo_ux.h', "event.scancode == GROOVEPUTER_U || event.key == 'u' || event.key == 'U' ||\n         key == 21;  // Ctrl+U control character on terminals/Cardputer paths.", "event.scancode == GROOVEPUTER_Z || event.key == 'z' || event.key == 'Z' ||\n         key == 26;  // Ctrl+Z control character on terminals/Cardputer paths.")
          rep('src/ui/miniacid_display.cpp', 'this layer only promotes Ctrl+U to APP_EVENT_UNDO.', 'this layer only promotes Ctrl+Z to APP_EVENT_UNDO.')
          rep('src/ui/pages/tb303_params_page.cpp', "if (lowerKey == 'z') { withAudioGuard([&]() { mini_acid_.set303Parameter(TB303ParamId::Cutoff, 800.0f, voice_index_); }); return true; }", "if (lowerKey == 'a') { withAudioGuard([&]() { mini_acid_.set303Parameter(TB303ParamId::Cutoff, 800.0f, voice_index_); }); return true; }")
          rep('src/ui/global_help_content.h', '"Ctrl+U      Undo last edit"', '"Ctrl+Z      Undo last edit"')
          rep('src/ui/global_help_content.h', '"Ctrl+Z/X/C/V Reset parameter"', '"Ctrl+A/X/C/V Reset parameter"', 2)
          rep('src/ui/docs/keys.md', '| `Ctrl+U` | Undo last retained Pattern / Song / Phrase edit |', '| `Ctrl+Z` | Undo last retained Pattern / Song / Phrase edit |')
          rep('src/ui/docs/keys.md', '| `N/M` | Distortion / Delay |', '| `N/M` | Distortion / Delay |\n| `Ctrl+A/X/C/V` | Reset Cutoff / Resonance / Env Amount / Env Decay |')
          Path('.github/workflows/_bootstrap-r8.yml').unlink()
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m '0.9.8-R8: reserve Ctrl+Z for global Undo'
          git push origin HEAD:agent/20260817-0.9.8-r8-global-ctrl-z
