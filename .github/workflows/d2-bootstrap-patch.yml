name: D2 exact integration patch

on:
  push:
    branches:
      - agent/20260821-02-0.9.9-d2-phrase-live-arrangement
    paths:
      - 'tools/d2_bootstrap_patch.py'
      - '.github/workflows/d2-bootstrap-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/20260821-02-0.9.9-d2-phrase-live-arrangement
          fetch-depth: 0
      - name: Apply exact D2 integration patch
        run: python3 tools/d2_bootstrap_patch.py
      - name: Commit source-only result and remove bootstrap files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/dsp/miniacid_engine.cpp src/ui/pages/phrase_page.cpp
          git rm -- tools/d2_bootstrap_patch.py .github/workflows/d2-bootstrap-patch.yml
          git commit -m "0.9.9-D2: integrate live Phrase boundary and UI"
          git push origin HEAD:agent/20260821-02-0.9.9-d2-phrase-live-arrangement
