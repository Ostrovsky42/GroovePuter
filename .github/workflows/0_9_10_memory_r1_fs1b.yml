name: 0.9.10 MEMORY-R1 FS1B

on:
  push:
    branches:
      - feature/20260908-0.9.10-memory-r1-dram-recovery
    paths:
      - 'scripts/build_fatfs_dynbuffers_candidate.sh'
      - 'scripts/build_cardputer_memory_r1_fs1b.sh'
      - 'scripts/compare_cardputer_memory_r1_fs1b_static.sh'
      - 'tests/test_memory_r1_fs1b_source_contract.py'
      - 'tests/test_memory_r1_fs1b_realtime_fs_contract.py'
      - '.github/workflows/0_9_10_memory_r1_fs1b.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fs1b-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prove FS1B source/link contract
        run: python3 tests/test_memory_r1_fs1b_source_contract.py
      - name: Prove filesystem allocation stays outside hard realtime
        run: python3 tests/test_memory_r1_fs1b_realtime_fs_contract.py

  cardputer-stock-vs-candidate:
    needs: fs1b-source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: arduino/setup-arduino-cli@v2
      - name: Install pinned Cardputer dependencies
        run: bash scripts/install_arduino_deps.sh
      - name: Fetch exact ESP-IDF source object
        run: |
          set -euo pipefail
          git init "$HOME/esp-idf"
          git -C "$HOME/esp-idf" remote add origin https://github.com/espressif/esp-idf.git
          git -C "$HOME/esp-idf" fetch --depth=1 origin 858a988d6eb90f54661abe282c523879c6ad0116
      - name: Build same-HEAD stock and candidate, then compare ELF DRAM
        run: bash scripts/compare_cardputer_memory_r1_fs1b_static.sh --warnings all
