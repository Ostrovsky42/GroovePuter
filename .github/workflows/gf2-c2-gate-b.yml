name: GF2-C2 Gate B materialized capacity

on:
  push:
    branches:
      - research/20260903-05-0.9.10-gf2-c2-gate-b-materialized-capacity
  pull_request:
    paths:
      - 'tools/gf2_gate_b.py'
      - 'tools/gf2/gf2_gate_b_dump.cpp'
      - 'tests/test_gf2_gate_b_analysis.py'
      - 'tests/run_gf2_gate_b_tests.sh'
      - 'tests/run_gf2_gate_b_dump_tests.sh'
      - 'tests/support/gf2_gate_b_*'
      - 'docs/research/GF2_GATE_B_*'
      - '.github/workflows/gf2-c2-gate-b.yml'
  workflow_dispatch:

jobs:
  gate-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen base and source firewall
        shell: bash
        run: |
          set -euo pipefail
          BASE=9c01b0c34b80aacb1dd6be66bb07c5cef3ad1c38
          git cat-file -e "${BASE}^{commit}"
          git diff --check "${BASE}...HEAD"
          test -z "$(git diff --name-only "${BASE}...HEAD" -- src/)"
      - name: Execute production-backed corpus dump
        run: bash tests/run_gf2_gate_b_dump_tests.sh
      - name: Gate B analysis contract
        run: python3 tests/test_gf2_gate_b_analysis.py
      - name: Generate review artifacts
        run: |
          rm -rf build/host-tests/gf2-gate-b/generated
          python3 tools/gf2_gate_b.py \
            --raw build/host-tests/gf2-gate-b/raw.tsv \
            --seeds tests/support/gf2_gate_b_seeds.tsv \
            --contract tests/support/gf2_gate_b_contract.json \
            --output-dir build/host-tests/gf2-gate-b/generated
      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gf2-gate-b-generated
          path: build/host-tests/gf2-gate-b/generated
          if-no-files-found: error
