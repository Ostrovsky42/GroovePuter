name: Scale quantization correctness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scale-quantization-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scale quantization matrix
        env:
          ASAN_OPTIONS: "detect_leaks=0"
        run: bash tests/run_scale_quantization_tests.sh
