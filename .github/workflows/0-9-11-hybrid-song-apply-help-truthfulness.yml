name: 0.9.11 Apply Song help truthfulness patch

on:
  push:
    branches:
      - research/20260909-01-hybrid-song-orchestration-ux
    paths:
      - ".github/workflows/0-9-11-hybrid-song-apply-help-truthfulness.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/20260909-01-hybrid-song-orchestration-ux
          fetch-depth: 0

      - name: Apply exact Song help patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/ui/help_dialog_frames.h")
          text = path.read_text(encoding="utf-8")
          old = '  drawHelpItem(gfx, layout.left_x, left_y, "G", "Generate new song", IGfxColor::Cyan());'
          new = '  drawHelpItem(gfx, layout.left_x, left_y, "G / Gx2", "gen cell / row", IGfxColor::Cyan());'
          assert text.count(old) == 1, "Song help source shape changed"
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify focused and inherited source contracts
        run: |
          python3 tests/test_hybrid_song_orchestration_ui_source_regressions.py
          python3 tests/test_song_generation_source_regressions.py
          python3 tests/test_phrase_ui_source_regressions.py
          git diff --check

      - name: Show bounded diff
        run: git diff -- src/ui/help_dialog_frames.h

      - name: Commit verified help patch and remove one-shot workflow
        run: |
          rm .github/workflows/0-9-11-hybrid-song-apply-help-truthfulness.yml
          git config user.name "GroovePuter CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/ui/help_dialog_frames.h .github/workflows/0-9-11-hybrid-song-apply-help-truthfulness.yml
          git commit -m "fix(ui): make Song generation help truthful"
          git push origin HEAD:research/20260909-01-hybrid-song-orchestration-ux
