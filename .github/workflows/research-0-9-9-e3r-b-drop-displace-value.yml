name: Research 0.9.9 E3R-B DROP DISPLACE value

on:
  pull_request:
    branches:
      - integration/20260825-01-0.9.9-e3a-v0r-research-base
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run E3R-B graph, E3a and cumulative contracts
        run: bash tests/run_0_9_9_e3r_b_tests.sh

      - name: Upload E3R-B graph and review corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e3r-b-drop-displace-value
          if-no-files-found: warn
          path: |
            build/host-tests/e3r-b-drop-displace-value/gcc-run1.raw
            build/host-tests/e3r-b-drop-displace-value/gcc-run1-report/
            build/host-tests/e3r-b-frozen-baseline/gcc-run1.raw
            build/host-tests/e3r-b-frozen-baseline/gcc-run1-report/

  full-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: E3R-B source guard
        run: python3 tests/test_0_9_9_e3r_b_source_guard.py

      - name: Full host regressions
        run: bash tests/run_host_tests.sh
