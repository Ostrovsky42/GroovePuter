name: Apply song playhead repair

on:
  push:
    branches:
      - fix/song-playhead-advance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/song-playhead-advance
          fetch-depth: 0

      - name: Apply bounded Song playhead repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          engine = "src/dsp/miniacid_engine.cpp"
          header = "src/dsp/miniacid_engine.h"
          runner = "tests/run_host_tests.sh"

          replace_once(
              engine,
              '#include "miniacid_engine.h"\n\n#if defined(ARDUINO)',
              '#include "miniacid_engine.h"\n#include "song_cycle_boundary.h"\n\n#if defined(ARDUINO)',
          )
          replace_once(engine, "  songStepCounter_ = 0;", "  songBarIndex_ = -1;")
          replace_once(
              engine,
              "  currentTimingOffset_ = 0;\n  if (songMode_) {",
              "  currentTimingOffset_ = 0;\n  songBarIndex_ = -1;\n  if (songMode_) {",
          )
          replace_once(
              engine,
              "  currentTick_ = 0;\n  gateCountdownA_ = 0;",
              "  currentTick_ = 0;\n  songBarIndex_ = -1;\n  gateCountdownA_ = 0;",
          )
          replace_once(
              engine,
              """int MiniAcid::cycleBarIndex() const {
  int bars = cycleBarCount();
  int cycleSteps = SEQ_STEPS * bars;
  if (cycleSteps <= 0) return 0;
  int step = songStepCounter_ - 1;
  if (step < 0) step = cycleSteps - 1;
  if (step < 0) step = 0;
  step %= cycleSteps;
  int bar = step / SEQ_STEPS;
  if (bar < 0) bar = 0;
  if (bar >= bars) bar = bars - 1;
  return bar;
}
""",
              """int MiniAcid::cycleBarIndex() const {
  int bars = cycleBarCount();
  int bar = songBarIndex_;
  if (bar < 0) bar = 0;
  if (bar >= bars) bar = bars - 1;
  return bar;
}
""",
          )
          replace_once(
              engine,
              "  if (enabled == songMode_) return;\n  if (playing) publishPatternAllNotesOff_();",
              "  if (enabled == songMode_) return;\n  songBarIndex_ = -1;\n  if (playing) publishPatternAllNotesOff_();",
          )
          replace_once(
              engine,
              "  sceneManager_.setSongPosition(pos);\n  if (!playing) songPlayheadPosition_ = pos;",
              "  sceneManager_.setSongPosition(pos);\n  songBarIndex_ = -1;\n  if (!playing) songPlayheadPosition_ = pos;",
          )
          replace_once(
              engine,
              "void MiniAcid::setActiveSongSlot(int slot) {\n  sceneManager_.setActiveSongSlot(slot);",
              "void MiniAcid::setActiveSongSlot(int slot) {\n  sceneManager_.setActiveSongSlot(slot);\n  songBarIndex_ = -1;",
          )
          replace_once(
              engine,
              "  songPlaybackSlot_ = slot;\n  if (songMode_) applySongPositionSelection();",
              "  songPlaybackSlot_ = slot;\n  songBarIndex_ = -1;\n  if (songMode_) applySongPositionSelection();",
          )
          replace_once(
              engine,
              "  liveMixMode_ = enabled;\n  if (!liveMixMode_) {",
              "  liveMixMode_ = enabled;\n  songBarIndex_ = -1;\n  if (!liveMixMode_) {",
          )
          replace_once(
              engine,
              "  songPlayheadPosition_ = clampSongPosition(sceneManager_.getSongPosition());\n  if (songMode_) {",
              "  songPlayheadPosition_ = clampSongPosition(sceneManager_.getSongPosition());\n  songBarIndex_ = -1;\n  if (songMode_) {",
          )
          replace_once(engine, "    advanceSongStep_();", "    advanceSongBar_();")
          replace_once(
              engine,
              """void MiniAcid::advanceSongStep_() {
  int patternBars = sceneManager_.currentScene().feel.patternBars;
  if (patternBars != 1 && patternBars != 2 && patternBars != 4 && patternBars != 8) patternBars = 1;
  int cycleSteps = SEQ_STEPS * patternBars;

  bool wrapped = false;
  songStepCounter_++;
  if (songStepCounter_ >= cycleSteps) {
    songStepCounter_ = 0;
    wrapped = true;
  }

  if (wrapped) {
    cyclePulseCounter_++;
    if (songMode_) {
      if (songReverseTogglePending_) {
        sceneManager_.setSongReverse(!sceneManager_.isSongReverse());
        songReverseTogglePending_ = false;
      }
      advanceSongPlayhead();
    }
  }
}
""",
              """void MiniAcid::advanceSongBar_() {
  const SongCycleBoundary boundary = nextSongCycleBoundary(
      songBarIndex_, sceneManager_.currentScene().feel.patternBars);
  songBarIndex_ = boundary.barIndex;

  if (boundary.advanceRow) {
    cyclePulseCounter_++;
    if (songMode_) {
      if (songReverseTogglePending_) {
        sceneManager_.setSongReverse(!sceneManager_.isSongReverse());
        songReverseTogglePending_ = false;
      }
      advanceSongPlayhead();
    }
  }
}
""",
          )

          replace_once(header, "  void advanceSongStep_();", "  void advanceSongBar_();")
          replace_once(header, "  int songStepCounter_ = 0;", "  int songBarIndex_ = -1;")

          Path("src/dsp/song_cycle_boundary.h").write_text(
              """#pragma once

struct SongCycleBoundary {
  int barIndex;
  bool advanceRow;
};

inline int normalizedSongPatternBars(int patternBars) {
  return (patternBars == 1 || patternBars == 2 ||
          patternBars == 4 || patternBars == 8)
      ? patternBars
      : 1;
}

inline SongCycleBoundary nextSongCycleBoundary(int barIndex, int patternBars) {
  const int bars = normalizedSongPatternBars(patternBars);
  if (barIndex < 0) return {0, false};

  const int nextBar = barIndex + 1;
  if (nextBar >= bars) return {0, true};
  return {nextBar, false};
}
""",
              encoding="utf-8",
          )

          Path("tests/test_song_cycle_boundary.cpp").write_text(
              """#include \"../src/dsp/song_cycle_boundary.h\"

#include <cassert>

namespace {

void verifyCycle(int bars) {
  SongCycleBoundary boundary{-1, false};

  boundary = nextSongCycleBoundary(boundary.barIndex, bars);
  assert(boundary.barIndex == 0);
  assert(!boundary.advanceRow);

  for (int bar = 1; bar < bars; ++bar) {
    boundary = nextSongCycleBoundary(boundary.barIndex, bars);
    assert(boundary.barIndex == bar);
    assert(!boundary.advanceRow);
  }

  boundary = nextSongCycleBoundary(boundary.barIndex, bars);
  assert(boundary.barIndex == 0);
  assert(boundary.advanceRow);
}

}  // namespace

int main() {
  verifyCycle(1);
  verifyCycle(2);
  verifyCycle(4);
  verifyCycle(8);

  SongCycleBoundary restarted{-1, false};
  restarted = nextSongCycleBoundary(restarted.barIndex, 2);
  assert(restarted.barIndex == 0);
  assert(!restarted.advanceRow);

  SongCycleBoundary invalid{-1, false};
  invalid = nextSongCycleBoundary(invalid.barIndex, 3);
  assert(invalid.barIndex == 0);
  assert(!invalid.advanceRow);
  invalid = nextSongCycleBoundary(invalid.barIndex, 3);
  assert(invalid.barIndex == 0);
  assert(invalid.advanceRow);
}
""",
              encoding="utf-8",
          )

          Path("tests/test_song_playhead_source_regressions.py").write_text(
              """#!/usr/bin/env python3
from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]


def require(condition: bool, message: str) -> None:
    if not condition:
        raise AssertionError(message)


def function_block(source: str, begin: str, end: str) -> str:
    start = source.index(begin)
    finish = source.index(end, start)
    return source[start:finish]


def main() -> None:
    engine = (ROOT / \"src/dsp/miniacid_engine.cpp\").read_text(encoding=\"utf-8\")
    header = (ROOT / \"src/dsp/miniacid_engine.h\").read_text(encoding=\"utf-8\")

    require('#include \"song_cycle_boundary.h\"' in engine,
            \"engine must use the tested bar-boundary helper\")
    require(\"songStepCounter_\" not in engine and \"songStepCounter_\" not in header,
            \"legacy sixteenth-step Song counter must be removed\")
    require(\"int songBarIndex_ = -1;\" in header,
            \"Song cycle must have an explicit pre-first-bar phase\")

    cycle = function_block(engine, \"int MiniAcid::cycleBarIndex() const\",\n                           \"int16_t MiniAcid::currentDrumPatternIndex()\")
    require(\"songBarIndex_\" in cycle and \"SEQ_STEPS\" not in cycle,
            \"UI cycle bar must expose bars directly\")

    advance = engine[engine.index(\"void MiniAcid::advanceSongBar_()\"):]
    require(\"nextSongCycleBoundary(\" in advance,
            \"bar callback must use the tested helper\")
    require(\"if (boundary.advanceRow)\" in advance,
            \"Song row may advance only at the configured bar boundary\")
    require(\"SEQ_STEPS *\" not in advance,
            \"bar callback must not wait for sixteenth-note counts\")

    start = function_block(engine, \"void MiniAcid::start()\", \"void MiniAcid::stop()\")
    stop = function_block(engine, \"void MiniAcid::stop()\", \"void MiniAcid::liveNoteOn\")
    mode = function_block(engine, \"void MiniAcid::setSongMode(bool enabled)\",\n                          \"void MiniAcid::toggleSongMode()\")
    position = function_block(engine, \"void MiniAcid::setSongPosition(int position)\",\n                              \"void MiniAcid::setSongPattern\")
    scene = function_block(engine, \"void MiniAcid::applySceneStateFromManager()\",\n                           \"void MiniAcid::applyTextureFromScene_()\")
    for name, block in ((\"start\", start), (\"stop\", stop), (\"mode\", mode),
                        (\"position\", position), (\"scene\", scene)):
        require(\"songBarIndex_ = -1;\" in block,
                f\"{name} lifecycle must restart the Song row cycle\")

    require(\"if (songMode_)\" in advance,
            \"Pattern mode must never advance the Song playhead\")
    require(\"isSongReverseAtSlot\" in engine and \"loopMode()\" in engine,
            \"reverse and loop traversal must remain intact\")
    require(\"rowIsPause && !rehearsalAcknowledged_\" in engine,
            \"rehearsal pause rows must remain intact\")

    print(\"Song playhead source regressions: OK\")


if __name__ == \"__main__\":
    main()
""",
              encoding="utf-8",
          )

          replace_once(
              runner,
              'python3 "${ROOT_DIR}/tests/test_pattern_midi_source_regressions.py"\n',
              'python3 "${ROOT_DIR}/tests/test_pattern_midi_source_regressions.py"\npython3 "${ROOT_DIR}/tests/test_song_playhead_source_regressions.py"\n',
          )
          replace_once(
              runner,
              '"${BUILD_DIR}/test_performance_keyboard"\n\n"${CXX}" \\\n  -std=c++17 \\\n  -Wall \\\n  -Wextra \\\n  -Werror \\\n  -I"${ROOT_DIR}" \\\n  "${ROOT_DIR}/tests/test_usb_midi_output.cpp"',
              '"${BUILD_DIR}/test_performance_keyboard"\n\n"${CXX}" \\\n  -std=c++17 \\\n  -Wall \\\n  -Wextra \\\n  -Werror \\\n  -I"${ROOT_DIR}" \\\n  "${ROOT_DIR}/tests/test_song_cycle_boundary.cpp" \\\n  -o "${BUILD_DIR}/test_song_cycle_boundary"\n\n"${BUILD_DIR}/test_song_cycle_boundary"\n\n"${CXX}" \\\n  -std=c++17 \\\n  -Wall \\\n  -Wextra \\\n  -Werror \\\n  -I"${ROOT_DIR}" \\\n  "${ROOT_DIR}/tests/test_usb_midi_output.cpp"',
          )

          Path("docs/tests/SONG_PLAYHEAD_CARDPUTER_ADV.md").write_text(
              """# Song playhead — Cardputer-Adv acceptance

## Purpose

Verify that Song rows advance by musical bars rather than by an accidental
sixteenth-step multiplier, while Pattern mode and the existing internal audio
remain unchanged.

## Hardware list

- M5Stack Cardputer-Adv (ESP32-S3, no PSRAM)
- USB-C data cable for flashing
- optional Yamaha SEQTRAK for the second validation stage
- headphones or the built-in Cardputer speaker

## Wiring

Flash/test on a computer:

```text
Cardputer-Adv USB-C -> USB data cable -> computer
```

Optional external MIDI check:

```text
Cardputer-Adv USB-C -> USB data cable -> SEQTRAK USB-C
```

No GPIO or PORT.A wiring is used.

## Build and flash

Use the repository-pinned M5Stack ESP32 core `3.2.2`.

```bash
bash scripts/install_arduino_deps.sh
bash scripts/build.sh --warnings all
bash scripts/upload.sh /dev/ttyACM0
```

## Test preparation

Create four Song rows with clearly different Synth A patterns. Keep drums and
Synth B distinct as an additional visual/audible cross-check. Disable Loop for
the first pass.

## Expected behavior

- `1B`: each row lasts exactly one bar.
- `2B`: each row lasts exactly two bars.
- `4B`: each row lasts exactly four bars.
- `8B`: each row lasts exactly eight bars.
- Stop followed by Play starts a complete row cycle.
- Manually selecting another Song row starts that row from bar 1.
- Enabling Song mode starts a complete row cycle.
- Loading a scene starts a complete row cycle.
- Reverse changes traversal direction only at a row boundary.
- Loop preserves the configured row duration.
- Pattern mode never advances the Song playhead.

## SEQTRAK check

After the internal test passes, connect SEQTRAK directly. Synth A and Synth B
should follow the same Song-row changes on MIDI channels 8 and 9. Drums remain
internal in this stage. MIDI timing jitter is handled by the separate draft
PR #8 and is not part of this fix.

## Troubleshooting

- A `1B` row lasting 16 bars means the legacy step multiplier is still present.
- A row changing immediately on Play means the pre-first-bar phase was lost.
- A manual row selection inheriting the previous row's remaining bars means the
  lifecycle reset is missing.
- Only two tracks sounding on SEQTRAK is expected until drum MIDI is added.
- Use core `3.2.2`; a build with `3.2.5` is not an acceptance result.

## Acceptance checklist

- [ ] firmware boots without reset or watchdog
- [ ] internal Synth A, Synth B and drums remain audible
- [ ] `1B` rows advance every one bar
- [ ] `2B` rows advance every two bars
- [ ] `4B` rows advance every four bars
- [ ] `8B` rows advance every eight bars
- [ ] Stop -> Play restarts the current row from bar 1
- [ ] manual row selection restarts the selected row from bar 1
- [ ] Song ON/OFF does not leave stale notes
- [ ] Reverse changes direction at a row boundary
- [ ] Loop keeps the configured row duration
- [ ] Pattern mode does not move the Song playhead
- [ ] optional SEQTRAK channels 8/9 follow the same row changes
- [ ] no continual increase in audio underruns
""",
              encoding="utf-8",
          )
          PY

      - name: Run host regressions
        run: bash tests/run_host_tests.sh

      - name: Commit repaired implementation
        shell: bash
        run: |
          rm .github/workflows/apply-song-playhead-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: advance Song rows on bar boundaries"
          git push origin HEAD:fix/song-playhead-advance
