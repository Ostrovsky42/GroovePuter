name: Groove Vocabulary Stage 2 temporary gate-intent self-patch

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/20260808-04-groove-vocabulary-stage2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply Stage 1 gate model and Stage 2 gate realization
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'patch target missing: {path}: {old[:90]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Mirror the reviewed Stage 1 model change so the Stage 2 tree stays
          # byte-compatible with #160 after it lands.
          replace(
              'src/generation/rhythm/rhythm_types.h',
              '  StepMask optional = 0;\n  StepMask forbidden = 0;\n\n  uint8_t structuralMin = 0;\n',
              '  StepMask optional = 0;\n  StepMask forbidden = 0;\n\n'
              '  // Gate overlays are coordinate policies over declared legal onset\n'
              '  // space. Normal is implicit when an onset is not present in any\n'
              '  // explicit gate mask. The three masks must be mutually exclusive.\n'
              '  StepMask shortGate = 0;\n'
              '  StepMask heldGate = 0;\n'
              '  StepMask tieGate = 0;\n\n'
              '  uint8_t structuralMin = 0;\n')
          replace(
              'src/generation/rhythm/rhythm_catalog.h',
              '  OverlappingLaneZones,\n  InvalidLaneDensity,\n',
              '  OverlappingLaneZones,\n  InvalidLaneGateMasks,\n  InvalidLaneDensity,\n')
          replace(
              'src/generation/rhythm/rhythm_catalog.cpp',
              '    if (lane.structuralMin > lane.structuralMax ||\n',
              '    const StepMask gateMasks[] = {\n'
              '        lane.shortGate, lane.heldGate, lane.tieGate};\n'
              '    for (size_t first = 0; first < 3; ++first) {\n'
              '      for (size_t second = first + 1; second < 3; ++second) {\n'
              '        if (gateMasks[first] & gateMasks[second]) {\n'
              '          return fail(CatalogValidationError::InvalidLaneGateMasks,\n'
              '                      archetypeIndex,\n'
              '                      i);\n'
              '        }\n'
              '      }\n'
              '    }\n'
              '    const StepMask declaredOnsets = static_cast<StepMask>(\n'
              '        lane.immutableAnchors | lane.canonicalAnchors |\n'
              '        lane.preferred | lane.optional);\n'
              '    const StepMask explicitGates = static_cast<StepMask>(\n'
              '        lane.shortGate | lane.heldGate | lane.tieGate);\n'
              '    if ((explicitGates & ~declaredOnsets) ||\n'
              '        (explicitGates & lane.forbidden)) {\n'
              '      return fail(CatalogValidationError::InvalidLaneGateMasks,\n'
              '                  archetypeIndex,\n'
              '                  i);\n'
              '    }\n\n'
              '    if (lane.structuralMin > lane.structuralMax ||\n')
          replace(
              'tests/test_rhythm_stage1.cpp',
              '  expectError(protectedAnchor.catalog,\n              CatalogValidationError::ProtectedSpaceAnchorConflict);\n}\n',
              '  expectError(protectedAnchor.catalog,\n              CatalogValidationError::ProtectedSpaceAnchorConflict);\n\n'
              '  Fixture overlappingGate;\n'
              '  overlappingGate.lanes[0].shortGate = stepBit(0);\n'
              '  overlappingGate.lanes[0].heldGate = stepBit(0);\n'
              '  expectError(overlappingGate.catalog,\n'
              '              CatalogValidationError::InvalidLaneGateMasks);\n\n'
              '  Fixture gateOutsideOnsetSpace;\n'
              '  gateOutsideOnsetSpace.lanes[0].heldGate = stepBit(15);\n'
              '  expectError(gateOutsideOnsetSpace.catalog,\n'
              '              CatalogValidationError::InvalidLaneGateMasks);\n'
              '}\n')
          replace(
              'tests/test_rhythm_atlas_falsification.cpp',
              'struct ExtractedAtlasRhythm {\n  StepMask masks[kRhythmRoleCount]{};\n  uint8_t heldIntentCount = 0;\n};\n',
              'struct ExtractedAtlasRhythm {\n'
              '  StepMask masks[kRhythmRoleCount]{};\n'
              '  StepMask heldMasks[kRhythmRoleCount]{};\n'
              '  uint8_t heldIntentCount = 0;\n'
              '};\n')
          replace(
              'tests/test_rhythm_atlas_falsification.cpp',
              '      assert(intent.gate == GateClass::Held);\n      ++out.heldIntentCount;\n',
              '      assert(intent.gate == GateClass::Held);\n'
              '      out.heldMasks[roleIndex] = static_cast<StepMask>(\n'
              '          out.heldMasks[roleIndex] | stepBit(event.step));\n'
              '      ++out.heldIntentCount;\n')
          replace(
              'tests/test_rhythm_atlas_falsification.cpp',
              '             uint8_t structuralMin,\n             uint8_t structuralMax) {\n',
              '             uint8_t structuralMin,\n'
              '             uint8_t structuralMax,\n'
              '             StepMask heldGate = 0) {\n')
          replace(
              'tests/test_rhythm_atlas_falsification.cpp',
              '  lane.structuralMin = structuralMin;\n  lane.structuralMax = structuralMax;\n',
              '  lane.structuralMin = structuralMin;\n'
              '  lane.structuralMax = structuralMax;\n'
              '  lane.heldGate = heldGate;\n')
          replace(
              'tests/test_rhythm_atlas_falsification.cpp',
              '      assert(extracted.masks[roleIndex] == 0);\n',
              '      assert(extracted.masks[roleIndex] == 0);\n'
              '      assert(extracted.heldMasks[roleIndex] == 0);\n')
          replace(
              'tests/test_rhythm_atlas_falsification.cpp',
              '    assertObservedFitsLane(fixture, lane.role, observed);\n\n'
              '    if (lane.preferred || lane.optional ||\n',
              '    assertObservedFitsLane(fixture, lane.role, observed);\n'
              '    const StepMask observedHeld =\n'
              '        extracted.heldMasks[static_cast<uint8_t>(lane.role)];\n'
              '    assert(observedHeld == static_cast<StepMask>(\n'
              '        observed & lane.heldGate));\n'
              '    assert((observed & lane.shortGate) == 0);\n'
              '    assert((observed & lane.tieGate) == 0);\n\n'
              '    if (lane.preferred || lane.optional ||\n')
          replace(
              'tests/test_rhythm_atlas_falsification.cpp',
              '  addLane(fixture, RhythmRole::BassRhythm, 0x8000, 0x0442, 0x2020, 2, 5);\n',
              '  addLane(fixture, RhythmRole::BassRhythm, 0x8000, 0x0442, 0x2020,\n'
              '          2, 5, 0x8440);\n')
          replace(
              'tests/test_rhythm_atlas_falsification.cpp',
              '  addLane(fixture, RhythmRole::BassRhythm, 0x8080, 0x1010, 0x0202, 2, 4);\n',
              '  addLane(fixture, RhythmRole::BassRhythm, 0x8080, 0x1010, 0x0202,\n'
              '          2, 4, 0x9090);\n')

          # Realizer: map coordinate-level gate policy onto every realized onset.
          replace(
              'src/generation/rhythm/rhythm_realizer.cpp',
              'void addVariation(const RhythmArchetype& archetype,\n',
              'void applyGatePolicies(const RhythmArchetype& archetype,\n'
              '                       RhythmPhrasePlan& plan) {\n'
              '  for (uint8_t bar = 0; bar < plan.barCount; ++bar) {\n'
              '    for (uint8_t laneIndex = 0; laneIndex < archetype.laneCount; ++laneIndex) {\n'
              '      const LaneGrammar& lane = archetype.lanes[laneIndex];\n'
              '      RoleRhythmPlan& rolePlan =\n'
              '          plan.bars[bar].roles[static_cast<uint8_t>(lane.role)];\n'
              '      const StepMask onsets = static_cast<StepMask>(\n'
              '          rolePlan.structural | rolePlan.secondary | rolePlan.ghosts);\n'
              '      rolePlan.heldGate = static_cast<StepMask>(onsets & lane.heldGate);\n'
              '      rolePlan.tieGate = static_cast<StepMask>(onsets & lane.tieGate);\n'
              '      const StepMask explicitGateSites = static_cast<StepMask>(\n'
              '          lane.shortGate | lane.heldGate | lane.tieGate);\n'
              '      rolePlan.shortGate = static_cast<StepMask>(\n'
              '          (onsets & lane.shortGate) |\n'
              '          (rolePlan.ghosts & ~explicitGateSites));\n'
              '    }\n'
              '  }\n'
              '}\n\n'
              'void addVariation(const RhythmArchetype& archetype,\n')

          replace(
              'src/generation/rhythm/rhythm_realizer.cpp',
              '  addVariation(*archetype, variationSeed ^ 0x56415232u, result.plan);\n\n'
              '  if (!planRespectsProtectedSpace(*archetype, result.plan) ||\n',
              '  addVariation(*archetype, variationSeed ^ 0x56415232u, result.plan);\n'
              '  applyGatePolicies(*archetype, result.plan);\n\n'
              '  if (!planRespectsProtectedSpace(*archetype, result.plan) ||\n')

          replace(
              'src/generation/rhythm/rhythm_realizer.cpp',
              '      const uint8_t count = bitCount16(structural);\n'
              '      if (count < effectiveMin || count > lane.structuralMax ||\n'
              '          bitCount16(rolePlan.ghosts) > lane.ornamentMax) {\n'
              '        return false;\n'
              '      }\n',
              '      const uint8_t count = bitCount16(structural);\n'
              '      if (count < effectiveMin || count > lane.structuralMax ||\n'
              '          bitCount16(rolePlan.ghosts) > lane.ornamentMax) {\n'
              '        return false;\n'
              '      }\n'
              '      const StepMask allOnsets = static_cast<StepMask>(\n'
              '          structural | rolePlan.ghosts);\n'
              '      const StepMask explicitGateSites = static_cast<StepMask>(\n'
              '          lane.shortGate | lane.heldGate | lane.tieGate);\n'
              '      const StepMask expectedShort = static_cast<StepMask>(\n'
              '          (allOnsets & lane.shortGate) |\n'
              '          (rolePlan.ghosts & ~explicitGateSites));\n'
              '      const StepMask expectedHeld = static_cast<StepMask>(\n'
              '          allOnsets & lane.heldGate);\n'
              '      const StepMask expectedTie = static_cast<StepMask>(\n'
              '          allOnsets & lane.tieGate);\n'
              '      if (rolePlan.shortGate != expectedShort ||\n'
              '          rolePlan.heldGate != expectedHeld ||\n'
              '          rolePlan.tieGate != expectedTie ||\n'
              '          (rolePlan.shortGate & rolePlan.heldGate) ||\n'
              '          (rolePlan.shortGate & rolePlan.tieGate) ||\n'
              '          (rolePlan.heldGate & rolePlan.tieGate)) {\n'
              '        return false;\n'
              '      }\n')

          # Property fixture has mixed gate semantics on one Bass lane.
          replace(
              'tests/test_rhythm_stage2.cpp',
              '    lanes[1].ornamentMax = 1;\n\n    lanes[2].role = RhythmRole::Backbeat;\n',
              '    lanes[1].ornamentMax = 1;\n'
              '    lanes[1].heldGate = stepBit(1);\n'
              '    lanes[1].tieGate = stepBit(9);\n\n'
              '    lanes[2].role = RhythmRole::Backbeat;\n')
          replace(
              'tests/test_rhythm_stage2.cpp',
              'void testBreakCanSuspendOnlyExplicitCanonicalSubset() {\n',
              'void testGateIntentSurvivesRealizationAndVariation() {\n'
              '  Stage2Fixture fixture;\n'
              '  const RhythmRealizationResult p1 = realize(\n'
              '      fixture, 0xA55Au, RealizationLevel::P1Canonical);\n'
              '  assertValidPlan(fixture, p1);\n'
              '  const uint8_t bass = static_cast<uint8_t>(RhythmRole::BassRhythm);\n'
              '  for (uint8_t bar = 0; bar < p1.plan.barCount; ++bar) {\n'
              '    const RoleRhythmPlan& role = p1.plan.bars[bar].roles[bass];\n'
              '    assert((role.heldGate & stepBit(1)) != 0);\n'
              '    assert((role.tieGate & stepBit(9)) != 0);\n'
              '    assert((role.heldGate & role.tieGate) == 0);\n'
              '  }\n'
              '  const RhythmRealizationResult p2 = realize(\n'
              '      fixture, 0xA55Au, RealizationLevel::P2Variation, &p1.identity);\n'
              '  assertValidPlan(fixture, p2);\n'
              '}\n\n'
              'void testBreakCanSuspendOnlyExplicitCanonicalSubset() {\n')
          replace(
              'tests/test_rhythm_stage2.cpp',
              '  testIdentityContinuityAndTrajectorySeparation();\n  testBreakCanSuspendOnlyExplicitCanonicalSubset();\n',
              '  testIdentityContinuityAndTrajectorySeparation();\n'
              '  testGateIntentSurvivesRealizationAndVariation();\n'
              '  testBreakCanSuspendOnlyExplicitCanonicalSubset();\n')

          replace(
              'tests/test_rhythm_stage2_source_regressions.py',
              'assert "planRespectsLaneBounds" in realizer_cpp\n',
              'assert "planRespectsLaneBounds" in realizer_cpp\n'
              'assert "applyGatePolicies" in realizer_cpp\n'
              'assert "lane.heldGate" in realizer_cpp\n'
              'assert "lane.tieGate" in realizer_cpp\n')
          PY

          git diff --check

      - name: Run focused Stage 1 and Stage 2 gates
        run: |
          bash tests/run_rhythm_stage1_tests.sh
          bash tests/run_rhythm_stage2_tests.sh

      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/generation/rhythm/rhythm_types.h \
            src/generation/rhythm/rhythm_catalog.h \
            src/generation/rhythm/rhythm_catalog.cpp \
            src/generation/rhythm/rhythm_realizer.cpp \
            tests/test_rhythm_stage1.cpp \
            tests/test_rhythm_atlas_falsification.cpp \
            tests/test_rhythm_stage2.cpp \
            tests/test_rhythm_stage2_source_regressions.py
          git commit -m 'fix: preserve rhythmic gate intent in Stage 2'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
