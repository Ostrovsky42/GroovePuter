name: Apply Carbon Song patch

on:
  pull_request:
    branches:
      - dev
    types:
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-32step-song-spacing-polish
          fetch-depth: 0

      - name: Run staged Carbon patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/agent-ui-carbon-song.yml').read_text(encoding='utf-8')
          start_marker = (
              '      - name: Replace Carbon Song renderer\n'
              '        shell: bash\n'
              '        run: |\n'
          )
          end_marker = '\n      - name: Run regressions and builds'
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines
          )
          Path('/tmp/apply-carbon-song.sh').write_text(
              'set -euo pipefail\n' + script + '\n',
              encoding='utf-8',
          )
          PY
          bash /tmp/apply-carbon-song.sh

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/ui/pages/song_page.cpp')
          text = path.read_text(encoding='utf-8')
          retro_start = text.index('void SongPage::drawRetroClassicStyle')
          amber_start = text.index('void SongPage::drawAmberStyle', retro_start)
          help_start = text.index('std::unique_ptr<MultiPageHelpDialog>', amber_start)

          def rename_cursor_local(segment: str, label: str) -> str:
              declaration = 'const int cursorRow = cursorRow();'
              if segment.count(declaration) != 1:
                  raise RuntimeError(
                      f'{label}: expected one cursorRow declaration, '
                      f'found {segment.count(declaration)}'
                  )
              segment = segment.replace(
                  declaration,
                  'const int cursorRowValue = cursorRow();',
                  1,
              )
              segment = re.sub(r'\bcursorRow\b(?!\s*\()', 'cursorRowValue', segment)
              if 'const int cursorRow = cursorRow();' in segment:
                  raise RuntimeError(f'{label}: cursor local rename failed')
              return segment

          retro = rename_cursor_local(text[retro_start:amber_start], 'Retro')
          amber = rename_cursor_local(text[amber_start:help_start], 'Amber')
          text = text[:retro_start] + retro + amber + text[help_start:]
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_ui_layout_source_regressions.py')
          test = test_path.read_text(encoding='utf-8')
          anchor = '        self.assertGreaterEqual(source.count("const int gap = 4;"), 3)\n'
          assertion = (
              anchor
              + '        self.assertNotIn("const int cursorRow = cursorRow();", source)\n'
          )
          if anchor not in test:
              raise RuntimeError('Song cursor regression anchor not found')
          test = test.replace(anchor, assertion, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

          start_line=$(grep -n '^void SongPage::drawMinimalStyle' src/ui/pages/song_page.cpp | cut -d: -f1)
          end_line=$(grep -n '^std::unique_ptr<MultiPageHelpDialog>' src/ui/pages/song_page.cpp | cut -d: -f1)
          clang-format -i --lines="${start_line}:$((end_line - 1))" src/ui/pages/song_page.cpp

      - name: Run focused and host regressions
        run: |
          python3 tests/test_ui_layout_source_regressions.py
          ./tests/run_host_tests.sh

      - name: Commit Carbon Song renderer
        shell: bash
        run: |
          rm .github/workflows/agent-ui-carbon-song.yml
          rm .github/workflows/agent-ui-carbon-wrapper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ui: add native Carbon Song split layout"
          git push origin HEAD:agent/ui-32step-song-spacing-polish
