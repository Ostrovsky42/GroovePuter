name: Stage 3 density patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/20260808-06-groove-vocabulary-stage3-reference-catalog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply exact preferred-density corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/generation/rhythm/reference_vocabulary.cpp')
          text = p.read_text()
          replacements = [
              ('DensityContract{14, 18, 24, 5}', 'DensityContract{14, 15, 24, 5}'),
              ('DensityContract{8, 10, 18, 4}', 'DensityContract{8, 8, 18, 4}'),
              ('DensityContract{13, 15, 23, 5}', 'DensityContract{12, 12, 23, 5}'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one exact match, got {count}: {old}')
              text = text.replace(old, new)
          p.write_text(text)
          PY
          git diff --check
          git diff -- src/generation/rhythm/reference_vocabulary.cpp
      - name: Commit bounded fix
        run: |
          if git diff --quiet; then
            echo 'No patch needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/generation/rhythm/reference_vocabulary.cpp
          git commit -m 'fix: preserve Stage 3 identity choice'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
