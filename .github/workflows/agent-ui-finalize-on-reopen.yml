name: Finalize UI polish on reopen

on:
  pull_request:
    branches:
      - dev
    types:
      - reopened

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-32step-song-spacing-polish
          fetch-depth: 0

      - name: Run staged finalizer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/agent-ui-rebase-fix.yml').read_text(encoding='utf-8')
          start_marker = (
              '      - name: Rebase patch onto current dev and fix themed Song renderer\n'
              '        shell: bash\n'
              '        run: |\n'
          )
          end_marker = '\n      - name: Run focused and host regressions'
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines
          )
          Path('/tmp/finalize-ui.sh').write_text(
              'set -euo pipefail\n' + script + '\n',
              encoding='utf-8',
          )
          PY
          bash /tmp/finalize-ui.sh

      - name: Run focused and host regressions
        run: |
          python3 tests/test_ui_layout_source_regressions.py
          ./tests/run_host_tests.sh

      - name: Commit clean branch from current dev
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ui: polish pattern, song, settings, and hub layouts"
          git push --force-with-lease origin HEAD:agent/ui-32step-song-spacing-polish
