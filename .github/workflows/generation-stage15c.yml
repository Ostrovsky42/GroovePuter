name: Generation Stage 15C

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage15c-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Stage 15C bass behavior matrix
        env:
          ASAN_OPTIONS: "detect_leaks=0"
        run: bash tests/run_generation_stage15c_tests.sh
