name: Apply guarded scene path additions

on:
  push:
    branches:
      - agent/fix-core-reliability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-core-reliability
          fetch-depth: 0
      - name: Add drum dynamics parser paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scenes.h')
          text = path.read_text(encoding='utf-8')
          old = '    DrumProbabilityArray,\n    SynthABanks,\n'
          new = '    DrumProbabilityArray,\n    DrumVelocityArray,\n    DrumTimingArray,\n    SynthABanks,\n'
          if text.count(old) != 1:
              raise SystemExit(f'path insertion count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit path additions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenes.h
          git commit -m "fix: add scene parser paths for drum dynamics"
          git push origin HEAD:agent/fix-core-reliability
