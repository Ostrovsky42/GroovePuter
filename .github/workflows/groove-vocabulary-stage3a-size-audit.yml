name: Groove Vocabulary Stage 3A temporary size audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  firmware-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"
      - name: Install pinned M5Stack dependencies
        run: bash scripts/install_arduino_deps.sh
      - name: Build Stage 3A profiles and collect metrics
        run: |
          set -euo pipefail
          REPORT="$GITHUB_WORKSPACE/groove-vocabulary-stage3a-size.tsv"
          printf 'profile\tsha\ttext\tdata\tbss\tdram_data\tdram_bss\tdram_total\tbin_bytes\n' > "$REPORT"

          find_size_tool() {
            find "$HOME/.arduino15/packages" -type f -name xtensa-esp32s3-elf-size -perm -111 -print \
              | sort -V | tail -n 1
          }

          collect() {
            local profile="$1"
            local build_dir="$2"
            local elf="$build_dir/GroovePuter.ino.elf"
            local bin="$build_dir/GroovePuter.ino.bin"
            local size_tool
            size_tool="$(find_size_tool)"
            read -r text data bss _ < <("$size_tool" "$elf" | awk 'NR==2 {print $1, $2, $3, $4}')
            read -r dram_data dram_bss < <(
              "$size_tool" -A "$elf" | awk '
                $1 == ".dram0.data" { data = $2 }
                $1 == ".dram0.bss" { bss = $2 }
                END { print data + 0, bss + 0 }
              '
            )
            local dram_total=$((dram_data + dram_bss))
            local bin_bytes
            bin_bytes="$(stat -c %s "$bin")"
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$profile" "${{ github.event.pull_request.head.sha }}" \
              "$text" "$data" "$bss" "$dram_data" "$dram_bss" \
              "$dram_total" "$bin_bytes" >> "$REPORT"
          }

          NORMAL="$RUNNER_TEMP/stage3a-normal"
          MIDI="$RUNNER_TEMP/stage3a-midi"
          BUILD_PATH="$NORMAL" bash scripts/build.sh --warnings all
          bash scripts/check_cardputer_dram_budget.sh "$NORMAL/GroovePuter.ino.elf"
          collect normal "$NORMAL"
          BUILD_PATH="$MIDI" bash scripts/build_seqtrak_midi_only.sh --warnings all
          collect midi-only "$MIDI"
          cat "$REPORT"
      - name: Upload size report
        uses: actions/upload-artifact@v4
        with:
          name: groove-vocabulary-stage3a-size-audit
          path: groove-vocabulary-stage3a-size.tsv
          if-no-files-found: error
