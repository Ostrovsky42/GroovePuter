name: Groove Vocabulary Stage 1 temporary gate-intent self-patch

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/20260808-03-groove-vocabulary-stage1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Add gate-class overlays and Atlas falsification
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'patch target missing: {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'src/generation/rhythm/rhythm_types.h',
              '  StepMask optional = 0;\n  StepMask forbidden = 0;\n\n  uint8_t structuralMin = 0;\n',
              '  StepMask optional = 0;\n  StepMask forbidden = 0;\n\n'
              '  // Gate overlays are coordinate policies over declared legal onset\n'
              '  // space. Normal is implicit when an onset is not present in any\n'
              '  // explicit gate mask. The three masks must be mutually exclusive.\n'
              '  StepMask shortGate = 0;\n'
              '  StepMask heldGate = 0;\n'
              '  StepMask tieGate = 0;\n\n'
              '  uint8_t structuralMin = 0;\n')

          replace(
              'src/generation/rhythm/rhythm_catalog.h',
              '  OverlappingLaneZones,\n  InvalidLaneDensity,\n',
              '  OverlappingLaneZones,\n  InvalidLaneGateMasks,\n  InvalidLaneDensity,\n')

          replace(
              'src/generation/rhythm/rhythm_catalog.cpp',
              '    if (lane.structuralMin > lane.structuralMax ||\n',
              '    const StepMask gateMasks[] = {\n'
              '        lane.shortGate, lane.heldGate, lane.tieGate};\n'
              '    for (size_t first = 0; first < 3; ++first) {\n'
              '      for (size_t second = first + 1; second < 3; ++second) {\n'
              '        if (gateMasks[first] & gateMasks[second]) {\n'
              '          return fail(CatalogValidationError::InvalidLaneGateMasks,\n'
              '                      archetypeIndex,\n'
              '                      i);\n'
              '        }\n'
              '      }\n'
              '    }\n'
              '    const StepMask declaredOnsets = static_cast<StepMask>(\n'
              '        lane.immutableAnchors | lane.canonicalAnchors |\n'
              '        lane.preferred | lane.optional);\n'
              '    const StepMask explicitGates = static_cast<StepMask>(\n'
              '        lane.shortGate | lane.heldGate | lane.tieGate);\n'
              '    if ((explicitGates & ~declaredOnsets) ||\n'
              '        (explicitGates & lane.forbidden)) {\n'
              '      return fail(CatalogValidationError::InvalidLaneGateMasks,\n'
              '                  archetypeIndex,\n'
              '                  i);\n'
              '    }\n\n'
              '    if (lane.structuralMin > lane.structuralMax ||\n')

          replace(
              'tests/test_rhythm_stage1.cpp',
              '  expectError(protectedAnchor.catalog,\n              CatalogValidationError::ProtectedSpaceAnchorConflict);\n}\n',
              '  expectError(protectedAnchor.catalog,\n              CatalogValidationError::ProtectedSpaceAnchorConflict);\n\n'
              '  Fixture overlappingGate;\n'
              '  overlappingGate.lanes[0].shortGate = stepBit(0);\n'
              '  overlappingGate.lanes[0].heldGate = stepBit(0);\n'
              '  expectError(overlappingGate.catalog,\n'
              '              CatalogValidationError::InvalidLaneGateMasks);\n\n'
              '  Fixture gateOutsideOnsetSpace;\n'
              '  gateOutsideOnsetSpace.lanes[0].heldGate = stepBit(15);\n'
              '  expectError(gateOutsideOnsetSpace.catalog,\n'
              '              CatalogValidationError::InvalidLaneGateMasks);\n'
              '}\n')

          replace(
              'tests/test_rhythm_atlas_falsification.cpp',
              'struct ExtractedAtlasRhythm {\n  StepMask masks[kRhythmRoleCount]{};\n  uint8_t heldIntentCount = 0;\n};\n',
              'struct ExtractedAtlasRhythm {\n'
              '  StepMask masks[kRhythmRoleCount]{};\n'
              '  StepMask heldMasks[kRhythmRoleCount]{};\n'
              '  uint8_t heldIntentCount = 0;\n'
              '};\n')

          replace(
              'tests/test_rhythm_atlas_falsification.cpp',
              '      assert(intent.gate == GateClass::Held);\n      ++out.heldIntentCount;\n',
              '      assert(intent.gate == GateClass::Held);\n'
              '      out.heldMasks[roleIndex] = static_cast<StepMask>(\n'
              '          out.heldMasks[roleIndex] | stepBit(event.step));\n'
              '      ++out.heldIntentCount;\n')

          replace(
              'tests/test_rhythm_atlas_falsification.cpp',
              '             uint8_t structuralMin,\n             uint8_t structuralMax) {\n',
              '             uint8_t structuralMin,\n'
              '             uint8_t structuralMax,\n'
              '             StepMask heldGate = 0) {\n')

          replace(
              'tests/test_rhythm_atlas_falsification.cpp',
              '  lane.structuralMin = structuralMin;\n  lane.structuralMax = structuralMax;\n',
              '  lane.structuralMin = structuralMin;\n'
              '  lane.structuralMax = structuralMax;\n'
              '  lane.heldGate = heldGate;\n')

          replace(
              'tests/test_rhythm_atlas_falsification.cpp',
              '      assert(extracted.masks[roleIndex] == 0);\n',
              '      assert(extracted.masks[roleIndex] == 0);\n'
              '      assert(extracted.heldMasks[roleIndex] == 0);\n')

          replace(
              'tests/test_rhythm_atlas_falsification.cpp',
              '    assertObservedFitsLane(fixture, lane.role, observed);\n\n'
              '    if (lane.preferred || lane.optional ||\n',
              '    assertObservedFitsLane(fixture, lane.role, observed);\n'
              '    const StepMask observedHeld =\n'
              '        extracted.heldMasks[static_cast<uint8_t>(lane.role)];\n'
              '    assert(observedHeld == static_cast<StepMask>(\n'
              '        observed & lane.heldGate));\n'
              '    assert((observed & lane.shortGate) == 0);\n'
              '    assert((observed & lane.tieGate) == 0);\n\n'
              '    if (lane.preferred || lane.optional ||\n')

          replace(
              'tests/test_rhythm_atlas_falsification.cpp',
              '  addLane(fixture, RhythmRole::BassRhythm, 0x8000, 0x0442, 0x2020, 2, 5);\n',
              '  addLane(fixture, RhythmRole::BassRhythm, 0x8000, 0x0442, 0x2020,\n'
              '          2, 5, 0x8440);\n')

          replace(
              'tests/test_rhythm_atlas_falsification.cpp',
              '  addLane(fixture, RhythmRole::BassRhythm, 0x8080, 0x1010, 0x0202, 2, 4);\n',
              '  addLane(fixture, RhythmRole::BassRhythm, 0x8080, 0x1010, 0x0202,\n'
              '          2, 4, 0x9090);\n')
          PY

          git diff --check
          git diff -- src/generation/rhythm/rhythm_types.h \
            src/generation/rhythm/rhythm_catalog.h \
            src/generation/rhythm/rhythm_catalog.cpp \
            tests/test_rhythm_stage1.cpp \
            tests/test_rhythm_atlas_falsification.cpp

      - name: Run focused Stage 1 gate
        run: bash tests/run_rhythm_stage1_tests.sh

      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/generation/rhythm/rhythm_types.h \
            src/generation/rhythm/rhythm_catalog.h \
            src/generation/rhythm/rhythm_catalog.cpp \
            tests/test_rhythm_stage1.cpp \
            tests/test_rhythm_atlas_falsification.cpp
          git commit -m 'fix: encode gate intent in Stage 1 grammar'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
