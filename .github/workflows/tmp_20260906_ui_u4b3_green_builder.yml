name: TMP U4B3 Green Builder

on:
  push:
    branches:
      - tmp/20260906-ui-u4b3-green
    paths:
      - '.github/workflows/tmp_20260906_ui_u4b3_green_builder.yml'

permissions:
  contents: write

jobs:
  build-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded U4B3 wiring
        run: python3 tools/tmp_u4b3_apply.py
      - name: Run focused and inherited view gates
        shell: bash
        run: |
          bash tests/run_ui_constitution_u4b3_tests.sh
          bash tests/run_ui_constitution_u4b2_tests.sh
          bash tests/run_ui_constitution_u4a_tests.sh
      - name: Commit verified GREEN candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/pages/synth_sequencer_page.cpp
          git diff --cached --check
          git commit -m 'feat(ui): wire guarded Phrase duration resize'
          git push origin HEAD:tmp/20260906-ui-u4b3-green
