name: R1 one-shot test compile fix

on:
  push:
    branches:
      - agent/20260827-07-0.9.9-phrase-r1-crossbar-lifetime-executor
    paths:
      - '.github/workflows/r1_patch_test_once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/20260827-07-0.9.9-phrase-r1-crossbar-lifetime-executor
          fetch-depth: 0
      - name: Use R1-owned barrier in T29
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/test_0_9_9_phrase_r1_crossbar_lifetime.cpp')
          s = p.read_text()
          old = '  runPredecessorPatternCleanupBarrier("T29 arbitrary jump releases exactly once: OK");'
          new = '  runR1OwnedBarrier("T29 arbitrary jump releases exactly once: OK");'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/r1_patch_test_once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_0_9_9_phrase_r1_crossbar_lifetime.cpp \
                  .github/workflows/r1_patch_test_once.yml
          git diff --cached --check
          git commit -m "test(0.9.9-phrase): exercise R1-owned hard barrier"
          git push origin HEAD:agent/20260827-07-0.9.9-phrase-r1-crossbar-lifetime-executor
