name: Apply final HUB offset

on:
  pull_request:
    branches:
      - dev
    types:
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-32step-song-spacing-polish
          fetch-depth: 0

      - name: Lower HUB first track by four more pixels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hub_path = Path('src/ui/pages/sequencer_hub_page.cpp')
          hub = hub_path.read_text(encoding='utf-8')
          old = 'constexpr int kHubOverviewTopInset = 4;'
          new = 'constexpr int kHubOverviewTopInset = 8;'
          if hub.count(old) != 1:
              raise RuntimeError(f'expected one HUB inset constant, found {hub.count(old)}')
          hub_path.write_text(hub.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_ui_layout_source_regressions.py')
          test = test_path.read_text(encoding='utf-8')
          old_test = 'self.assertIn("constexpr int kHubOverviewTopInset = 4;", hub)'
          new_test = 'self.assertIn("constexpr int kHubOverviewTopInset = 8;", hub)'
          if test.count(old_test) != 1:
              raise RuntimeError(f'expected one HUB inset assertion, found {test.count(old_test)}')
          test_path.write_text(test.replace(old_test, new_test, 1), encoding='utf-8')
          PY

      - name: Run focused and host regressions
        run: |
          python3 tests/test_ui_layout_source_regressions.py
          ./tests/run_host_tests.sh

      - name: Commit final HUB spacing
        shell: bash
        run: |
          rm .github/workflows/agent-ui-hub-offset.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ui: lower HUB overview tracks by four more pixels"
          git push origin HEAD:agent/ui-32step-song-spacing-polish
