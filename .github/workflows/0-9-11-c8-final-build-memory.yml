name: 0.9.11 C8 Final Cardputer Build and Memory

on:
  push:
    branches:
      - feature/20260913-c8-final-build-memory
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-c8-final-build-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact release lineage and verification-only delta
        run: |
          set -euo pipefail
          C6_C7_ROOT=d09dba481dedfea3411eef6f91a71dd1e9198a4b
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${C6_C7_ROOT}" HEAD
          git diff --exit-code "${C6_C7_ROOT}" HEAD -- src tests scripts firmware platform_sdl

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install pinned M5Stack dependencies
        run: bash scripts/install_arduino_deps.sh

      - name: Build exact-head Cardputer ADV product image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/build/c8-evidence"
          BUILD_PATH="${GITHUB_WORKSPACE}/build/c8-cardputer-product" \
            bash scripts/build_cardputer_memory_baseline.sh normal product --warnings all \
            | tee "${GITHUB_WORKSPACE}/build/c8-evidence/build.log"

      - name: Enforce Cardputer DRAM budget
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check_cardputer_dram_budget.sh \
            "${GITHUB_WORKSPACE}/build/c8-cardputer-product/GroovePuter.ino.elf" \
            | tee "${GITHUB_WORKSPACE}/build/c8-evidence/dram-budget.log"

      - name: Record exact-head firmware fingerprints
        shell: bash
        run: |
          set -euo pipefail
          BUILD_PATH="${GITHUB_WORKSPACE}/build/c8-cardputer-product"
          EVIDENCE_PATH="${GITHUB_WORKSPACE}/build/c8-evidence"
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "workflow_run=${GITHUB_RUN_ID}"
          } | tee "${EVIDENCE_PATH}/provenance.txt"
          find "${BUILD_PATH}" -maxdepth 1 -type f \( -name '*.elf' -o -name '*.bin' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | tee "${EVIDENCE_PATH}/SHA256SUMS.txt"
          test -s "${EVIDENCE_PATH}/SHA256SUMS.txt"

      - name: Upload exact-head Cardputer build evidence
        uses: actions/upload-artifact@v4
        with:
          name: grooveputer-0.9.11-c8-${{ github.sha }}
          path: |
            build/c8-cardputer-product/
            build/c8-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Prove verification did not mutate tracked source
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
