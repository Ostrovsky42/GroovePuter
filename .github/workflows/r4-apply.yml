name: R4 surgical patch

on:
  push:
    branches:
      - agent/20260816-0.9.8-r4-song-phrase
    paths:
      - tools/r4_apply.py
      - .github/workflows/r4-apply.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic R4 source patch
        run: python3 tools/r4_apply.py
      - name: Validate patch hygiene
        run: git diff --check
      - name: Commit surgical patch
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "0.9.8-R4: apply Song Phrase ownership patch"
          git push origin HEAD:agent/20260816-0.9.8-r4-song-phrase
