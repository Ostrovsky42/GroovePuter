name: Stage15 Historical Frozen Drift Probe

on:
  push:
    branches:
      - investigation/20260912-stage15-historical-drift

jobs:
  historical-drift-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Locate first frozen fingerprint drift
        run: bash tests/probe_stage15_historical_drift.sh
      - name: Capture current density-aware Stage15 corpora
        run: |
          git checkout --detach f2261759071ad3d3f984381ba5f5c608525f8dfa
          mkdir -p build/host-tests
          bash tests/run_stage15_tonal_baseline_dump.sh > build/host-tests/stage15-current-nontonal.tsv
          bash tests/run_stage15_tonal_baseline_dump.sh --tonal > build/host-tests/stage15-current-tonal.tsv
          test "$(wc -l < build/host-tests/stage15-current-nontonal.tsv)" -eq 257
          test "$(wc -l < build/host-tests/stage15-current-tonal.tsv)" -eq 257
          sha256sum build/host-tests/stage15-current-nontonal.tsv build/host-tests/stage15-current-tonal.tsv
      - name: Upload captured Stage15 corpora
        uses: actions/upload-artifact@v4
        with:
          name: stage15-density-aware-corpora
          path: |
            build/host-tests/stage15-current-nontonal.tsv
            build/host-tests/stage15-current-tonal.tsv
          if-no-files-found: error
