name: 0.9.11 A2 Identity-Bound Resolution GREEN

on:
  push:
    branches:
      - fix/20260911-0.9.11-a2-identity-bound-resolution
  workflow_dispatch:

env:
  RED_ROOT: 2994468a945bd728ae1ca6cfb1b03fb882b73c7c
  CANDIDATE_HEAD: ${{ github.sha }}

jobs:
  identity-bound-resolution-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0

      - name: Prove exact checkout and RED ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_HEAD}"
          git merge-base --is-ancestor "${RED_ROOT}" HEAD

      - name: Prove bounded GREEN scope
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only "${RED_ROOT}"..HEAD | grep -Ev '^(.github/workflows/0_9_11_a2_identity_bound_resolution_red.yml|tests/test_0_9_11_a2_identity_bound_resolution.cpp|src/state/material_slot_access.h|src/state/material_version.h|src/state/material_resolution.h|src/state/melody_promotion.h)$' || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "Unexpected files in bounded A2 identity/global-storage GREEN:" >&2
            echo "${unexpected}" >&2
            exit 2
          fi

      - name: Prove identity-bound resolution and global durable addressing GREEN
        run: |
          set -euo pipefail
          bash tests/run_0_9_11_a2_identity_bound_resolution_red.sh 2>&1 | tee a2-identity-bound-resolution-green.log

          grep -F \
            "A2_DURABLE_GLOBAL_ADDRESS_GREEN:" \
            a2-identity-bound-resolution-green.log
          grep -F \
            "A2_IDENTITY_BOUND_RESOLUTION_GREEN:" \
            a2-identity-bound-resolution-green.log
          grep -F \
            "0.9.11 A2 identity-bound material resolution: PASS" \
            a2-identity-bound-resolution-green.log

          if grep -F "_RED:" a2-identity-bound-resolution-green.log; then
            echo "A2 GREEN run still emitted a RED witness" >&2
            exit 3
          fi

      - name: Preserve M2b melody promotion transaction regressions
        run: |
          set -euo pipefail
          bash tests/run_melody_promotion_tests.sh
