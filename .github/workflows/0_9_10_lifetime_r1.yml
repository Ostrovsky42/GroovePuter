name: 0.9.10 LIFETIME-R1 Explicit Residency

on:
  push:
    branches:
      - feature/20260908-03-0.9.10-lifetime-r1-explicit-residency
  pull_request:
    paths:
      - 'src/diag/lifetime_census.h'
      - 'src/platform/cardputer_smf_player.*'
      - 'GroovePuter.ino'
      - 'docs/contracts/0_9_10_LIFETIME_R1_RESOURCE_OWNERSHIP.md'
      - 'docs/superpowers/plans/2026-09-08-lifetime-r1-explicit-residency.md'
      - 'tests/test_lifetime_r1_*'
      - 'tests/run_lifetime_r1_tests.sh'
      - '.github/workflows/0_9_10_lifetime_r1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lifetime-r1-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize L1 diagnostic hooks once
        if: github.event_name == 'push'
        run: python3 scripts/materialize_lifetime_r1_l1_hooks.py
      - name: Commit materialized hooks when needed
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- GroovePuter.ino src/platform/cardputer_smf_player.cpp; then
            echo "L1 hooks already materialized"
            exit 0
          fi
          git config user.name "GroovePuter CI"
          git config user.email "actions@users.noreply.github.com"
          git add GroovePuter.ino src/platform/cardputer_smf_player.cpp
          git commit -m "feat(diag): wire lifetime-r1 l1 census points"
          git push origin HEAD:feature/20260908-03-0.9.10-lifetime-r1-explicit-residency
      - name: Run LIFETIME-R1 focused gate
        run: bash tests/run_lifetime_r1_tests.sh
