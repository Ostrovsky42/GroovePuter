name: tmp U4B5 materializer

on:
  push:
    branches:
      - tmp/20260906-ui-u4b5-runtime-phrase-undo
    paths:
      - scripts/tmp_u4b5_apply.py
      - .github/workflows/tmp_u4b5_materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded U4B5 patch
        run: python3 scripts/tmp_u4b5_apply.py
      - name: Verify exact production diff scope
        run: |
          git diff --name-only > /tmp/u4b5-diff.txt
          cat /tmp/u4b5-diff.txt
          test "$(cat /tmp/u4b5-diff.txt)" = "src/ui/pages/synth_sequencer_page.cpp"
      - name: Run focused U4B5 gate
        run: bash tests/run_ui_constitution_u4b5_tests.sh
      - name: Commit GREEN
        run: |
          git config user.name "Ostrovsky42"
          git config user.email "tootoo9723@gmail.com"
          git add src/ui/pages/synth_sequencer_page.cpp
          git commit -m "feat(ui): route Phrase edits through runtime Undo"
          git push origin HEAD:tmp/20260906-ui-u4b5-runtime-phrase-undo
