name: Apply Performance closure production patch

on:
  push:
    branches:
      - feature/20260903-03-0.9.9-performance-instrument-v1-closure
    paths:
      - ".github/workflows/apply-performance-closure-production.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/20260903-03-0.9.9-performance-instrument-v1-closure
          fetch-depth: 0
      - name: Apply production delta
        run: python3 .github/scripts/apply_performance_closure.py
      - name: Verify focused closure
        run: |
          bash tests/run_performance_closure_tests.sh
          g++ -std=c++20 -Wall -Wextra -Werror -I. -fsyntax-only src/input/internal_synth_output.cpp
          git diff --check
      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-performance-closure-production.yml
          git rm .github/scripts/apply_performance_closure.py
          git add src/input/internal_synth_output.h src/input/internal_synth_output.cpp
          git add src/input/performance_keyboard.cpp
          git add src/dsp/miniacid_engine.h src/dsp/miniacid_engine.cpp
          git add GroovePuter.ino platform_sdl/sdl_main.cpp
          git commit -m "fix: close performance ownership arbitration"
          git push origin HEAD:feature/20260903-03-0.9.9-performance-instrument-v1-closure
