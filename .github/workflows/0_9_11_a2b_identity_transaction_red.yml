name: 0.9.11 A2-B Identity Transaction GREEN

on:
  push:
    branches:
      - feature/20260911-0.9.11-a2b-identity-transaction
  workflow_dispatch:

env:
  RED_ROOT: 530d1fa4b26d21eb6902e016661c2fb17e162b06
  CANDIDATE_HEAD: ${{ github.sha }}

jobs:
  a2b-identity-transaction-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0

      - name: Prove exact checkout and RED ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_HEAD}"
          git merge-base --is-ancestor "${RED_ROOT}" HEAD

      - name: Prove bounded GREEN scope
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only "${RED_ROOT}"..HEAD | grep -Ev '^(\.github/workflows/0_9_11_a2b_identity_transaction_red.yml|src/state/melody_promotion.h|tests/test_0_9_11_a2b_identity_transaction.cpp|tests/test_0_9_11_a2_identity_bound_resolution.cpp|tests/test_melody_promotion.cpp)$' || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "Unexpected files in A2-B GREEN checkpoint:" >&2
            echo "${unexpected}" >&2
            exit 2
          fi

      - name: Prove identity-bound promotion transaction GREEN
        run: |
          set -euo pipefail
          bash tests/run_0_9_11_a2b_identity_transaction_red.sh

      - name: Preserve A2 identity and global durable addressing
        run: |
          set -euo pipefail
          bash tests/run_0_9_11_a2_identity_bound_resolution_red.sh

      - name: Preserve M2b storage transaction regressions
        run: |
          set -euo pipefail
          bash tests/run_melody_promotion_tests.sh
