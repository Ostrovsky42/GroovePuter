name: Fix launcher workflow memory

on:
  push:
    branches:
      - feature/workflow-session-persistence

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/workflow-session-persistence
          fetch-depth: 0

      - name: Apply fix
        run: python3 tools/fix_launcher_workflow_memory.py

      - name: Run focused regressions
        run: |
          python3 tests/test_ui_session_source_regressions.py
          python3 tests/test_theme_selection_source_regressions.py
          mkdir -p build/host-tests
          g++ -std=c++17 -Wall -Wextra -Werror -I. \
            tests/test_ui_session_state.cpp \
            -o build/host-tests/test_ui_session_state
          build/host-tests/test_ui_session_state

      - name: Commit production fix
        run: |
          rm -f tools/fix_launcher_workflow_memory.py
          rm -f .github/workflows/fix-launcher-workflow-memory.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve launcher workflow pages"
          git push origin HEAD:feature/workflow-session-persistence
