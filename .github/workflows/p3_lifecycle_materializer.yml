name: P3 Inherited P2 Lifecycle Materializer

on:
  push:
    branches:
      - feature/20260904-02-0.9.10-pattern-phrase-p3-phrase-lifetime
    paths:
      - '.github/workflows/p3_lifecycle_materializer.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated materializer lineage
        shell: bash
        run: |
          set -euo pipefail
          base=026c5ab5a912c050a8e9205ad6faf3837d5e43ff
          git merge-base --is-ancestor "$base" HEAD
          changed="$(git diff --name-only "$base"...HEAD)"
          test "$changed" = ".github/workflows/p3_lifecycle_materializer.yml" || {
            echo "Unexpected pre-materialization delta:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }

      - name: Apply single-owner lifecycle patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} occurrence(s), found {actual}: {old!r}"
                  )
              p.write_text(text.replace(old, new), encoding="utf-8")

          header = "src/dsp/miniacid_engine.h"
          replace(
              header,
              "  void setCurrentPage(int8_t page) { currentPage_.store(page, std::memory_order_release); }\n",
              "  void setCurrentPage(int8_t page);\n",
          )
          replace(
              header,
              "  bool rebuildPatternRuntimeEventBank();\n",
              "  void barrierPatternRuntimeSourceTransition();\n"
              "  bool rebuildPatternRuntimeEventBank();\n",
          )
          replace(
              header,
              "  void hardBarrierPatternPlayback_();\n",
              "  void hardBarrierPatternPlayback_(int synthIdx);\n"
              "  void hardBarrierPatternPlayback_();\n",
          )

          engine = "src/dsp/miniacid_engine.cpp"
          replace(
              engine,
              "  if (playing) publishPatternNoteOff_(idx);\n"
              "  if (synthVoices_[idx]) synthVoices_[idx]->release();\n"
              "  liveNotes_[idx] = -1;\n"
              "  ++liveInputEpoch_;\n",
              "  const uint8_t patternAuthorityAtEntry =\n"
              "      patternOwnedMask_.load(std::memory_order_acquire);\n"
              "  if ((patternAuthorityAtEntry & static_cast<uint8_t>(1u << idx)) != 0u) {\n"
              "    hardBarrierPatternPlayback_(idx);\n"
              "  } else if (synthVoices_[idx]) {\n"
              "    synthVoices_[idx]->release();\n"
              "  }\n"
              "  liveNotes_[idx] = -1;\n"
              "  ++liveInputEpoch_;\n",
          )
          replace(
              engine,
              "  if (muted) publishPatternNoteOff_(idx);\n",
              "  if (muted) hardBarrierPatternPlayback_(idx);\n",
              expected=2,
          )
          replace(
              engine,
              "  if (playing) publishPatternNoteOff_(idx);\n",
              "  hardBarrierPatternPlayback_(idx);\n",
              expected=4,
          )

          def replace_in_method(signature: str, old: str, new: str) -> None:
              p = Path(engine)
              text = p.read_text(encoding="utf-8")
              start = text.index(signature)
              nxt = text.find("\nvoid MiniAcid::", start + len(signature))
              if nxt < 0:
                  nxt = len(text)
              body = text[start:nxt]
              actual = body.count(old)
              if actual != 1:
                  raise SystemExit(
                      f"{signature}: expected one method-local occurrence, found {actual}"
                  )
              body = body.replace(old, new, 1)
              p.write_text(text[:start] + body + text[nxt:], encoding="utf-8")

          replace_in_method(
              "void MiniAcid::setSongMode(bool enabled)",
              "if (playing) publishPatternAllNotesOff_();",
              "hardBarrierPatternPlayback_();",
          )
          replace_in_method(
              "void MiniAcid::applySongPositionSelection()",
              "if (playing) publishPatternAllNotesOff_();",
              "hardBarrierPatternPlayback_();",
          )

          replace(
              engine,
              "void MiniAcid::requestPageSwitch(int pageIndex) {\n",
              "void MiniAcid::setCurrentPage(int8_t page) {\n"
              "  hardBarrierPatternPlayback_();\n"
              "  currentPage_.store(page, std::memory_order_release);\n"
              "}\n\n"
              "void MiniAcid::requestPageSwitch(int pageIndex) {\n",
          )
          replace(
              engine,
              "void MiniAcid::hardBarrierPatternPlayback_() {\n"
              "  for (int synth = 0; synth < NUM_303_VOICES; ++synth) {\n"
              "    const auto actions = patternPlaybackState_[synth].hardBarrier();\n"
              "    consumePatternPlaybackActions_(synth, actions);\n"
              "  }\n"
              "}\n",
              "void MiniAcid::hardBarrierPatternPlayback_(int synthIdx) {\n"
              "  const auto actions = patternPlaybackState_[synthIdx].hardBarrier();\n"
              "  consumePatternPlaybackActions_(synthIdx, actions);\n"
              "}\n\n"
              "void MiniAcid::hardBarrierPatternPlayback_() {\n"
              "  for (int synth = 0; synth < NUM_303_VOICES; ++synth) {\n"
              "    hardBarrierPatternPlayback_(synth);\n"
              "  }\n"
              "}\n\n"
              "void MiniAcid::barrierPatternRuntimeSourceTransition() {\n"
              "  hardBarrierPatternPlayback_();\n"
              "}\n",
          )

          generation = "src/generation/migration/quantized_generation_undo_owner_impl.h"
          replace(
              generation,
              "  int8_t expectedSlot = static_cast<int8_t>(slot);\n"
              "  g_publishedSlot.compare_exchange_strong(\n"
              "      expectedSlot, -1, std::memory_order_acq_rel, std::memory_order_acquire);\n"
              "  g_status.store(\n"
              "      static_cast<uint8_t>(QuantizedGenerationStatus::CancelledExplicit),\n"
              "      std::memory_order_release);\n"
              "  return true;\n",
              "  engine.barrierPatternRuntimeSourceTransition();\n"
              "  int8_t expectedSlot = static_cast<int8_t>(slot);\n"
              "  g_publishedSlot.compare_exchange_strong(\n"
              "      expectedSlot, -1, std::memory_order_acq_rel, std::memory_order_acquire);\n"
              "  g_status.store(\n"
              "      static_cast<uint8_t>(QuantizedGenerationStatus::CancelledExplicit),\n"
              "      std::memory_order_release);\n"
              "  return true;\n",
              expected=2,
          )
          replace(
              generation,
              "  activatePreparedGenerationRuntime(*owner, pending);\n",
              "  owner->barrierPatternRuntimeSourceTransition();\n"
              "  activatePreparedGenerationRuntime(*owner, pending);\n",
          )

          stale_fixture = "tests/test_pattern_phrase_p2_single_lifetime_owner_contract.py"
          old_fixture = '''barrier = between(
              ENGINE,
              "void MiniAcid::hardBarrierPatternPlayback_()",
              "void MiniAcid::cleanupLiveNotesForTransportBarrier_(",
          )
          require(
              "patternPlaybackState_[synth].hardBarrier()" in barrier,
              "RED #2: Pattern hard barrier does not ask RuntimeSynthPlaybackState for Release",
          )
          require(
              "consumePatternPlaybackActions_" in barrier,
              "RED #2: Pattern hard barrier bypasses common target-scoped action translation",
          )
          for forbidden in (
              "publishPatternAllNotesOff_()",
              "publishPatternNoteOff_(",
              "synthVoices_[",
              "gateCountdownA_",
              "gateCountdownB_",
              "patternOwnedMask_",
          ):
              require(
                  forbidden not in barrier,
                  f"RED #2: Pattern hard barrier retained a parallel backend/lifetime decision: {forbidden}",
              )
          '''
          new_fixture = '''target_barrier = between(
              ENGINE,
              "void MiniAcid::hardBarrierPatternPlayback_(int synthIdx)",
              "void MiniAcid::hardBarrierPatternPlayback_()",
          )
          require(
              "patternPlaybackState_[synthIdx].hardBarrier()" in target_barrier,
              "RED #2: target Pattern hard barrier does not ask RuntimeSynthPlaybackState for Release",
          )
          require(
              "consumePatternPlaybackActions_(synthIdx" in target_barrier,
              "RED #2: target Pattern hard barrier bypasses common action translation",
          )

          barrier = between(
              ENGINE,
              "void MiniAcid::hardBarrierPatternPlayback_()",
              "void MiniAcid::cleanupLiveNotesForTransportBarrier_(",
          )
          require(
              "hardBarrierPatternPlayback_(synth)" in barrier,
              "RED #2: all-target Pattern hard barrier does not delegate to target owner barrier",
          )
          for forbidden in (
              "publishPatternAllNotesOff_()",
              "publishPatternNoteOff_(",
              "synthVoices_[",
              "gateCountdownA_",
              "gateCountdownB_",
              "patternOwnedMask_",
          ):
              require(
                  forbidden not in target_barrier + barrier,
                  f"RED #2: Pattern hard barrier retained a parallel backend/lifetime decision: {forbidden}",
              )
          '''
          replace(stale_fixture, old_fixture, new_fixture)
          PY
          git diff --check

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            libsdl2-dev \
            libsdl2-gfx-dev \
            pkg-config

      - name: Verify inherited P2 focused gate
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: bash tests/run_pattern_phrase_p2_tests.sh

      - name: Commit verified production closure
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/p3_lifecycle_materializer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dsp/miniacid_engine.h \
                  src/dsp/miniacid_engine.cpp \
                  src/generation/migration/quantized_generation_undo_owner_impl.h \
                  tests/test_pattern_phrase_p2_single_lifetime_owner_contract.py \
                  .github/workflows/p3_lifecycle_materializer.yml
          git diff --cached --check
          git commit -m "fix(p2): close lifecycle transitions through playback owner"
          git push origin HEAD:"${GITHUB_REF_NAME}"
