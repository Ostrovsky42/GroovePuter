name: Research Manual

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Historical/research suite to reproduce"
        required: true
        default: "gf2"
        type: choice
        options:
          - gf2
          - phrase
          - generation
          - ui
          - undo
          - sampler
          - stage15
          - all

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libsdl2-dev libsdl2-gfx-dev
      - name: Run selected research suite
        run: bash scripts/ci/run_research.sh "${{ inputs.suite }}"
