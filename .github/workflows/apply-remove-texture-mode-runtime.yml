name: Apply TextureMode runtime migration

on:
  push:
    branches:
      - agent/remove-texture-mode
    paths:
      - 'scripts/apply_remove_texture_mode_runtime.py'
      - '.github/workflows/apply-remove-texture-mode-runtime.yml'
  pull_request:
    branches:
      - dev_0.9
    paths:
      - 'scripts/apply_remove_texture_mode_runtime.py'
      - '.github/workflows/apply-remove-texture-mode-runtime.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-texture-mode
          fetch-depth: 0
      - name: Apply migration
        run: python3 scripts/apply_remove_texture_mode_runtime.py
      - name: Remove one-shot migration machinery
        run: |
          rm scripts/apply_remove_texture_mode_runtime.py
          rm .github/workflows/apply-remove-texture-mode-runtime.yml
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: remove TextureMode runtime model'
          git push origin HEAD:agent/remove-texture-mode
