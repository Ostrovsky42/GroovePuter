name: Stage 15 Tonal Materializer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tonal-materializer-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Tonal Materializer host matrix
        env:
          ASAN_OPTIONS: "detect_leaks=0"
        run: bash tests/run_tonal_materializer_tests.sh
