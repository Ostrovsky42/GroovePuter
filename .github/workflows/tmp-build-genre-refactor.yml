name: One-shot assemble Genre refactor

on:
  push:
    branches:
      - integration/remove-genre-manager-current-dev

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ !contains(github.event.head_commit.message, '[genre-current-dev-done]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/remove-genre-manager-current-dev
          fetch-depth: 0
      - name: Apply #132 ownership and UI changes over current release base
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin agent/remove-genre-manager

          # Copy files where #132 owns the full implementation.
          git checkout origin/agent/remove-genre-manager -- \
            src/dsp/genre_catalog.h \
            src/dsp/genre_catalog.cpp \
            src/ui/pages/genre_page.cpp \
            src/ui/pages/genre_page.h \
            src/ui/workflow_mode.h \
            src/state/ui_session_state.h \
            tests/test_atlas_sound_profile.py \
            tests/test_four_axis_ui_source_regressions.py \
            tests/test_genre_defaults.cpp \
            tests/test_ui_session_state.cpp \
            docs/testing/GENRE_MANAGER_REMOVAL_ACCEPTANCE.md

          # Historical manager implementation and standalone Generation page are gone.
          git rm -f --ignore-unmatch \
            src/dsp/genre_manager.h src/dsp/genre_manager.cpp \
            src/ui/pages/generation_page.h src/ui/pages/generation_page.cpp

          # Keep current #143/#131-era code and only migrate references to the new API.
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('src'), Path('tests'), Path('platform_sdl')]
          suffixes = {'.h', '.hpp', '.cpp', '.cc', '.cxx', '.py'}
          for base in roots:
              if not base.exists():
                  continue
              for path in base.rglob('*'):
                  if not path.is_file() or path.suffix not in suffixes:
                      continue
                  text = path.read_text(encoding='utf-8')
                  original = text
                  text = text.replace('genre_manager.h', 'genre_catalog.h')
                  text = text.replace('genre_manager.cpp', 'genre_catalog.cpp')
                  text = text.replace('GenreManager', 'GenreSceneView')
                  text = text.replace('genreManager_', 'genreView_')
                  text = text.replace('genreManager()', 'genreView()')
                  text = text.replace('"GENRE 1/3"', '"GENRE 1/2"')
                  text = text.replace('"FEEL 2/3"', '"FEEL 2/2"')
                  if text != original:
                      path.write_text(text, encoding='utf-8')

          # The new catalog header must not retain the historical guard name.
          p = Path('src/dsp/genre_catalog.h')
          text = p.read_text(encoding='utf-8')
          text = text.replace('GENRE_MANAGER_H', 'GROOVEPUTER_GENRE_CATALOG_H')
          p.write_text(text, encoding='utf-8')
          PY

          # Ensure current host runner includes the ownership tests.
          if ! grep -q 'test_atlas_sound_profile.py' tests/run_host_tests.sh; then
            sed -i '/test_smf_route_persistence_source_regressions.py/a python3 "${ROOT_DIR}/tests/test_atlas_sound_profile.py"' tests/run_host_tests.sh
          fi

          rm -f .github/workflows/tmp-build-genre-refactor.yml
          git add -A
          git commit -m 'refactor: remove GenreManager API and Generation page [genre-current-dev-done]'
          git push origin HEAD:integration/remove-genre-manager-current-dev
