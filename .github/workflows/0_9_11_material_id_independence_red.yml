name: 0.9.11 MaterialId Independence G1

on:
  push:
    branches:
      - fix/20260911-0.9.11-material-id-independence
  workflow_dispatch:

permissions:
  contents: read

env:
  W0_ROOT: d96d3f5e266d0c28ce07b358fe034de219d636ca
  CANDIDATE_HEAD: ${{ github.sha }}

jobs:
  material-id-independence-g1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0

      - name: Prove exact checkout and W0 ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_HEAD}"
          git merge-base --is-ancestor "${W0_ROOT}" HEAD
          echo "W0_ROOT=${W0_ROOT}"
          echo "HEAD=$(git rev-parse HEAD)"

      - name: Prove G1 production delta is identity-only
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "${W0_ROOT}"..HEAD)"
          printf '%s\n' "${changed}"
          test -n "${changed}"
          bad="$(printf '%s\n' "${changed}" | grep -Ev '^(docs/|tests/|\.github/workflows/|src/state/material_identity\.h$)' || true)"
          if [ -n "${bad}" ]; then
            echo "G1 changed files outside independent identity scope:" >&2
            printf '%s\n' "${bad}" >&2
            exit 2
          fi

      - name: Run address-reuse adversarial contract
        run: bash tests/run_0_9_11_material_id_independence_red.sh

      - name: Diff hygiene
        run: git diff --check "${W0_ROOT}"..HEAD
