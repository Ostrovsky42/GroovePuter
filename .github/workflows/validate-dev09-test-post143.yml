name: Validate dev_0.9_test post-143 integration

on:
  pull_request:
    branches: [dev_0.9_test]

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'integration/dev09-into-dev09-test-post143'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/dev09-into-dev09-test-post143
          fetch-depth: 0

      - name: Check combined source contracts
        run: |
          python3 tests/test_remove_texture_mode_runtime.py
          python3 tests/test_synth_persistence_source_regressions.py
          python3 tests/test_phrase_scene_source_regressions.py
          python3 tests/test_phrase_ui_source_regressions.py

      - name: Run host regressions
        run: bash tests/run_host_tests.sh

      - name: Install SDL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libsdl2-dev libsdl2-gfx-dev

      - name: Build SDL target
        working-directory: platform_sdl
        run: make clean all CXX=g++

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install pinned M5Stack dependencies
        run: bash scripts/install_arduino_deps.sh

      - name: Build Cardputer ADV and check fixed DRAM
        run: |
          bash scripts/build.sh --warnings all
          bash scripts/check_cardputer_dram_budget.sh build/cardputer-adv-current/GroovePuter.ino.elf

      - name: Build SEQTRAK MIDI-only target
        run: bash scripts/build_seqtrak_midi_only.sh --warnings all

      - name: Remove temporary validation workflow
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/validate-dev09-test-post143.yml
          git add -A
          git commit -m "ci: remove temporary post-143 integration validator"
          git push origin HEAD:integration/dev09-into-dev09-test-post143
