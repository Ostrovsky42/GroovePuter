name: 0.9.10 MEMORY-R1 materialize closure

on:
  push:
    branches:
      - integration/20260908-0.9.10-memory-r1-product-closure

permissions:
  contents: write

jobs:
  materialize:
    if: "${{ startsWith(github.event.head_commit.message, 'materializer(memory)') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact accepted MEMORY-R1 evidence head
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            feature/20260908-0.9.10-memory-r1-wt1:refs/remotes/origin/memory-r1-wt1
          git cat-file -e 9fa4bb12e3c4826720f16ace865a2c4de8e4cc0c^{commit}

      - name: Materialize proven closure changes
        run: python3 scripts/materialize_memory_r1_product_closure.py

      - name: Verify focused closure before commit
        run: |
          set -euo pipefail
          git diff --check
          python3 tests/test_memory_r1_product_closure.py
          python3 tests/test_source_regressions.py
          python3 tests/_performance_source_regressions_base.py
          bash tests/run_pattern_phrase_p2_tests.sh

      - name: Commit exact closure delta
        run: |
          set -euo pipefail
          git config user.name "GroovePuter CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            GroovePuter.ino \
            scripts/build_fatfs_dynbuffers_candidate.sh \
            scripts/build_cardputer_dynbuffers.sh \
            scripts/instrument_cardputer_memory_runtime.py \
            src/dsp/audio_wavetables.h \
            src/dsp/audio_wavetables.cpp \
            tests/test_source_regressions.py \
            tests/_performance_source_regressions_base.py
          git commit -m "fix(memory): integrate accepted MEMORY-R1 closure on M4"
          git push origin HEAD:integration/20260908-0.9.10-memory-r1-product-closure
