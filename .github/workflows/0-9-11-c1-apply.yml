name: 0.9.11 C1 Semantic Transplant

on:
  push:
    branches:
      - integration/20260913-0.9.11-c1-full
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-c1-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact descendant
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor c168803c26b6e67d3f661494a18493eb459fe022 HEAD

      - name: Fetch semantic donors
        run: |
          set -euo pipefail
          git fetch origin \
            fd4991c232208989aead9f4e8062c7b01f34a518 \
            4500f351b978f8f853d32595c95640e461827268 \
            e22990ea31adf268cff85ecf220d63b8cbd86118 \
            730daa7d23f081123f34e122d6f85cfa17ee3158

      - name: Apply bounded C1 production transplant
        shell: bash
        run: |
          set -euo pipefail
          git show 4500f351b978f8f853d32595c95640e461827268:src/state/working_material_storage.h > src/state/working_material_storage.h
          git show e22990ea31adf268cff85ecf220d63b8cbd86118:src/state/melody_promotion.h > src/state/melody_promotion.h
          git show 730daa7d23f081123f34e122d6f85cfa17ee3158:src/state/material_version.h > src/state/material_version.h
          git show 730daa7d23f081123f34e122d6f85cfa17ee3158:src/state/material_resolution.h > src/state/material_resolution.h

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def once(text: str, old: str, new: str, label: str) -> str:
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"C1 transplant anchor {label}: expected 1, got {n}")
              return text.replace(old, new, 1)

          hp = Path("src/dsp/miniacid_engine.h")
          h = hp.read_text()

          if '#include "src/state/working_material_storage.h"' not in h:
              h = once(
                  h,
                  '#include "src/state/material_slot.h"\n',
                  '#include "src/state/material_slot.h"\n#include "src/state/material_slot_access.h"\n#include "src/state/working_material_storage.h"\n',
                  "engine includes",
              )
          elif '#include "src/state/material_slot_access.h"' not in h:
              h = once(
                  h,
                  '#include "src/state/material_slot.h"\n',
                  '#include "src/state/material_slot.h"\n#include "src/state/material_slot_access.h"\n',
                  "slot access include",
              )

          working_decl = '''  // 0.9.11 C1: session Working is bound to stable MaterialReference.\n  bool adjustWorking303StepNote(int voiceIndex, int stepIndex,\n                                int semitoneDelta);\n  const SynthPattern* currentWorking303Pattern(int voiceIndex) const;\n  bool hasModifiedWorking303Pattern(int voiceIndex) const;\n  bool tryManual303TargetSwitch(int voiceIndex, int bankIndex, int patternIndex);\n  bool tryManualPageSwitch(int pageIndex);\n\n'''
          if 'bool adjustWorking303StepNote(' not in h:
              h = once(
                  h,
                  '  void adjust303StepOctave(int voiceIndex, int stepIndex, int octaveDelta);\n\n',
                  '  void adjust303StepOctave(int voiceIndex, int stepIndex, int octaveDelta);\n\n' + working_decl,
                  "Working public API",
              )

          if 'bool current303MaterialReference_(' not in h:
              h = once(
                  h,
                  '  const SynthPattern& synthPattern(int synthIndex) const;\n',
                  '  bool current303MaterialReference_(\n      int voiceIndex, GroovePuterMaterial::MaterialReference& out) const;\n  const SynthPattern& synthPattern(int synthIndex) const;\n',
                  "MaterialReference helper declaration",
              )

          if 'PhraseRuntime::RuntimeSynthEventBuffer currentPhrase_[NUM_303_VOICES]{};' in h:
              h = once(
                  h,
                  '  PhraseRuntime::RuntimeSynthEventBuffer currentPhrase_[NUM_303_VOICES]{};\n',
                  '  GroovePuterMaterial::WorkingMaterialStorage workingMaterial_[NUM_303_VOICES]{};\n',
                  "unified Working storage",
              )
          elif 'GroovePuterMaterial::WorkingMaterialStorage workingMaterial_[NUM_303_VOICES]{};' not in h:
              raise SystemExit("C1 transplant: neither currentPhrase_ nor unified Working storage found")

          if 'inline bool MiniAcid::current303MaterialReference_(' not in h:
              donor = subprocess.check_output(
                  ['git','show','4500f351b978f8f853d32595c95640e461827268:src/dsp/miniacid_engine.h'],
                  text=True,
              )
              start = donor.index('inline bool MiniAcid::current303MaterialReference_(')
              end = donor.rindex('#endif // MINIACID_ENGINE_H')
              block = donor[start:end].rstrip()
              retarget = r'''

inline bool MiniAcid::tryManual303TargetSwitch(
    int voiceIndex, int bankIndex, int patternIndex) {
  if (voiceIndex < 0 || voiceIndex >= NUM_303_VOICES) return false;
  if (bankIndex < 0 || bankIndex >= kBankCount || patternIndex < 0 ||
      patternIndex >= Bank<SynthPattern>::kPatterns) return false;
  const int idx = clamp303Voice(voiceIndex);
  if (current303BankIndex(idx) == bankIndex &&
      display303LocalPatternIndex(idx) == patternIndex) {
    return true;
  }
  if (hasModifiedWorking303Pattern(idx)) return false;
  set303BankIndex(idx, bankIndex);
  set303PatternIndex(idx, patternIndex);
  return current303BankIndex(idx) == bankIndex &&
         display303LocalPatternIndex(idx) == patternIndex;
}

inline bool MiniAcid::tryManualPageSwitch(int pageIndex) {
  if (pageIndex < 0 || pageIndex >= kMaxPages) return false;
  if (pageIndex == currentPageIndex()) return true;
  for (int voice = 0; voice < NUM_303_VOICES; ++voice) {
    if (hasModifiedWorking303Pattern(voice)) return false;
  }
  requestPageSwitch(pageIndex);
  return targetPageIndex() == pageIndex || currentPageIndex() == pageIndex;
}
'''
              h = once(
                  h,
                  '#endif // MINIACID_ENGINE_H',
                  block + retarget + '\n\n#endif // MINIACID_ENGINE_H',
                  "Working inline implementation",
              )
          hp.write_text(h)

          cp = Path("src/dsp/miniacid_engine.cpp")
          c = cp.read_text()
          replacements = [
              ('currentPhrase_[clamp303Voice(voiceIndex)].lengthTicks',
               'workingMaterial_[clamp303Voice(voiceIndex)].melody().lengthTicks',
               'phrase relative length'),
              ('const PhraseRuntime::RuntimeSynthEventBuffer& phrase = currentPhrase_[idx];',
               'const PhraseRuntime::RuntimeSynthEventBuffer& phrase =\n      workingMaterial_[idx].melody();',
               'phrase event source'),
              ('currentPhrase_[voice] = *pending.melody;',
               'workingMaterial_[voice].storeMelody(*pending.melody);',
               'pending melody activation'),
              ('currentPhrase_[voiceIndex].lengthTicks',
               'workingMaterial_[voiceIndex].melody().lengthTicks',
               'phrase play tick'),
              ('currentPhrase_[voiceIndex] = candidate;',
               'workingMaterial_[voiceIndex].storeMelody(candidate);',
               'make phrase commit'),
              ('auto candidate = currentPhrase_[voiceIndex];',
               'auto candidate = workingMaterial_[voiceIndex].melody();',
               'phrase length prepare'),
              ('RuntimePhraseEdit::commit(currentPhrase_[voiceIndex], candidate)',
               'RuntimePhraseEdit::commit(\n      workingMaterial_[voiceIndex].melody(), candidate)',
               'phrase length commit'),
              ('return currentPhrase_[clamp303Voice(voiceIndex)];',
               'return workingMaterial_[clamp303Voice(voiceIndex)].melody();',
               'phrase buffer accessors'),
          ]
          for old, new, label in replacements:
              expected = 2 if label == 'phrase buffer accessors' else 1
              n = c.count(old)
              if n != expected:
                  raise SystemExit(f"C1 transplant cpp anchor {label}: expected {expected}, got {n}")
              c = c.replace(old, new)
          if 'currentPhrase_[' in c:
              raise SystemExit('C1 transplant left currentPhrase_ references in engine cpp')
          cp.write_text(c)
          PY

          git diff --check
          git diff --stat

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-gfx-dev pkg-config

      - name: Prove focused C1 GREEN before publication
        run: bash tests/run_0_9_11_c1_full_tests.sh

      - name: Publish one bounded production commit
        run: |
          set -euo pipefail
          git diff --quiet && { echo "C1 production already applied"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dsp/miniacid_engine.h src/dsp/miniacid_engine.cpp \
                  src/state/working_material_storage.h src/state/melody_promotion.h \
                  src/state/material_version.h src/state/material_resolution.h
          unexpected="$(git diff --cached --name-only | grep -Ev '^(src/dsp/miniacid_engine\.(h|cpp)|src/state/(working_material_storage|melody_promotion|material_version|material_resolution)\.h)$' || true)"
          test -z "${unexpected}"
          git commit -m "feat(c1): converge identity-bound Working authority"
          git push origin HEAD:integration/20260913-0.9.11-c1-full
