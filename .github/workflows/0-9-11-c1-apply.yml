name: 0.9.11 C1 Semantic Transplant

on:
  push:
    branches:
      - integration/20260913-0.9.11-c1-full
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-c1-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact descendant
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor c168803c26b6e67d3f661494a18493eb459fe022 HEAD

      - name: Fetch semantic donors
        run: |
          set -euo pipefail
          git fetch origin \
            fd4991c232208989aead9f4e8062c7b01f34a518 \
            4500f351b978f8f853d32595c95640e461827268 \
            e22990ea31adf268cff85ecf220d63b8cbd86118 \
            730daa7d23f081123f34e122d6f85cfa17ee3158

      - name: Apply bounded C1 production transplant
        run: |
          set -euo pipefail
          python3 tools/c1_semantic_transplant.py
          git diff --check
          git diff --stat

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-gfx-dev pkg-config

      - name: Prove focused C1 GREEN before publication
        run: bash tests/run_0_9_11_c1_full_tests.sh

      - name: Publish one bounded production commit
        run: |
          set -euo pipefail
          git diff --quiet && { echo "C1 production already applied"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dsp/miniacid_engine.h src/dsp/miniacid_engine.cpp \
                  src/state/working_material_storage.h src/state/melody_promotion.h \
                  src/state/material_version.h src/state/material_resolution.h
          unexpected="$(git diff --cached --name-only | grep -Ev '^(src/dsp/miniacid_engine\.(h|cpp)|src/state/(working_material_storage|melody_promotion|material_version|material_resolution)\.h)$' || true)"
          test -z "${unexpected}"
          git commit -m "feat(c1): converge identity-bound Working authority"
          git push origin HEAD:integration/20260913-0.9.11-c1-full
