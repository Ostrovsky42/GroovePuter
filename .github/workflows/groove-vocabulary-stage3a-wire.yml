name: Groove Vocabulary Stage 3A temporary wiring

on:
  pull_request:

permissions:
  contents: write

jobs:
  wire-cardputer:
    if: github.event.pull_request.head.ref == 'agent/20260808-05-groove-vocabulary-stage3a-audition'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Apply bounded audition hook patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('GroovePuter.ino')
          text = path.read_text(encoding='utf-8')

          include_anchor = '#include "src/ui/ui_common.h"\n'
          include_line = '#include "src/generation/audition/rhythm_audition_cardputer.h"\n'
          if include_line not in text:
              assert text.count(include_anchor) == 1, 'unexpected ui_common include anchor count'
              text = text.replace(include_anchor, include_anchor + include_line, 1)

          old = '      handled = g_miniDisplay ? g_miniDisplay->handleEvent(evt) : false;\n'
          new = (
              '      handled = GroovePuterRhythm::Audition::handleCardputerAuditionEvent(\n'
              '                    evt, *g_miniAcid) ||\n'
              '                (g_miniDisplay ? g_miniDisplay->handleEvent(evt) : false);\n'
          )
          if new not in text:
              assert text.count(old) == 1, 'unexpected display handle anchor count'
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check -- GroovePuter.ino
          git diff -- GroovePuter.ino

      - name: Commit bounded audition hook patch
        run: |
          if git diff --quiet -- GroovePuter.ino; then
            echo 'GroovePuter.ino already wired'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GroovePuter.ino
          git commit -m 'test: wire Stage 3A audition controls'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
