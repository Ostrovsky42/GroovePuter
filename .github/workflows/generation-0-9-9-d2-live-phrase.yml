name: 0.9.9-D2 live Phrase arrangement

on:
  pull_request:
    paths:
      - 'src/dsp/generated_phrase_song.h'
      - 'src/dsp/miniacid_engine.cpp'
      - 'src/generation/migration/phrase_live_arrangement_activation.h'
      - 'src/generation/migration/quantized_generation_commit.h'
      - 'src/generation/migration/quantized_generation_commit_impl.h'
      - 'src/generation/migration/quantized_generation_undo_owner_impl.h'
      - 'src/ui/pages/phrase_page.cpp'
      - 'tests/test_phrase_live_arrangement_0_9_9.cpp'
      - 'tests/test_phrase_live_arrangement_0_9_9_source.py'
      - 'tests/run_0_9_9_d2_tests.sh'
      - 'docs/releases/0_9_9_D2_LIVE_PHRASE_ARRANGEMENT.md'
      - '.github/workflows/generation-0-9-9-d2-live-phrase.yml'

permissions:
  contents: read

jobs:
  d2-live-phrase-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run D2 cumulative host contracts
        run: bash tests/run_0_9_9_d2_tests.sh
