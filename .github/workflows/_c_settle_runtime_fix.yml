name: temporary C pending settle runtime fix

on:
  push:
    branches:
      - feature/0.9.9-c-bounded-activation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.9.9-c-bounded-activation

      - name: Apply pending settle fix
        run: echo '' | base64 -d | python3

      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/generation/migration/quantized_generation_undo_owner_impl.h src/dsp/miniacid_engine.cpp
          git commit -m "fix: settle committed runtime when C pending is dropped"
          git push origin HEAD:feature/0.9.9-c-bounded-activation
