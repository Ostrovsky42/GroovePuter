name: temporary C pending settle runtime fix

on:
  push:
    branches:
      - feature/0.9.9-c-bounded-activation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.9.9-c-bounded-activation

      - name: Apply pending settle fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/generation/migration/quantized_generation_undo_owner_impl.h')
          s = p.read_text()

          old = '''inline const PendingGeneration* pendingAudibleActivation(
              const MiniAcid& engine) {
            const int slot = g_publishedSlot.load(std::memory_order_acquire);
            if (slot < 0 || slot > 1) return nullptr;
            const SlotState state = static_cast<SlotState>(
                g_slotState[slot].load(std::memory_order_acquire));
            if (state != SlotState::Armed && state != SlotState::Ready) return nullptr;
            const PendingGeneration& pending = g_slots[slot];
            if (pending.owner != &engine ||
                !targetValid(pending.target) ||
                !targetStillActive(engine.sceneManager(), pending.target)) {
              return nullptr;
            }
            return &pending;
          }
          '''
          new = '''inline const PendingGeneration* pendingAudibleActivation(
              const MiniAcid& engine) {
            const int slot = g_publishedSlot.load(std::memory_order_acquire);
            if (slot < 0 || slot > 1) return nullptr;
            const SlotState state = static_cast<SlotState>(
                g_slotState[slot].load(std::memory_order_acquire));
            if (state != SlotState::Armed && state != SlotState::Ready) return nullptr;
            const PendingGeneration& pending = g_slots[slot];
            if (pending.owner != &engine || !targetValid(pending.target)) return nullptr;
            // Keep the old global audible truth (genre/swing/runtime controls)
            // until BAR_START even if a selector changes. Material accessors
            // below validate the exact target separately so an old Pattern is
            // never redirected onto the newly selected target.
            return &pending;
          }
          '''
          if old not in s:
              raise SystemExit('pendingAudibleActivation anchor missing')
          s = s.replace(old, new, 1)

          old = '''  const bool included = pending->scope == QuantizedGenerationScope::Full ||
              (voice == 0 && pending->scope == QuantizedGenerationScope::SynthA) ||
              (voice == 1 && pending->scope == QuantizedGenerationScope::SynthB);
            return included ? &pending->synth[voice] : nullptr;
          }
          '''
          new = '''  const bool included = pending->scope == QuantizedGenerationScope::Full ||
              (voice == 0 && pending->scope == QuantizedGenerationScope::SynthA) ||
              (voice == 1 && pending->scope == QuantizedGenerationScope::SynthB);
            if (!included ||
                !targetStillActive(engine.sceneManager(), pending->target)) return nullptr;
            return &pending->synth[voice];
          }
          '''
          if old not in s:
              raise SystemExit('synth overlay anchor missing')
          s = s.replace(old, new, 1)

          old = '''  if (pending == nullptr ||
              pending->scope != QuantizedGenerationScope::Full) return nullptr;
            return &pending->drums;
          }
          '''
          new = '''  if (pending == nullptr ||
              pending->scope != QuantizedGenerationScope::Full ||
              !targetStillActive(engine.sceneManager(), pending->target)) return nullptr;
            return &pending->drums;
          }
          '''
          if old not in s:
              raise SystemExit('drum overlay anchor missing')
          s = s.replace(old, new, 1)

          anchor = '''inline bool hasPendingFullGenerationActivation(const MiniAcid& engine) {
            const PendingGeneration* pending = pendingAudibleActivation(engine);
            return pending != nullptr &&
                   pending->scope == QuantizedGenerationScope::Full;
          }

          '''
          insert = anchor + '''inline void synchronizeCommittedGenerationRuntime(MiniAcid& engine) {
            // A pending cancellation/drop never rolls Scene back. Once the old
            // audible overlay disappears, runtime controls must converge to the
            // current committed Scene truth even when normal ACTIVATE was skipped.
            engine.activateCommittedGrooveboxModeRuntime(engine.sceneManager().getMode());
            engine.setBpm(engine.sceneManager().getBpm());
          }

          '''
          if anchor not in s:
              raise SystemExit('runtime sync insertion anchor missing')
          s = s.replace(anchor, insert, 1)

          old = '''    g_status.store(
                static_cast<uint8_t>(QuantizedGenerationStatus::CancelledTargetChanged),
                std::memory_order_release);
              return false;
            }
          '''
          new = '''    synchronizeCommittedGenerationRuntime(*owner);
              g_status.store(
                static_cast<uint8_t>(QuantizedGenerationStatus::CancelledTargetChanged),
                std::memory_order_release);
              return false;
            }
          '''
          if old not in s:
              raise SystemExit('stale target BAR anchor missing')
          s = s.replace(old, new, 1)

          old = '''    g_status.store(
                static_cast<uint8_t>(QuantizedGenerationStatus::CancelledRevisionChanged),
                std::memory_order_release);
              return false;
            }
          '''
          new = '''    synchronizeCommittedGenerationRuntime(*owner);
              g_status.store(
                static_cast<uint8_t>(QuantizedGenerationStatus::CancelledRevisionChanged),
                std::memory_order_release);
              return false;
            }
          '''
          if old not in s:
              raise SystemExit('stale revision BAR anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/dsp/miniacid_engine.cpp')
          s = p.read_text()
          old = '''void MiniAcid::stop() {
            GroovePuterRhythm::QuantizedGenerationDetail::cancelPendingGenerationActivation(*this);
            LOG_PRINTLN("[DSP] STOP command received");
          '''
          new = '''void MiniAcid::stop() {
            if (GroovePuterRhythm::QuantizedGenerationDetail::
                    cancelPendingGenerationActivation(*this)) {
              GroovePuterRhythm::QuantizedGenerationDetail::
                  synchronizeCommittedGenerationRuntime(*this);
            }
            LOG_PRINTLN("[DSP] STOP command received");
          '''
          if old not in s:
              raise SystemExit('stop settle anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/generation/migration/quantized_generation_undo_owner_impl.h src/dsp/miniacid_engine.cpp
          git commit -m "fix: settle committed runtime when C pending is dropped"
          git push origin HEAD:feature/0.9.9-c-bounded-activation
