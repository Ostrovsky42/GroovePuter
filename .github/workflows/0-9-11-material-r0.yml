name: 0.9.11 MATERIAL-R0 Reconciliation

on:
  push:
    branches:
      - integration/20260912-0.9.11-material-r0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: material-r0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SDL host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libsdl2-dev \
            libsdl2-gfx-dev

      - name: Enforce MW-K Working storage semantics
        run: |
          bash tests/run_0_9_11_m_working_storage_tests.sh
          bash tests/run_0_9_11_m_working_melody_compat_tests.sh

      - name: Enforce MW-K transactional Pattern editing
        run: bash tests/run_0_9_11_m_working_manual_pattern_edit_tests.sh

      - name: Enforce MW-K derived modified state
        run: bash tests/run_0_9_11_m_working_modified_state_tests.sh

      - name: Enforce MW-K UI note ownership
        run: python3 tests/test_0_9_11_m_working_ui_note_source_contract.py

      - name: Preserve audible Pattern publication
        run: bash tests/run_0_9_11_audible_pattern_publication_tests.sh

      - name: Preserve Material ACTIVE/NEXT causality
        run: |
          bash tests/run_m3_material_authority_tests.sh
          bash tests/run_m4_next_material_tests.sh

      - name: Preserve A2-B identity-bound promotion
        run: |
          bash tests/run_0_9_11_a2_identity_bound_resolution_red.sh
          bash tests/run_0_9_11_a2b_identity_transaction_red.sh
          bash tests/run_melody_promotion_tests.sh

      - name: Preserve M-WORKING characterization without STOP
        shell: bash
        run: |
          set +e
          bash tests/run_0_9_11_m_working_tests.sh 2>&1 | tee /tmp/material-r0-m-working.log
          status=${PIPESTATUS[0]}
          set -e
          echo "runner_status=$status" | tee -a /tmp/material-r0-m-working.log
          if [[ "$status" -eq 2 ]]; then
            echo 'A hard M-WORKING STOP gate tripped' >&2
            exit 1
          fi
          if [[ "$status" -ne 0 && "$status" -ne 1 ]]; then
            echo "Unexpected M-WORKING runner status $status" >&2
            exit 1
          fi
          if grep -q 'M-WORKING STOP' /tmp/material-r0-m-working.log; then
            echo 'A hard M-WORKING STOP gate tripped' >&2
            exit 1
          fi
