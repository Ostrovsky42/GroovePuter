name: Agent idle audio AUX fix

on:
  push:
    branches:
      - agent/20260807-05-idle-audio-aux-noise-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused idle-audio fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/platform/cardputer_adv_hardware.h',
              '''// GPIO21 is the power-amplifier enable line on the ADV audio path. It must\n// never be driven with WS2812 timing. The RGB data pin remains disabled until\n// it is verified against the actual Cardputer ADV schematic and hardware.\n\n#define GROOVEPUTER_CARDPUTER_ADV_PA_EN_PIN 21\n#define GROOVEPUTER_CARDPUTER_ADV_RGB_LED_PIN (-1)\n\nnamespace GroovePuterHardware {\ninline constexpr int kPowerAmplifierEnablePin =\n    GROOVEPUTER_CARDPUTER_ADV_PA_EN_PIN;\n''',
              '''// Cardputer ADV audio is enabled through the ES8311 codec callback. Unlike\n// Chain Captain, the Cardputer ADV M5Unified path does not use GPIO21 as a\n// one-wire power-amplifier enable. Do not claim or drive GPIO21 here.\n// RGB data remains disabled until a verified Cardputer ADV pin is available.\n\n#define GROOVEPUTER_CARDPUTER_ADV_RGB_LED_PIN (-1)\n\nnamespace GroovePuterHardware {\n''')

          replace_once(
              'GroovePuter.ino',
              '''void setup() {\n  // Enable the Cardputer ADV power amplifier. This pin is not RGB data.\n  pinMode(GroovePuterHardware::kPowerAmplifierEnablePin, OUTPUT);\n  digitalWrite(GroovePuterHardware::kPowerAmplifierEnablePin, HIGH);\n  // pinMode(42, OUTPUT); digitalWrite(42, LOW); // Possible I2S conflict\n  \n#if ARDUINO_USB_CDC_ON_BOOT\n''',
              '''void setup() {\n#if ARDUINO_USB_CDC_ON_BOOT\n''')

          replace_once(
              'src/dsp/tape_fx.cpp',
              '''    // 2. WARMTH (Pink Noise + LPF)\n    if (ageAmount_ > 0) {\n        output += generatePinkNoise() * noiseAmount_;\n        output = warmthLPF_.process(output, warmthCutoffNorm_, 0.1f);\n    }\n''',
              '''    // 2. WARMTH (Pink Noise + LPF)\n    // AGE noise is signal-coupled: it colours audible material and tails, but\n    // does not create a permanent noise bed when the digital input is idle.\n    constexpr float kHalfPcmLsb = 0.5f / 32767.0f;\n    if (ageAmount_ > 0 && fabsf(output) >= kHalfPcmLsb) {\n        output += generatePinkNoise() * noiseAmount_;\n        output = warmthLPF_.process(output, warmthCutoffNorm_, 0.1f);\n    }\n''')

          replace_once(
              'src/dsp/miniacid_engine.cpp',
              '''    float finalSample = softLimit(limited * vol);\n    ditherState_ = ditherState_ * 1664525u + 1013904223u;\n    float r1 = (float)(ditherState_ & 65535) * (1.0f / 65536.0f);\n    ditherState_ = ditherState_ * 1664525u + 1013904223u;\n    float r2 = (float)(ditherState_ & 65535) * (1.0f / 65536.0f);\n    finalSample += (r1 - r2) * (1.0f / 32768.0f); \n''',
              '''    float finalSample = softLimit(limited * vol);\n    // Preserve true digital silence. Sub-half-LSB filter residue is not\n    // representable as useful 16-bit PCM and must not be promoted into an\n    // audible idle noise floor by dither. Real signal still receives TPDF.\n    constexpr float kHalfPcmLsb = 0.5f / 32767.0f;\n    if (fabsf(finalSample) >= kHalfPcmLsb) {\n      ditherState_ = ditherState_ * 1664525u + 1013904223u;\n      float r1 = (float)(ditherState_ & 65535) * (1.0f / 65536.0f);\n      ditherState_ = ditherState_ * 1664525u + 1013904223u;\n      float r2 = (float)(ditherState_ & 65535) * (1.0f / 65536.0f);\n      finalSample += (r1 - r2) * (1.0f / 32768.0f);\n    } else {\n      finalSample = 0.0f;\n    }\n''')

          replace_once(
              'src/audio/audio_out_i2s.h',
              '''  // Write mono audio buffer (will be duplicated to stereo L=R)\n  // Returns true on success\n  bool writeMono16(const int16_t* monoBuffer, size_t frames);\n  \n  // Stop and cleanup I2S driver\n''',
              '''  // Write mono audio buffer (will be duplicated to stereo L=R)\n  // Returns true on success\n  bool writeMono16(const int16_t* monoBuffer, size_t frames);\n\n  // Last write diagnostics. Read only after writeMono16() returned false.\n  int lastWriteError() const { return static_cast<int>(lastWriteError_); }\n  size_t lastWriteBytes() const { return lastWriteBytes_; }\n  size_t expectedWriteBytes() const { return expectedWriteBytes_; }\n  \n  // Stop and cleanup I2S driver\n''')
          replace_once(
              'src/audio/audio_out_i2s.h',
              '''  int16_t* stereoBuffer_;  // Internal stereo conversion buffer\n  i2s_chan_handle_t tx_handle_; // New driver handle\n};\n''',
              '''  int16_t* stereoBuffer_;  // Internal stereo conversion buffer\n  i2s_chan_handle_t tx_handle_; // New driver handle\n  esp_err_t lastWriteError_;\n  size_t lastWriteBytes_;\n  size_t expectedWriteBytes_;\n};\n''')

          replace_once(
              'src/audio/audio_out_i2s.cpp',
              '''  , stereoBuffer_(nullptr)\n  , tx_handle_(nullptr)\n{\n''',
              '''  , stereoBuffer_(nullptr)\n  , tx_handle_(nullptr)\n  , lastWriteError_(ESP_OK)\n  , lastWriteBytes_(0)\n  , expectedWriteBytes_(0)\n{\n''')
          replace_once(
              'src/audio/audio_out_i2s.cpp',
              '''  size_t bytesWritten = 0;\n  const size_t expectedBytes = frames * 2 * sizeof(int16_t);\n  const esp_err_t error = i2s_channel_write(\n      tx_handle_, stereoBuffer_, expectedBytes, &bytesWritten, kWriteTimeout);\n\n  return error == ESP_OK && bytesWritten == expectedBytes;\n''',
              '''  size_t bytesWritten = 0;\n  const size_t expectedBytes = frames * 2 * sizeof(int16_t);\n  const esp_err_t error = i2s_channel_write(\n      tx_handle_, stereoBuffer_, expectedBytes, &bytesWritten, kWriteTimeout);\n\n  lastWriteError_ = error;\n  lastWriteBytes_ = bytesWritten;\n  expectedWriteBytes_ = expectedBytes;\n  return error == ESP_OK && bytesWritten == expectedBytes;\n''')

          replace_once(
              'GroovePuter.ino',
              '''      if (millis() - lastErrorLog > 1000) {\n        Serial.println("[I2S] Write Timeout / Error");\n        lastErrorLog = millis();\n      }\n''',
              '''      if (millis() - lastErrorLog > 1000) {\n        Serial.printf("[I2S] Write Timeout / Error err=%d bytes=%u/%u underruns=%u\\n",\n                      g_audioOut.lastWriteError(),\n                      static_cast<unsigned>(g_audioOut.lastWriteBytes()),\n                      static_cast<unsigned>(g_audioOut.expectedWriteBytes()),\n                      g_miniAcid\n                          ? static_cast<unsigned>(g_miniAcid->perfStats.audioUnderruns.load(\n                                std::memory_order_relaxed))\n                          : 0U);\n        lastErrorLog = millis();\n      }\n''')

          Path('tests/test_idle_audio_aux_noise_source_regressions.py').write_text(r'''#!/usr/bin/env python3
from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]

def read(path: str) -> str:
    return (ROOT / path).read_text(encoding='utf-8')

hardware = read('src/platform/cardputer_adv_hardware.h')
sketch = read('GroovePuter.ino')
tape = read('src/dsp/tape_fx.cpp')
engine = read('src/dsp/miniacid_engine.cpp')
i2s_h = read('src/audio/audio_out_i2s.h')
i2s_cpp = read('src/audio/audio_out_i2s.cpp')

assert 'kPowerAmplifierEnablePin' not in hardware
assert 'GROOVEPUTER_CARDPUTER_ADV_PA_EN_PIN' not in hardware
assert 'kPowerAmplifierEnablePin' not in sketch
assert 'GPIO21' in hardware and 'does not use GPIO21' in hardware

assert 'AGE noise is signal-coupled' in tape
assert 'ageAmount_ > 0 && fabsf(output) >= kHalfPcmLsb' in tape
assert 'does not create a permanent noise bed' in tape

assert 'Preserve true digital silence' in engine
assert 'fabsf(finalSample) >= kHalfPcmLsb' in engine
assert 'finalSample = 0.0f;' in engine

assert 'lastWriteError() const' in i2s_h
assert 'lastWriteBytes() const' in i2s_h
assert 'expectedWriteBytes() const' in i2s_h
assert 'lastWriteError_ = error;' in i2s_cpp
assert '[I2S] Write Timeout / Error err=%d bytes=%u/%u underruns=%u' in sketch

print('idle AUX audio source regressions: OK')
''', encoding='utf-8')

          Path('tests/run_idle_audio_aux_noise_tests.sh').write_text(r'''#!/usr/bin/env bash
set -euo pipefail
cd "$(dirname "$0")/.."
python3 tests/test_idle_audio_aux_noise_source_regressions.py
''', encoding='utf-8')

          Path('docs/testing/IDLE_AUX_NOISE_ACCEPTANCE.md').write_text(r'''# Cardputer ADV idle AUX noise acceptance

## Purpose

Verify that the Cardputer ADV audio path reaches true digital silence after audible tails finish, Tape AGE does not create a permanent idle noise bed, and any remaining periodic AUX click can be correlated with an explicit I2S write diagnostic.

## Hardware list

- M5Stack Cardputer ADV;
- 3.5 mm TRS AUX cable;
- Yamaha SEQTRAK AUDIO IN or another known-good line/headphone input;
- USB-C data cable for flashing and Serial diagnostics;
- headphones are useful for the isolation check.

## Wiring

Connect the Cardputer ADV 3.5 mm audio output to the SEQTRAK AUDIO IN with the normal TRS AUX cable. No PORT.A/I2C wiring is used. For the ground-noise isolation step, disconnect USB-C after boot and run the Cardputer ADV from its battery while leaving AUX connected.

Cardputer ADV codec pins remain ES8311 I2C GPIO8/9 and I2S BCLK/WS/DOUT GPIO41/43/42. GPIO21 is intentionally not claimed as a Cardputer ADV amplifier-enable pin.

## Build / Flash steps

```bash
git fetch origin
git switch agent/20260807-05-idle-audio-aux-noise-fix
git reset --hard origin/agent/20260807-05-idle-audio-aux-noise-fix
bash tests/run_idle_audio_aux_noise_tests.sh
bash scripts/install_arduino_deps.sh
bash scripts/build.sh --warnings all
bash scripts/upload.sh /dev/ttyACM0
arduino-cli monitor -p /dev/ttyACM0 -c baudrate=115200
```

## Expected behavior

- normal playback is unchanged;
- Pause/Stop does not disable/reinitialize I2S or ES8311;
- synth live-note release tails remain audible and decay naturally;
- after tails settle, the digital output reaches exact PCM zero instead of being kept alive by sub-LSB dither residue;
- Tape AGE adds texture while audible material is present but does not generate a standalone noise bed over exact digital silence;
- no firmware code drives GPIO21 as Cardputer ADV PA enable;
- a failed/partial I2S write emits `err`, actual/expected byte counts and cumulative underruns.

## Troubleshooting

### Hiss remains after Pause

Set Tape OFF, wait one second after Pause, then compare USB-powered operation with battery-only operation. If the hiss remains unchanged on battery with exact-idle firmware, treat it as an analog AUX/input-gain noise-floor problem rather than DSP noise.

### Periodic click remains

Keep Serial open. If every audible click coincides with:

```text
[I2S] Write Timeout / Error err=... bytes=.../... underruns=...
```

the next fix belongs to realtime scheduling/DMA starvation. If there is no matching I2S diagnostic, isolate the analog path by testing Cardputer headphones/output directly and by running both devices without a shared USB ground where possible.

### Audio is cut too early

Test a live Synth A/B note while transport is stopped. The change must not mute the codec and must not bypass synth release processing; only sub-half-LSB final PCM is forced to zero.

## Acceptance checklist

- [ ] focused idle-audio regression passes;
- [ ] Cardputer ADV normal build passes;
- [ ] fixed DRAM budget passes;
- [ ] SEQTRAK MIDI-only build passes;
- [ ] SDL build passes;
- [ ] normal Song/Pattern playback sounds unchanged;
- [ ] Tape OFF + Pause becomes silent after release tails;
- [ ] Tape ON + Pause does not leave a permanent AGE hiss bed after tails;
- [ ] live keyboard works while transport is stopped;
- [ ] no new pop occurs on Pause/Play;
- [ ] GPIO21 is not driven by GroovePuter audio setup;
- [ ] any remaining click is either correlated with the enriched I2S diagnostic or reproducibly classified as analog/ground-path noise.
''', encoding='utf-8')
          PY

          chmod +x tests/run_idle_audio_aux_noise_tests.sh
          bash tests/run_idle_audio_aux_noise_tests.sh

      - name: Remove temporary workflow and publish patch
        shell: bash
        run: |
          rm -f .github/workflows/agent-idle-audio-aux-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GroovePuter.ino src/platform/cardputer_adv_hardware.h src/dsp/tape_fx.cpp src/dsp/miniacid_engine.cpp src/audio/audio_out_i2s.h src/audio/audio_out_i2s.cpp tests/test_idle_audio_aux_noise_source_regressions.py tests/run_idle_audio_aux_noise_tests.sh docs/testing/IDLE_AUX_NOISE_ACCEPTANCE.md .github/workflows/agent-idle-audio-aux-fix.yml
          git commit -m "fix: silence Cardputer ADV idle audio path"
          git push origin HEAD:agent/20260807-05-idle-audio-aux-noise-fix
