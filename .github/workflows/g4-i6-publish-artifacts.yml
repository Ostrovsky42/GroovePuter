name: G4-I6 temporary evidence publisher

on:
  push:
    branches:
      - research/20260909-02-0.9.11-g4-i6-global-ownership-census
    paths:
      - '.github/workflows/g4-i6-publish-artifacts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install host dependencies
        run: |
          grep -rl 'dl.google.com' /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Generate exact-SHA evidence
        run: |
          mkdir -p build
          set -o pipefail
          set +e
          bash tests/run_gf2_g4_i6_tests.sh 2>&1 | tee build/g4-i6-publish.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 1
          grep -F 'G4-I6 corrected methodology controls: PASS' build/g4-i6-publish.log
          grep -F 'G4-I6 full derived corpus deterministic repeat: PASS' build/g4-i6-publish.log
          grep -F 'G4-I6 committed evidence freshness: RED' build/g4-i6-publish.log
          ! grep -Fq 'G4_I6_FINALIZER_FAIL' build/g4-i6-publish.log

      - name: Publish only generated I6 evidence
        run: |
          install -d docs/research
          cp build/host-tests/gf2-g4-i6/run-a/GF2_G4_I6_OWNERSHIP_CENSUS.tsv \
             docs/research/GF2_G4_I6_OWNERSHIP_CENSUS.tsv
          cp build/host-tests/gf2-g4-i6/run-a/GF2_G4_I6_OWNERSHIP_ANOMALIES.tsv \
             docs/research/GF2_G4_I6_OWNERSHIP_ANOMALIES.tsv
          cp build/host-tests/gf2-g4-i6/run-a/GF2_G4_I6_OWNERSHIP_CENSUS.md \
             docs/research/GF2_G4_I6_OWNERSHIP_CENSUS.md
          git diff --exit-code -- src
          mapfile -t changed < <(git status --short | awk '{print $2}' | sort)
          expected=(
            docs/research/GF2_G4_I6_OWNERSHIP_ANOMALIES.tsv
            docs/research/GF2_G4_I6_OWNERSHIP_CENSUS.md
            docs/research/GF2_G4_I6_OWNERSHIP_CENSUS.tsv
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${expected[@]}"
          git diff --cached --quiet && exit 1
          git commit -m 'docs(g4-i6): commit deterministic census evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
