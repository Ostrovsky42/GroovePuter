name: One-shot remove Generation help

on:
  push:
    branches:
      - agent/remove-genre-manager

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[generation-help-done]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-genre-manager
      - name: Remove standalone Generation help
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/ui/global_help_content.h')
          text = p.read_text(encoding='utf-8')
          start = text.index('constexpr const char* kGenerationLines[] = {')
          end = text.index('constexpr const char* kPerformLines[] = {', start)
          text = text[:start] + text[end:]
          old = '''        case WorkflowPages::kTexture:\n        case WorkflowPages::kFeel:\n            count = sizeof(kFeelLines) / sizeof(kFeelLines[0]); return kFeelLines;'''
          new = '''        case WorkflowPages::kTexture:\n        case WorkflowPages::kGeneration:\n        case WorkflowPages::kFeel:\n            count = sizeof(kFeelLines) / sizeof(kFeelLines[0]); return kFeelLines;'''
          text = text.replace(old, new)
          text = text.replace('''        case WorkflowPages::kGeneration:\n            count = sizeof(kGenerationLines) / sizeof(kGenerationLines[0]); return kGenerationLines;\n''', '')
          p.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/tmp-remove-generation-help.yml
          git add -A
          git commit -m 'ui: redirect legacy Generation help to Feel [generation-help-done]'
          git push origin HEAD:agent/remove-genre-manager
