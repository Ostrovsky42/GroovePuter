name: Temporary Groove Vocabulary source fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/20260808-03-groove-vocabulary-stage1
          fetch-depth: 0

      - name: Patch Coincide capacity feasibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/generation/rhythm/rhythm_catalog.cpp')
          text = path.read_text(encoding='utf-8')
          old = '''        const LaneGrammar* src = laneFor(a, r.source);
        const LaneGrammar* dst = laneFor(a, r.target);
        const StepMask possible = static_cast<StepMask>(
            candidates(a, *src) & candidates(a, *dst) & r.zoneMask);
        const StepMask mandatory = static_cast<StepMask>(
            (src->immutableAnchors | src->canonicalAnchors) &
            (dst->immutableAnchors | dst->canonicalAnchors) &
            r.zoneMask);

        for (uint8_t bars = 1; bars <= kMaxPhraseBars; ++bars) {
          if (!(a.allowedPhraseBars & phraseBarsBit(bars))) continue;
          const uint16_t possibleMatches =
              static_cast<uint16_t>(bits16(possible)) * bars;
          const uint16_t mandatoryMatches =
              static_cast<uint16_t>(bits16(mandatory)) * bars;
          const uint16_t sourceCapacity =
              static_cast<uint16_t>(src->structuralMax) * bars;
          const uint16_t targetCapacity =
              static_cast<uint16_t>(dst->structuralMax) * bars;

          if (possibleMatches < r.minMatches ||
              r.minMatches > sourceCapacity ||
              r.minMatches > targetCapacity ||
              (r.maxMatches && mandatoryMatches > r.maxMatches)) {
            return fail(CatalogValidationError::ImpossibleHardRelationship,
                        archetypeIndex,
                        relationshipIndex);
          }
        }
'''
          new = '''        const LaneGrammar* src = laneFor(a, r.source);
        const LaneGrammar* dst = laneFor(a, r.target);
        const StepMask srcAnchors = static_cast<StepMask>(
            src->immutableAnchors | src->canonicalAnchors);
        const StepMask dstAnchors = static_cast<StepMask>(
            dst->immutableAnchors | dst->canonicalAnchors);
        const StepMask possible = static_cast<StepMask>(
            candidates(a, *src) & candidates(a, *dst) & r.zoneMask);
        const StepMask mandatory = static_cast<StepMask>(
            srcAnchors & dstAnchors & r.zoneMask);
        const StepMask sourceAnchoredOnly = static_cast<StepMask>(
            possible & srcAnchors & ~dstAnchors);
        const StepMask targetAnchoredOnly = static_cast<StepMask>(
            possible & dstAnchors & ~srcAnchors);
        const StepMask unanchoredShared = static_cast<StepMask>(
            possible & ~srcAnchors & ~dstAnchors);

        for (uint8_t bars = 1; bars <= kMaxPhraseBars; ++bars) {
          if (!(a.allowedPhraseBars & phraseBarsBit(bars))) continue;

          const uint16_t sourceCapacity =
              static_cast<uint16_t>(src->structuralMax) * bars;
          const uint16_t targetCapacity =
              static_cast<uint16_t>(dst->structuralMax) * bars;
          const uint16_t sourceAnchorCount =
              static_cast<uint16_t>(bits16(srcAnchors)) * bars;
          const uint16_t targetAnchorCount =
              static_cast<uint16_t>(bits16(dstAnchors)) * bars;
          uint16_t sourceFree = sourceCapacity - sourceAnchorCount;
          uint16_t targetFree = targetCapacity - targetAnchorCount;

          uint16_t maxMatches =
              static_cast<uint16_t>(bits16(mandatory)) * bars;
          const uint16_t sourceAnchoredOnlyCount =
              static_cast<uint16_t>(bits16(sourceAnchoredOnly)) * bars;
          const uint16_t targetAnchoredOnlyCount =
              static_cast<uint16_t>(bits16(targetAnchoredOnly)) * bars;
          const uint16_t unanchoredSharedCount =
              static_cast<uint16_t>(bits16(unanchoredShared)) * bars;

          const uint16_t fromSourceAnchors =
              sourceAnchoredOnlyCount < targetFree
                  ? sourceAnchoredOnlyCount
                  : targetFree;
          maxMatches += fromSourceAnchors;
          targetFree -= fromSourceAnchors;

          const uint16_t fromTargetAnchors =
              targetAnchoredOnlyCount < sourceFree
                  ? targetAnchoredOnlyCount
                  : sourceFree;
          maxMatches += fromTargetAnchors;
          sourceFree -= fromTargetAnchors;

          uint16_t fromUnanchored = sourceFree < targetFree
                                         ? sourceFree
                                         : targetFree;
          if (fromUnanchored > unanchoredSharedCount) {
            fromUnanchored = unanchoredSharedCount;
          }
          maxMatches += fromUnanchored;

          const uint16_t mandatoryMatches =
              static_cast<uint16_t>(bits16(mandatory)) * bars;
          if (maxMatches < r.minMatches ||
              (r.maxMatches && mandatoryMatches > r.maxMatches)) {
            return fail(CatalogValidationError::ImpossibleHardRelationship,
                        archetypeIndex,
                        relationshipIndex);
          }
        }
'''
          if old not in text:
              if new in text:
                  print('Coincide capacity fix already present')
                  raise SystemExit(0)
              raise SystemExit('expected Coincide validation block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run Stage 1 tests
        run: bash tests/run_rhythm_stage1_tests.sh

      - name: Commit source fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generation/rhythm/rhythm_catalog.cpp
          git commit -m "fix: account for Coincide lane capacity"
          git push origin HEAD:agent/20260808-03-groove-vocabulary-stage1
