name: 0.9.9 PMB-A2 legacy replay/preflight audit

on:
  push:
    branches:
      - research/20260831-01-0.9.9-pmb-a2-legacy-replay-preflight
  pull_request:
    branches:
      - research/20260830-01-0.9.9-phrase-memory-budget-audit

jobs:
  legacy-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install SDL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libsdl2-dev \
            libsdl2-gfx-dev
      - name: Run PMB-A2 legacy replay/preflight audit gate
        run: bash tests/run_0_9_9_phrase_pmb_a2_legacy_audit_tests.sh
