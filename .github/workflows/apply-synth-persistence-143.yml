name: Apply synth persistence 143

on:
  push:
    branches:
      - agent/synth-persistence-load-ownership

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[synth-persistence-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/synth-persistence-load-ownership
          fetch-depth: 0
      - name: Apply deterministic migration
        run: |
          sed -i 's/)ndoc =/)\nndoc =/' tools/apply_synth_persistence_143.py
          python3 tools/apply_synth_persistence_143.py
          python3 tests/test_synth_persistence_source_regressions.py
      - name: Commit implementation
        run: |
          rm tools/apply_synth_persistence_143.py
          rm .github/workflows/apply-synth-persistence-143.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: persist normalized synth patches [synth-persistence-applied]"
          git push origin HEAD:agent/synth-persistence-load-ownership
