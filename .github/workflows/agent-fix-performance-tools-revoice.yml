name: Apply PERFORMANCE tools revoice fix

on:
  push:
    branches:
      - agent/smf-structural-inspector

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ hashFiles('tools/agent_fix_performance_tools_revoice.py') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused performance revoice fix
        run: python3 tools/agent_fix_performance_tools_revoice.py

      - name: Run full host regressions
        run: bash tests/run_host_tests.sh

      - name: Publish tested fix
        run: |
          git config user.name "openai-coding-agent"
          git config user.email "openai-coding-agent@users.noreply.github.com"
          git rm .github/workflows/agent-fix-performance-tools-revoice.yml
          git rm tools/agent_fix_performance_tools_revoice.py
          git add src/input/performance_keyboard.cpp \
                  src/input/performance_keyboard.h \
                  tests/test_performance_patterns.cpp \
                  docs/stages/WAVEMORPH_PERFORMANCE_LOGIC_STAGE.md
          git commit -m "fix: revoice held notes after performance tool changes"
          git push origin HEAD:agent/smf-structural-inspector
