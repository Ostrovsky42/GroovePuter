name: Generation Stage 15B

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage15b-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Stage 15B melodic intent matrix
        env:
          ASAN_OPTIONS: "detect_leaks=0"
        run: bash tests/run_generation_stage15b_tests.sh
