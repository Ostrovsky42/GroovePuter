name: Groove Vocabulary Stage 1 temporary gate docs fix

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/20260808-03-groove-vocabulary-stage1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply docs patch
        run: |
          python3 .github/stage1_gate_docs_patch.py
          git diff --check
      - name: Commit docs patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture/GROOVE_VOCABULARY_MUSICAL_CONTRACTS.md \
            docs/architecture/GROOVE_VOCABULARY_ARCHITECTURE_BRIEF.md
          git commit -m 'docs: specify Stage 1 rhythmic gate overlays'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
