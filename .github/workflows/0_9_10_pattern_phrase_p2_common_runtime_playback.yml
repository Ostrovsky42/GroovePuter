name: 0.9.10 Pattern Phrase P2 Common Runtime Playback

on:
  push:
    branches:
      - feature/20260904-01-0.9.10-pattern-phrase-p2-common-runtime-playback
  pull_request:
    paths:
      - 'src/phrase/runtime_synth_events.h'
      - 'src/phrase/runtime_synth_events.cpp'
      - 'src/phrase/runtime_synth_playback.h'
      - 'src/phrase/runtime_synth_playback.cpp'
      - 'src/dsp/miniacid_engine.h'
      - 'src/dsp/miniacid_engine.cpp'
      - 'src/generation/**'
      - 'src/ui/**'
      - 'tests/test_pattern_phrase_p2_*'
      - 'tests/run_pattern_phrase_p2_tests.sh'
      - 'docs/contracts/0_9_10_PATTERN_PHRASE_P2_COMMON_RUNTIME_PLAYBACK.md'
      - 'docs/superpowers/plans/2026-09-04-pattern-phrase-p2-common-runtime-playback.md'
      - '.github/workflows/0_9_10_pattern_phrase_p2_common_runtime_playback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2-common-runtime-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang

      - name: Run P2 focused gate
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: bash tests/run_pattern_phrase_p2_tests.sh
