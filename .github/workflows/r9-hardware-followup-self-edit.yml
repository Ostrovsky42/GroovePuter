name: R9 hardware follow-up self edit

on:
  push:
    branches:
      - agent/20260817-0.9.8-r8-global-ctrl-z
    paths:
      - tools/r9_hardware_followup_patch.py
      - .github/workflows/r9-hardware-followup-self-edit.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/20260817-0.9.8-r8-global-ctrl-z

      - name: Apply focused hardware follow-up
        run: python3 tools/r9_hardware_followup_patch.py

      - name: Run cumulative 0.9.8 R9 Undo tests
        run: bash tests/run_undo_0_9_8_r9_tests.sh

      - name: Commit tested production patch
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/r9_hardware_followup_patch.py .github/workflows/r9-hardware-followup-self-edit.yml
          git add src/ui/pages/drum_sequencer_page_legacy.h \
                  src/ui/pages/pattern_edit_page.cpp \
                  tests/test_undo_0_9_8_r9_hardware_followup_source.py \
                  tests/run_undo_0_9_8_r9_tests.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "fix: restore drum cell and synth generation undo"
          git push origin HEAD:agent/20260817-0.9.8-r8-global-ctrl-z
