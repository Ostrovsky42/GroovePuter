name: 0.9.12 FS2A Raw Stage Green Builder

on:
  push:
    branches:
      - feature/20260914-fs2a-current-next-causality
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout triggering branch SHA
        uses: actions/checkout@v4
        with:
          ref: feature/20260914-fs2a-current-next-causality
          fetch-depth: 0

      - name: Prove exact trigger SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Apply minimal causal unbind fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/dsp/miniacid_engine.cpp')
          text = path.read_text()
          old = '''  pending.slot = slot;\n  pending.kind = kind;\n  pending.queued = true;\n  return true;\n}\n\nbool MiniAcid::activatePendingMaterialForVoice_'''
          new = '''  // The lower M4 primitive has no proof that its payload was prepared\n  // against the upper FS2A CURRENT identity/version. A successful raw stage\n  // therefore becomes explicitly unbound; prepareNextMelody() re-binds only\n  // after staging succeeds and it has captured the exact canonical basis.\n  pending.lifecycleBound = false;\n  pending.preparedFor = {};\n  pending.acceptedVersion = {};\n  pending.slot = slot;\n  pending.kind = kind;\n  pending.queued = true;\n  return true;\n}\n\nbool MiniAcid::activatePendingMaterialForVoice_'''
          if text.count(old) != 1:
              raise SystemExit(f'exact raw-stage patch anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "src/dsp/miniacid_engine.cpp"

      - name: Install host dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libsdl2-dev \
            libsdl2-gfx-dev

      - name: Raw-stage regression GREEN
        run: bash tests/run_fs2a_raw_stage_unbind_tests.sh

      - name: FS2A semantic regression
        run: bash tests/run_fs2a_current_next_causality_tests.sh

      - name: M4 primitive regression
        run: bash tests/run_m4_next_material_tests.sh

      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/dsp/miniacid_engine.cpp
          git commit -m 'fix: unbind raw M4 staging from FS2A causal stamp'
          git push origin HEAD:feature/20260914-fs2a-current-next-causality
