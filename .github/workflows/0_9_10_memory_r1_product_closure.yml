name: 0.9.10 MEMORY-R1 product closure

on:
  push:
    branches:
      - integration/20260908-0.9.10-memory-r1-product-closure
  pull_request:
    branches:
      - dev_0.9.10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove MEMORY-R1 product closure contract
        run: python3 tests/test_memory_r1_product_closure.py

  m4-fs1b-wt1-elf-ab:
    needs: closure-contract
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact M4 pre-closure baseline
        uses: actions/checkout@v4
        with:
          ref: 2e7e7d0e78f75fc6be1d7d67e1794bc75b0518ca
          path: before
          fetch-depth: 1

      - name: Checkout closure candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: after
          fetch-depth: 1

      - uses: arduino/setup-arduino-cli@v2

      - name: Install pinned Cardputer dependencies
        run: bash after/scripts/install_arduino_deps.sh

      - name: Fetch exact ESP-IDF source object
        run: |
          set -euo pipefail
          git init "$HOME/esp-idf"
          git -C "$HOME/esp-idf" remote add origin https://github.com/espressif/esp-idf.git
          git -C "$HOME/esp-idf" fetch --depth=1 origin 858a988d6eb90f54661abe282c523879c6ad0116

      - name: Use the same final FS1B builder on both source trees
        run: |
          set -euo pipefail
          cp after/scripts/build_fatfs_dynbuffers_candidate.sh before/scripts/build_fatfs_dynbuffers_candidate.sh
          cp after/scripts/build_cardputer_dynbuffers.sh before/scripts/build_cardputer_dynbuffers.sh

      - name: Build M4 before closure with final FS1B
        run: |
          set -euo pipefail
          cd before
          BUILD_PATH="$GITHUB_WORKSPACE/build-before" \
          ARDUINO_BUILD_PATH="$GITHUB_WORKSPACE/build-before/.arduino-build" \
            bash scripts/build_cardputer_dynbuffers.sh --warnings all

      - name: Build M4 closure candidate with final FS1B
        run: |
          set -euo pipefail
          cd after
          BUILD_PATH="$GITHUB_WORKSPACE/build-after" \
          ARDUINO_BUILD_PATH="$GITHUB_WORKSPACE/build-after/.arduino-build" \
            bash scripts/build_cardputer_dynbuffers.sh --warnings all

      - name: Measure exact M4 WT1 static DRAM delta
        run: |
          set -euo pipefail
          SIZE_TOOL="$(find "$HOME/.arduino15/packages" -type f -name xtensa-esp32s3-elf-size -perm -u+x -print | sort -V | tail -n 1)"
          NM_TOOL="$(find "$HOME/.arduino15/packages" -type f -name xtensa-esp32s3-elf-nm -perm -u+x -print | sort -V | tail -n 1)"
          test -x "$SIZE_TOOL"
          test -x "$NM_TOOL"

          BEFORE_ELF="$GITHUB_WORKSPACE/build-before/GroovePuter.ino.elf"
          AFTER_ELF="$GITHUB_WORKSPACE/build-after/GroovePuter.ino.elf"

          read_sections() {
            "$SIZE_TOOL" -A "$1" | awk '
              $1 == ".dram0.data" { data = $2 }
              $1 == ".dram0.bss" { bss = $2 }
              END { print data + 0, bss + 0 }
            '
          }

          read -r BEFORE_DATA BEFORE_BSS < <(read_sections "$BEFORE_ELF")
          read -r AFTER_DATA AFTER_BSS < <(read_sections "$AFTER_ELF")
          BEFORE_FIXED=$((BEFORE_DATA + BEFORE_BSS))
          AFTER_FIXED=$((AFTER_DATA + AFTER_BSS))
          DELTA=$((BEFORE_FIXED - AFTER_FIXED))

          if (( DELTA != 4096 )); then
            echo "WT1 integration expected exactly 4096 B, measured ${DELTA} B" >&2
            exit 1
          fi
          "$NM_TOOL" -C "$BEFORE_ELF" | grep -Fq 'Wavetable::triangleTable_'
          if "$NM_TOOL" -C "$AFTER_ELF" | grep -Fq 'Wavetable::triangleTable_'; then
            echo "WT1 triangle symbol survived candidate ELF" >&2
            exit 1
          fi

          {
            echo "MEMORY-R1 M4 CLOSURE ELF A/B"
            echo "before_source=2e7e7d0e78f75fc6be1d7d67e1794bc75b0518ca"
            echo "after_source=${GITHUB_SHA}"
            echo "before_data=${BEFORE_DATA}"
            echo "before_bss=${BEFORE_BSS}"
            echo "before_fixed=${BEFORE_FIXED}"
            echo "after_data=${AFTER_DATA}"
            echo "after_bss=${AFTER_BSS}"
            echo "after_fixed=${AFTER_FIXED}"
            echo "recovered_fixed_dram=${DELTA}"
            echo "before_elf_sha256=$(sha256sum "$BEFORE_ELF" | awk '{print $1}')"
            echo "after_elf_sha256=$(sha256sum "$AFTER_ELF" | awk '{print $1}')"
          } | tee "$GITHUB_WORKSPACE/memory-r1-closure-elf-delta.txt"

      - name: Upload closure evidence and product image
        uses: actions/upload-artifact@v4
        with:
          name: cardputer-memory-r1-product-closure
          if-no-files-found: error
          path: |
            memory-r1-closure-elf-delta.txt
            build-before/GroovePuter.ino.elf
            build-after/GroovePuter.ino.elf
            build-after/GroovePuter.ino.bin
            build-after/GroovePuter.ino.bootloader.bin
            build-after/GroovePuter.ino.partitions.bin
