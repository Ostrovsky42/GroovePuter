name: 0.9.9 PHRASE-H2 phrase-wide harmonic clock policy

on:
  push:
    branches:
      - agent/20260826-14-0.9.9-phrase-h2-harmonic-clock-projection
  pull_request:
    branches:
      - agent/20260826-13-0.9.9-phrase-w1-harmonic-when-owner-recovery

jobs:
  focused-harmonic-clock-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run PHRASE-H2 focused policy gate
        run: bash tests/run_0_9_9_phrase_h2_tests.sh

  core-host-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run core host regression
        run: bash tests/run_host_tests.sh
