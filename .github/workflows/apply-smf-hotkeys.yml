name: Apply scoped SMF mute hotkeys

on:
  push:
    branches:
      - agent/smf-track-mute-mixer

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/smf-track-mute-mixer
          fetch-depth: 0

      - name: Patch MIDI Player hotkeys
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page_path = Path('src/ui/pages/smf_player_page.cpp')
          test_path = Path('tests/test_smf_panel_completion_source_regressions.py')
          workflow_path = Path('.github/workflows/apply-smf-hotkeys.yml')

          page = page_path.read_text(encoding='utf-8')
          test = test_path.read_text(encoding='utf-8')

          helper_anchor = '''    return GroovePuterMidi::smfTrackMuteState().selectTrack(audible[position]);
          }

          unsigned mutedAudibleTrackCount(
          '''
          helper_replacement = '''    return GroovePuterMidi::smfTrackMuteState().selectTrack(audible[position]);
          }

          bool toggleAudibleTrackHotkey(
                  const GroovePuterMidi::SmfTrackInspectorSnapshot& inspector,
                  int hotkeyIndex,
                  uint16_t* toggledTrack,
                  bool* mutedAfterToggle) {
              uint16_t audible[GroovePuterMidi::kSmfTrackInspectorMaxTracks]{};
              const int count = collectAudibleTracks(
                  inspector,
                  audible,
                  static_cast<int>(GroovePuterMidi::kSmfTrackInspectorMaxTracks));
              if (hotkeyIndex < 0 || hotkeyIndex >= count) return false;

              GroovePuterMidi::SmfTrackMuteState& muteState =
                  GroovePuterMidi::smfTrackMuteState();
              const uint16_t trackIndex = audible[hotkeyIndex];
              if (!muteState.selectTrack(trackIndex) || !muteState.toggleSelected()) {
                  return false;
              }

              const GroovePuterMidi::SmfTrackMuteSnapshot snapshot =
                  muteState.snapshot();
              if (toggledTrack) *toggledTrack = trackIndex;
              if (mutedAfterToggle) {
                  *mutedAfterToggle = trackMuted(snapshot, trackIndex);
              }
              return true;
          }

          unsigned mutedAudibleTrackCount(
          '''
          if helper_anchor not in page:
              raise SystemExit('helper insertion anchor not found')
          page = page.replace(helper_anchor, helper_replacement, 1)

          event_anchor = '''    if (!player_) return false;
              const SmfPlayerSnapshot state = player_->snapshot();

              if (event.key == 'u' || event.key == 'U') {
          '''
          event_replacement = '''    if (!player_) return false;
              const SmfPlayerSnapshot state = player_->snapshot();

              if (event.key >= '1' && event.key <= '3') {
                  const unsigned hotkeySlot =
                      static_cast<unsigned>(event.key - '1');
                  uint16_t trackIndex = 0;
                  bool muted = false;
                  if (toggleAudibleTrackHotkey(
                          smfTrackInspectorState().snapshot(),
                          static_cast<int>(hotkeySlot),
                          &trackIndex,
                          &muted)) {
                      char toast[32];
                      std::snprintf(toast, sizeof(toast),
                                    "MIDI %u TRK %02u %s",
                                    hotkeySlot + 1u,
                                    static_cast<unsigned>(trackIndex + 1u),
                                    muted ? "MUTED" : "ON");
                      UI::showToast(toast, 700);
                  } else {
                      char toast[24];
                      std::snprintf(toast, sizeof(toast),
                                    "MIDI SLOT %u EMPTY",
                                    hotkeySlot + 1u);
                      UI::showToast(toast, 800);
                  }
                  return true;
              }

              if (event.key == 'u' || event.key == 'U') {
          '''
          if event_anchor not in page:
              raise SystemExit('event insertion anchor not found')
          page = page.replace(event_anchor, event_replacement, 1)

          row_anchor = '''        const bool selectedRow = visibleIndex == selectedPosition;
                  const bool muted = trackMuted(mute, trackIndex);
                  const int y = LayoutManager::lineY(row + 1);
          '''
          row_replacement = '''        const bool selectedRow = visibleIndex == selectedPosition;
                  const bool muted = trackMuted(mute, trackIndex);
                  const char hotkey = visibleIndex < 3
                      ? static_cast<char>('1' + visibleIndex)
                      : ' ';
                  const int y = LayoutManager::lineY(row + 1);
          '''
          if row_anchor not in page:
              raise SystemExit('row hotkey anchor not found')
          page = page.replace(row_anchor, row_replacement, 1)

          format_anchor = '''        std::snprintf(line, sizeof(line), "%c%02u %-3s %-15.15s %-3s %-4s",
                                selectedRow ? '>' : ' ',
                                static_cast<unsigned>(trackIndex + 1u),
          '''
          format_replacement = '''        std::snprintf(line, sizeof(line), "%c%c%02u %-3s %-15.15s %-3s %-4s",
                                hotkey,
                                selectedRow ? '>' : ' ',
                                static_cast<unsigned>(trackIndex + 1u),
          '''
          if format_anchor not in page:
              raise SystemExit('row format anchor not found')
          page = page.replace(format_anchor, format_replacement, 1)

          status_anchor = '''    std::snprintf(line, sizeof(line), "ROW %u/%u TRK %02u  A ALL ON",
                            static_cast<unsigned>(selectedPosition + 1),
                            static_cast<unsigned>(audibleCount),
                            static_cast<unsigned>(audible[selectedPosition] + 1u));
          '''
          status_replacement = '''    std::snprintf(line, sizeof(line), "HOT 1-3 ROW %u/%u TRK %02u",
                            static_cast<unsigned>(selectedPosition + 1),
                            static_cast<unsigned>(audibleCount),
                            static_cast<unsigned>(audible[selectedPosition] + 1u));
          '''
          if status_anchor not in page:
              raise SystemExit('mixer status anchor not found')
          page = page.replace(status_anchor, status_replacement, 1)

          footer_anchor = '''        UI::drawStandardFooter(gfx, "UP/DN Select L/R Page",
                                         "ENT/K Toggle A AllOn U Back");
          '''
          footer_replacement = '''        UI::drawStandardFooter(gfx, "UP/DN Select L/R Page",
                                         "1-3 Hot ENT/K Sel A AllOn");
          '''
          if footer_anchor not in page:
              raise SystemExit('mixer footer anchor not found')
          page = page.replace(footer_anchor, footer_replacement, 1)

          player_footer_anchor = '''                               "U Mutes I Channels K Quick");
          '''
          player_footer_replacement = '''                               "1-3 SMF Mute U Table I Info");
          '''
          if player_footer_anchor not in page:
              raise SystemExit('player footer anchor not found')
          page = page.replace(player_footer_anchor, player_footer_replacement, 1)

          load_anchor = '''    stream_cpp = (ROOT / "src/midi/smf_stream.cpp").read_text(encoding="utf-8")
          '''
          load_replacement = '''    stream_cpp = (ROOT / "src/midi/smf_stream.cpp").read_text(encoding="utf-8")
              display_cpp = (ROOT / "src/ui/miniacid_display.cpp").read_text(encoding="utf-8")
          '''
          if load_anchor not in test:
              raise SystemExit('test load anchor not found')
          test = test.replace(load_anchor, load_replacement, 1)

          test_anchor = '''    require("Shift+K" not in page_cpp and "J/L Track" not in page_cpp,
                      "mute mixer help must not advertise unavailable Shift or J/L navigation")
          '''
          test_replacement = '''    require("Shift+K" not in page_cpp and "J/L Track" not in page_cpp,
                      "mute mixer help must not advertise unavailable Shift or J/L navigation")
              require("toggleAudibleTrackHotkey" in page_cpp and
                      "event.key >= '1' && event.key <= '3'" in page_cpp and
                      '"MIDI SLOT %u EMPTY"' in page_cpp and
                      '"HOT 1-3 ROW"' in page_cpp,
                      "1/2/3 must directly mute the first three audible SMF tracks")
              require("const char hotkey = visibleIndex < 3" in page_cpp and
                      '"%c%c%02u %-3s %-15.15s %-3s %-4s"' in page_cpp,
                      "mute table must label the three direct hotkey slots")
              page_dispatch = display_cpp.index("currentPage->handleEvent(event)")
              global_numeric_mutes = display_cpp.index(
                  "event.key >= '1' && event.key <= '9'")
              require(page_dispatch < global_numeric_mutes and
                      "toggleMute303(0)" in display_cpp and
                      "toggleMute303(1)" in display_cpp and
                      "toggleMuteKick()" in display_cpp,
                      "SMF page must consume 1/2/3 before unchanged imported-project mutes")
          '''
          if test_anchor not in test:
              raise SystemExit('test assertion anchor not found')
          test = test.replace(test_anchor, test_replacement, 1)

          page_path.write_text(page, encoding='utf-8')
          test_path.write_text(test, encoding='utf-8')
          workflow_path.unlink()
          PY

          python3 tests/test_smf_panel_completion_source_regressions.py

      - name: Commit scoped hotkeys
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/pages/smf_player_page.cpp \
                  tests/test_smf_panel_completion_source_regressions.py \
                  .github/workflows/apply-smf-hotkeys.yml
          git commit -m "feat: add scoped SMF mute hotkeys"
          git push origin HEAD:agent/smf-track-mute-mixer
