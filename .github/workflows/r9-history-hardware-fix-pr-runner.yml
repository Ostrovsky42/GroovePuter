name: R9 history hardware fix PR runner

on:
  pull_request:
    branches:
      - dev_0.9.8

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/20260817-0.9.8-r8-global-ctrl-z' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/20260817-0.9.8-r8-global-ctrl-z
          fetch-depth: 0

      - name: Apply accepted B1 source delta
        run: |
          git fetch origin dev_0.9.9
          git diff d6db59c1fe3ddee0e9d611807508d6e44010e729^ d6db59c1fe3ddee0e9d611807508d6e44010e729 -- \
            src/generation/migration/quantized_generation_commit.h \
            src/generation/migration/quantized_generation_undo_owner_impl.h \
            src/ui/pages/genre_page.cpp | git apply --3way

      - name: Extract and execute R9 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/r9-history-hardware-fix-bootstrap.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          block = workflow[start:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          source = '\n'.join(lines) + '\n'
          source = source.replace(
              "public_marker = 'inline bool undoLastQuantizedGeneration(MiniAcid& engine) {'",
              "public_marker = 'inline GroovePuterUndo::UndoResult undoLastQuantizedGeneration(MiniAcid& engine) {'")

          # R8 already has the authoritative wrong-page/empty fallback after
          # page dispatch. Do not duplicate it; keep only the R9 source check.
          fallback_start = source.index('# If a page does not own the retained kind')
          focused_start = source.index('# Focused source contract.', fallback_start)
          source = (source[:fallback_start] +
                    '# Existing R8 global Undo fallback retained unchanged.\n' +
                    source[focused_start:])

          script = Path('/tmp/r9_patch.py')
          script.write_text(source)
          subprocess.run(['python3', str(script)], check=True)
          PY

      - name: Commit source successor
        run: |
          # The repository App token cannot create/update workflow files from
          # Actions. Keep bootstrap/runner unchanged here; connector cleanup
          # happens after this source commit lands.
          rm -f .github/workflows/undo-safe-editing-0-9-8-r9.yml
          rm -f .r9-bootstrap-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests
          git add -u .r9-bootstrap-trigger
          git commit -m "0.9.8-R9: complete one-step global history"
          git push origin HEAD:agent/20260817-0.9.8-r8-global-ctrl-z
