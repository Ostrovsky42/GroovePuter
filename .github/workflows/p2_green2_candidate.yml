name: P2 GREEN2 candidate artifact

on:
  push:
    branches:
      - feature/20260904-01-0.9.10-pattern-phrase-p2-common-runtime-playback
    paths:
      - 'tests/apply_p2_green2_patch.py'
      - 'tests/test_pattern_phrase_p2_single_lifetime_owner_contract.py'
      - '.github/workflows/p2_green2_candidate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply frozen GREEN #2 patch
        run: |
          set -euo pipefail
          python3 tests/apply_p2_green2_patch.py
          git diff --check
          git status --short src/dsp/miniacid_engine.cpp src/dsp/miniacid_engine.h

      - name: Install focused host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            libsdl2-dev \
            libsdl2-gfx-dev \
            pkg-config

      - name: Prove bounded GREEN #2 candidate
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          set -euo pipefail
          python3 tests/test_pattern_phrase_p2_single_lifetime_owner_contract.py
          bash tests/run_pattern_phrase_p2_transport_barrier.sh

      - name: Publish proven GREEN #2 and remove candidate tooling
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [ "${remote_head}" != "${EXPECTED_HEAD}" ]; then
            echo "branch moved: expected ${EXPECTED_HEAD}, found ${remote_head}" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/dsp/miniacid_engine.cpp src/dsp/miniacid_engine.h
          git rm tests/apply_p2_green2_patch.py .github/workflows/p2_green2_candidate.yml
          git diff --cached --check
          git commit -m "fix: route STOP PAUSE through Pattern runtime owner"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
