name: Apply synth MAIN geometry correction

on:
  push:
    branches:
      - agent/compact-synth-controls
    paths:
      - .github/workflows/zz_apply_synth_main_r18.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compact-synth-controls
          fetch-depth: 0

      - name: Apply focused source correction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/ui/pages/tb303_params_page.cpp")
          text = path.read_text(encoding="utf-8")

          old_disabled = (
              "    if (!enabled_) {\n"
              "      gfx.setTextColor(kDimText);\n"
              "      gfx.drawText(bounds.x + bounds.w - gfx.textWidth(\"--\") - 8, textY, \"--\");\n"
              "      return;\n"
              "    }\n"
          )
          new_disabled = (
              "    if (!enabled_) {\n"
              "      // Unavailable is distinct from an available OFF toggle: no track,\n"
              "      // thumb, or stepper arrows are rendered for this row.\n"
              "      gfx.setTextColor(kDimText);\n"
              "      gfx.drawText(bounds.x + bounds.w - gfx.textWidth(\"--\") - 8, textY, \"--\");\n"
              "      return;\n"
              "    }\n"
          )
          if text.count(old_disabled) != 1:
              raise SystemExit("disabled-row render block did not match exactly once")
          text = text.replace(old_disabled, new_disabled, 1)

          old_geometry = (
              "  if (!more_tab_) {\n"
              "    constexpr int kMainKnobRadius = 13;\n"
              "    const int knobRowY = content.y + 45;\n"
          )
          new_geometry = (
              "  if (!more_tab_) {\n"
              "    // Vertical budget inside the 103 px content area:\n"
              "    // tab segment ends at +15, value text starts at +17,\n"
              "    // the R18 circle spans +27..+63, label starts at +67,\n"
              "    // key hint starts at +75, and the summary starts at +89.\n"
              "    constexpr int kMainKnobRadius = 18;\n"
              "    const int knobRowY = content.y + 45;\n"
          )
          if text.count(old_geometry) != 1:
              raise SystemExit("MAIN knob geometry block did not match exactly once")
          text = text.replace(old_geometry, new_geometry, 1)

          if "kMainKnobRadius = 13" in text:
              raise SystemExit("compact R13 geometry remains")
          if "kMainKnobRadius = 18" not in text:
              raise SystemExit("R18 geometry was not installed")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit product change and remove runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz_apply_synth_main_r18.yml
          git add src/ui/pages/tb303_params_page.cpp
          git commit -m "ui: restore performance knob size on synth MAIN"
          git push origin HEAD:agent/compact-synth-controls
