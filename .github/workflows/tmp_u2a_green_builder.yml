name: TEMP U2A Green Builder

on:
  push:
    branches:
      - tmp/20260906-ui-u2a-green-builder

permissions:
  contents: write

jobs:
  build-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: tmp/20260906-ui-u2a-green-builder
      - name: Apply guarded U2A patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/ui/pages/synth_sequencer_page.cpp')
          s = p.read_text()
          old = '''  if (notesTab &&\n      UI::currentStyle != VisualStyle::RETRO_CLASSIC &&\n      UI::currentStyle != VisualStyle::AMBER) {\n    return;\n  }\n'''
          if s.count(old) != 1:
              raise SystemExit(f'guarded anchor count={s.count(old)}')
          p.write_text(s.replace(old, '', 1))
          PY
      - name: Verify focused U2A gate
        shell: bash
        run: bash tests/run_ui_constitution_u2a_tests.sh
      - name: Verify diff scope
        shell: bash
        run: |
          test "$(git diff --name-only | tr '\n' ' ')" = "src/ui/pages/synth_sequencer_page.cpp "
          git diff --check
      - name: Commit GREEN
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/pages/synth_sequencer_page.cpp
          git commit -m 'fix(ui): keep synth tab observable across themes'
          git push origin HEAD:tmp/20260906-ui-u2a-green-builder
