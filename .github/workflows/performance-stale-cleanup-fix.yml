name: Apply stale Performance cleanup regression fix

on:
  push:
    branches:
      - feature/20260903-03-0.9.9-performance-instrument-v1-closure

permissions:
  contents: write

jobs:
  apply-test-only-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/20260903-03-0.9.9-performance-instrument-v1-closure
          fetch-depth: 0
      - name: Verify branch has not moved since checkout
        run: |
          git fetch origin feature/20260903-03-0.9.9-performance-instrument-v1-closure
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feature/20260903-03-0.9.9-performance-instrument-v1-closure)"
      - name: Replace stale MiniAcid assertion with authoritative owner contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/_performance_source_regressions_base.py")
          text = path.read_text(encoding="utf-8")
          old = '''def test_performance_all_notes_off_is_target_scoped() -> None:
              sink = (ROOT / "src/input/internal_synth_output.cpp").read_text(
                  encoding="utf-8"
              )
              start = sink.index("case MusicalEventType::AllNotesOff")
              block = sink[start:]

              require("engine_.liveNote(voice)" in block,
                      "AllNotesOff must inspect only the event target voice")
              require("engine_.liveNoteOff(voice" in block,
                      "AllNotesOff must release only the live-owned target voice")
              require("engine_.allLiveNotesOff()" not in block,
                      "performance AllNotesOff must not become a global voice release")
          '''
          new = '''def test_performance_all_notes_off_is_target_scoped() -> None:
              sink = (ROOT / "src/input/internal_synth_output.cpp").read_text(
                  encoding="utf-8"
              )
              header = (ROOT / "src/input/internal_synth_output.h").read_text(
                  encoding="utf-8"
              )

              handle_start = sink.index("void InternalSynthOutput::handleMusicalEvent")
              handle_block = sink[handle_start:]
              require("const int voice = synthIndex(event.target);" in handle_block and
                      "MonoArbitrationState& state = monoState_[voice];" in handle_block,
                      "AllNotesOff must select only the event target arbitration state")
              require("state.applyLiveEvent(event);" in handle_block and
                      "reconcileLiveProjectionLocked(voice);" in handle_block,
                      "target cleanup must clear authoritative state before reconciling its projection")

              reconcile_start = sink.index(
                  "void InternalSynthOutput::reconcileLiveProjectionLocked")
              reconcile_end = sink.index(
                  "void InternalSynthOutput::applyPatternOwnershipLocked", reconcile_start)
              reconcile_block = sink[reconcile_start:reconcile_end]
              require("engine_.liveNoteOff(voice" in reconcile_block,
                      "target cleanup must physically release the projected target voice")

              require("if (event.type == MusicalEventType::AllNotesOff)" in header and
                      "panic();" in header and
                      "generatedCandidate = Candidate{};" in header and
                      "directCandidate = Candidate{};" in header and
                      "otherLiveCandidate = Candidate{};" in header,
                      "AllNotesOff must kill authoritative live candidates, including suppressed ones")
              require("engine_.allLiveNotesOff()" not in sink,
                      "performance AllNotesOff must not become a global voice release")
          '''
          if old not in text:
              raise SystemExit("stale regression block did not match expected exact text")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Remove helper workflow from final tree
        run: git rm .github/workflows/performance-stale-cleanup-fix.yml
      - name: Verify test-only behavioral closure
        run: |
          python3 tests/test_performance_source_regressions.py
          bash tests/run_performance_closure_tests.sh
      - name: Commit test-only correction
        run: |
          test -z "$(git diff --name-only -- src ':!tests/_performance_source_regressions_base.py')"
          git config user.name "Ostrovsky42"
          git config user.email "tootoo9723@gmail.com"
          git add tests/_performance_source_regressions_base.py .github/workflows/performance-stale-cleanup-fix.yml
          git commit -m "test: observe authoritative performance cleanup owner"
          git push origin HEAD:feature/20260903-03-0.9.9-performance-instrument-v1-closure
