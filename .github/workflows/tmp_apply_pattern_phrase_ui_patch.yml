name: TEMP Apply Pattern Phrase UI Patch

on:
  push:
    branches:
      - feature/20260908-03-0.9.10-pattern-phrase-ui-instrument-closure
    paths:
      - scripts/apply_pattern_phrase_ui_instrument_page_patch.py
      - src/ui/phrase_source_toggle.h
      - tests/test_ui_pattern_phrase_instrument_integration.py
      - .github/workflows/tmp_apply_pattern_phrase_ui_patch.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SDL test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libsdl2-dev \
            libsdl2-gfx-dev

      - name: Apply exact page patch
        run: python3 scripts/apply_pattern_phrase_ui_instrument_page_patch.py

      - name: Keep conversion decision in PhraseSourceToggle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/ui/pages/synth_sequencer_page.cpp")
          text = path.read_text(encoding="utf-8")
          old = '''  if (synth_tab_ == SynthTab::Notes && isSourceToggleKey(ui_event)) {
            if (mini_acid_.currentSequencedSource(voice_index_) ==
                MiniAcid::SequencedSource::Pattern) {
              const bool made =
                  PhraseSourceToggle::makePhrase(mini_acid_, audio_guard_, voice_index_);
              UI::showToast(made ? "MAKE PHRASE" : "MAKE PHRASE FAILED", 1000);
            } else {
              PhraseSourceToggle::toggle(mini_acid_, audio_guard_, voice_index_);
              UI::showToast("SOURCE: PATTERN", 1000);
            }
            return true;
          }
          '''
          new = '''  if (synth_tab_ == SynthTab::Notes && isSourceToggleKey(ui_event)) {
            const auto sourceResult =
                PhraseSourceToggle::toggle(mini_acid_, audio_guard_, voice_index_);
            switch (sourceResult) {
              case PhraseSourceToggle::Result::MadePhrase:
                UI::showToast("MAKE PHRASE", 1000);
                break;
              case PhraseSourceToggle::Result::SwitchedToPhrase:
                UI::showToast("SOURCE: PHRASE", 1000);
                break;
              case PhraseSourceToggle::Result::SwitchedToPattern:
                UI::showToast("SOURCE: PATTERN", 1000);
                break;
              case PhraseSourceToggle::Result::Rejected:
                UI::showToast("SOURCE CHANGE FAILED", 1000);
                break;
            }
            return true;
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(
                  f"source-owner anchor count={text.count(old)}; expected exactly one"
              )
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Run focused Pattern Phrase UI gate
        run: bash tests/run_ui_pattern_phrase_instrument_tests.sh

      - name: Commit verified page integration and remove temporary machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/pages/synth_sequencer_page.cpp
          git rm scripts/apply_pattern_phrase_ui_instrument_page_patch.py
          git rm .github/workflows/tmp_apply_pattern_phrase_ui_patch.yml
          git commit -m "feat(ui): integrate Pattern Phrase instrument controls"
          git push origin HEAD:feature/20260908-03-0.9.10-pattern-phrase-ui-instrument-closure
