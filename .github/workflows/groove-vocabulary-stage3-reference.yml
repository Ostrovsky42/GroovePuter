name: Groove Vocabulary Stage 3 reference

on:
  pull_request:

permissions:
  contents: read

jobs:
  stage3-reference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Stage 1 focused tests
        run: bash tests/run_rhythm_stage1_tests.sh
      - name: Run Stage 2 focused tests
        run: bash tests/run_rhythm_stage2_tests.sh
      - name: Run Stage 3 reference vocabulary matrix
        run: bash tests/run_rhythm_stage3_tests.sh
