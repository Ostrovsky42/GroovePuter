name: Apply synth tab geometry bridge

on:
  push:
    branches:
      - agent/compact-synth-controls

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply geometry bridge
        run: python3 tools/agent_fix_synth_tab_content_rect.py

      - name: Run host regressions
        run: bash tests/run_host_tests.sh

      - name: Publish tested fix
        run: |
          git config user.name "openai-coding-agent"
          git config user.email "openai-coding-agent@users.noreply.github.com"
          git rm .github/workflows/agent-fix-synth-tab-content-rect.yml
          git rm tools/agent_fix_synth_tab_content_rect.py
          git add src/ui/pages/tb303_params_page.cpp \
                  tests/test_wavemorph_performance_source_regressions.py
          git commit -m "fix: bridge synth tab content geometry"
          git push origin HEAD:agent/compact-synth-controls
