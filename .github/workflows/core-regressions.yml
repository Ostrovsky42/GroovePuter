name: Core regressions

on:
  push:
    branches:
      - main
      - dev
      - agent/fix-core-reliability
  pull_request:

permissions:
  contents: write

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run core host regressions
        run: |
          bash tests/run_host_tests.sh
          python3 tests/test_smf_panel_completion_source_regressions.py

      - name: Run UI status chrome tests
        run: |
          python3 tests/test_ui_status_chrome_source_regressions.py
          mkdir -p build/host-tests
          g++ -std=c++17 -Wall -Wextra -Werror -I. \
            tests/test_ui_status_chrome.cpp \
            -o build/host-tests/test_ui_status_chrome
          build/host-tests/test_ui_status_chrome

      - name: Run synth engine tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          assert not (root / 'src/dsp/opl2_synth_voice.h').exists()
          assert not (root / 'src/dsp/opl2_synth_voice.cpp').exists()

          for path in (
              root / 'src/ui/pages/synth_sequencer_page.cpp',
              root / 'src/ui/pages/tb303_params_page.cpp',
          ):
              text = path.read_text(encoding='utf-8')
              assert 'removeDisabledSynthEngines' in text
              assert '{"TB303", "SID", "AY", "OPL2"' not in text

          makefile = (root / 'platform_sdl/Makefile').read_text(encoding='utf-8')
          assert 'opl2_synth_voice' not in makefile
          assert 'wave_morph_synth_voice.cpp' in makefile

          header = (root / 'src/dsp/swappable_synth_voice.h').read_text(encoding='utf-8')
          assert 'opl2_synth_voice' not in header
          assert 'WAVEMORPH = 6' in header
          PY

          mkdir -p build/host-tests
          g++ -std=c++17 -Wall -Wextra -Werror -Wno-unused-parameter -I. \
            tests/test_new_synth_voices.cpp \
            src/dsp/swappable_synth_voice.cpp \
            src/dsp/mini_tb303.cpp \
            src/dsp/filter.cpp \
            src/dsp/audio_wavetables.cpp \
            src/dsp/sid_synth_voice.cpp \
            src/dsp/sid_synth.cpp \
            src/dsp/ay_synth_voice.cpp \
            src/dsp/sh101_synth_voice.cpp \
            src/dsp/sn76489_synth_voice.cpp \
            src/dsp/wave_morph_synth_voice.cpp \
            -o build/host-tests/test_new_synth_voices
          build/host-tests/test_new_synth_voices

      - name: Run dirty-region display tests
        run: |
          mkdir -p build/host-tests
          g++ -std=c++17 -Wall -Wextra -Werror -I. \
            tests/test_dirty_tile_tracker.cpp \
            -o build/host-tests/test_dirty_tile_tracker
          build/host-tests/test_dirty_tile_tracker

  sdl-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libsdl2-dev \
            libsdl2-gfx-dev

      - name: Build desktop target
        working-directory: platform_sdl
        run: make clean all CXX=g++

  cardputer-adv-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install pinned M5Stack dependencies
        run: bash scripts/install_arduino_deps.sh

      - name: Compile Cardputer ADV firmware
        run: bash scripts/build.sh --warnings all

  apply-smf-fn-number-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/smf-track-mute-mixer
          fetch-depth: 0

      - name: Patch real Cardputer number-key path
        shell: bash
        run: |
          git pull --ff-only origin agent/smf-track-mute-mixer
          python3 - <<'PY'
          from pathlib import Path

          page_path = Path('src/ui/pages/smf_player_page.cpp')
          display_path = Path('src/ui/miniacid_display.cpp')
          test_path = Path('tests/test_smf_panel_completion_source_regressions.py')
          core_path = Path('.github/workflows/core-regressions.yml')
          standalone_path = Path('.github/workflows/apply-smf-fn-number-fix.yml')

          page = page_path.read_text(encoding='utf-8')
          display = display_path.read_text(encoding='utf-8')
          test = test_path.read_text(encoding='utf-8')

          old_page_guard = """bool SmfPlayerPage::handleEvent(UIEvent& event) {
              if (event.event_type != GROOVEPUTER_KEY_DOWN || event.alt || event.ctrl || event.meta) {
                  return false;
              }
          """
          new_page_guard = """bool SmfPlayerPage::handleEvent(UIEvent& event) {
              const bool numericMuteHotkey = event.key >= '1' && event.key <= '9';
              if (event.event_type != GROOVEPUTER_KEY_DOWN || event.alt || event.ctrl ||
                  (event.meta && !numericMuteHotkey)) {
                  return false;
              }
          """
          if old_page_guard not in page:
              raise SystemExit('SmfPlayerPage event guard anchor missing')
          page = page.replace(old_page_guard, new_page_guard, 1)

          old_global = """        if ((event.alt || event.meta) && !event.ctrl) {
              int targetPage = -1;
          """
          new_global = """        const bool smfPlayerFnNumber =
                  page_index_ == kSmfPlayerPage && event.meta && !event.alt &&
                  !event.ctrl && event.key >= '1' && event.key <= '9';
              if ((event.alt || event.meta) && !event.ctrl && !smfPlayerFnNumber) {
                  int targetPage = -1;
          """
          if old_global not in display:
              raise SystemExit('global Fn-number navigation anchor missing')
          display = display.replace(old_global, new_global, 1)

          anchor = """    require(\"toggleAudibleTrackHotkey\" in page_cpp and
                      \"event.key >= '1' && event.key <= '9'\" in page_cpp and
                      '\"MIDI SLOT %u EMPTY\"' in page_cpp,
                      \"1-9 must directly mute the first nine audible SMF tracks\")
          """
          addition = """    require(\"toggleAudibleTrackHotkey\" in page_cpp and
                      \"event.key >= '1' && event.key <= '9'\" in page_cpp and
                      '\"MIDI SLOT %u EMPTY\"' in page_cpp,
                      \"1-9 must directly mute the first nine audible SMF tracks\")
              require(\"const bool numericMuteHotkey\" in page_cpp and
                      \"(event.meta && !numericMuteHotkey)\" in page_cpp,
                      \"Cardputer Fn-number events must be accepted by MIDI Player\")
              require(\"const bool smfPlayerFnNumber\" in display_cpp and
                      \"!smfPlayerFnNumber\" in display_cpp and
                      \"page_index_ == kSmfPlayerPage\" in display_cpp,
                      \"MIDI Player Fn+1-9 must bypass global Fn-number page navigation\")
          """
          if anchor not in test:
              raise SystemExit('source regression anchor missing')
          test = test.replace(anchor, addition, 1)

          page_path.write_text(page, encoding='utf-8')
          display_path.write_text(display, encoding='utf-8')
          test_path.write_text(test, encoding='utf-8')
          if standalone_path.exists():
              standalone_path.unlink()

          core = core_path.read_text(encoding='utf-8')
          marker = '\n  apply-smf-fn-number-fix:\n'
          if marker not in core:
              raise SystemExit('temporary core workflow marker missing')
          clean = core.split(marker, 1)[0]
          clean = clean.replace('permissions:\n  contents: write',
                                'permissions:\n  contents: read', 1)
          core_path.write_text(clean.rstrip() + '\n', encoding='utf-8')
          PY

          python3 tests/test_smf_panel_completion_source_regressions.py
          bash tests/run_host_tests.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: route Cardputer Fn-number keys to SMF mutes"
          git pull --rebase origin agent/smf-track-mute-mixer
          git push origin HEAD:agent/smf-track-mute-mixer
