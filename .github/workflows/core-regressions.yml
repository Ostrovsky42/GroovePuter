name: Core regressions

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-smf-fn-number-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/smf-track-mute-mixer
          fetch-depth: 0

      - name: Patch real Cardputer number-key path
        shell: bash
        run: |
          git pull --ff-only origin agent/smf-track-mute-mixer
          python3 - <<'PY'
          from pathlib import Path
          import re

          page_path = Path('src/ui/pages/smf_player_page.cpp')
          display_path = Path('src/ui/miniacid_display.cpp')
          test_path = Path('tests/test_smf_panel_completion_source_regressions.py')
          standalone_path = Path('.github/workflows/apply-smf-fn-number-fix.yml')

          page = page_path.read_text(encoding='utf-8')
          display = display_path.read_text(encoding='utf-8')
          test = test_path.read_text(encoding='utf-8')

          page_pattern = re.compile(
              r"bool SmfPlayerPage::handleEvent\(UIEvent& event\) \{\n"
              r"(?P<i>[ \t]*)if \(event\.event_type != GROOVEPUTER_KEY_DOWN \|\| "
              r"event\.alt \|\| event\.ctrl \|\| event\.meta\) \{\n"
              r"(?P=i)    return false;\n(?P=i)\}")
          page_match = page_pattern.search(page)
          if not page_match:
              raise SystemExit('SmfPlayerPage event guard not found')
          indent = page_match.group('i')
          page_replacement = (
              "bool SmfPlayerPage::handleEvent(UIEvent& event) {\n"
              f"{indent}const bool numericMuteHotkey = "
              "event.key >= '1' && event.key <= '9';\n"
              f"{indent}if (event.event_type != GROOVEPUTER_KEY_DOWN || "
              "event.alt || event.ctrl ||\n"
              f"{indent}    (event.meta && !numericMuteHotkey)) {{\n"
              f"{indent}    return false;\n"
              f"{indent}}}")
          page = page_pattern.sub(page_replacement, page, count=1)

          global_pattern = re.compile(
              r"(?m)^(?P<i>[ \t]*)if \(\(event\.alt \|\| event\.meta\) && "
              r"!event\.ctrl\) \{\n(?P=i)    int targetPage = -1;")
          global_match = global_pattern.search(display)
          if not global_match:
              raise SystemExit('global Fn-number navigation block not found')
          indent = global_match.group('i')
          global_replacement = (
              f"{indent}const bool smfPlayerFnNumber =\n"
              f"{indent}    page_index_ == kSmfPlayerPage && event.meta && "
              "!event.alt &&\n"
              f"{indent}    !event.ctrl && event.key >= '1' && event.key <= '9';\n"
              f"{indent}if ((event.alt || event.meta) && !event.ctrl && "
              "!smfPlayerFnNumber) {\n"
              f"{indent}    int targetPage = -1;")
          display = global_pattern.sub(global_replacement, display, count=1)

          assertion = '''    require("toggleAudibleTrackHotkey" in page_cpp and
                  "event.key >= '1' && event.key <= '9'" in page_cpp and
                  '"MIDI SLOT %u EMPTY"' in page_cpp,
                  "1-9 must directly mute the first nine audible SMF tracks")
          '''
          extra = assertion + '''    require("const bool numericMuteHotkey" in page_cpp and
                  "(event.meta && !numericMuteHotkey)" in page_cpp,
                  "Cardputer Fn-number events must be accepted by MIDI Player")
              require("const bool smfPlayerFnNumber" in display_cpp and
                  "!smfPlayerFnNumber" in display_cpp and
                  "page_index_ == kSmfPlayerPage" in display_cpp,
                  "MIDI Player Fn+1-9 must bypass global Fn-number page navigation")
          '''
          if assertion not in test:
              raise SystemExit('source regression insertion point not found')
          test = test.replace(assertion, extra, 1)

          page_path.write_text(page, encoding='utf-8')
          display_path.write_text(display, encoding='utf-8')
          test_path.write_text(test, encoding='utf-8')
          if standalone_path.exists():
              standalone_path.unlink()
          PY

          git show e87075d81996997f9d3cc2a50544437c441e686c:.github/workflows/core-regressions.yml > .github/workflows/core-regressions.yml
          python3 tests/test_smf_panel_completion_source_regressions.py
          bash tests/run_host_tests.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: route Cardputer Fn-number keys to SMF mutes"
          git pull --rebase origin agent/smf-track-mute-mixer
          git push origin HEAD:agent/smf-track-mute-mixer
