name: Core regressions

on:
  push:
    branches:
      - main
      - dev
      - agent/fix-core-reliability
  pull_request:

permissions:
  contents: write

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run core host regressions
        run: bash tests/run_host_tests.sh

  sdl-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libsdl2-dev \
            libsdl2-gfx-dev

      - name: Build desktop target
        working-directory: platform_sdl
        run: make clean all CXX=g++

  cardputer-adv-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install pinned M5Stack dependencies
        run: bash scripts/install_arduino_deps.sh

      - name: Compile Cardputer ADV firmware
        run: bash scripts/build.sh --warnings all

  apply-active-seek-spp:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feature/midi-lifecycle-panel-performance-completion' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/midi-lifecycle-panel-performance-completion
          fetch-depth: 0

      - name: Configure identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Patch active seek and dispatcher
        run: |
          python3 - <<'PY'
          from pathlib import Path

          player_path = Path("src/platform/cardputer_smf_player.cpp")
          player = player_path.read_text(encoding="utf-8")

          include_old = (
              '#include "src/audio/audio_config.h"\n'
              '#include "src/midi/transport_clock_runtime.h"\n'
          )
          include_new = (
              '#include "src/audio/audio_config.h"\n'
              '#include "src/midi/midi_transport_capabilities.h"\n'
              '#include "src/midi/transport_clock_runtime.h"\n'
          )
          if '#include "src/midi/midi_transport_capabilities.h"' not in player:
              if include_old not in player:
                  raise SystemExit("player include anchor missing")
              player = player.replace(include_old, include_new, 1)

          seek_old = (
              "            if (previous == SmfPlayerState::Playing || previous == SmfPlayerState::Armed) {\n"
              "                startFromTick(targetTick);\n"
              "            } else {\n"
          )
          seek_new = (
              "            if (previous == SmfPlayerState::Playing || previous == SmfPlayerState::Armed) {\n"
              "                const bool started = startFromTick(targetTick);\n"
              "                if (started && tempoMode_ == SmfTempoMode::Project) {\n"
              "                    (void)queueSongPositionPointerAtCurrentAnchor(targetTick);\n"
              "                }\n"
              "            } else {\n"
          )
          if "queueSongPositionPointerAtCurrentAnchor(targetTick)" not in player:
              if seek_old not in player:
                  raise SystemExit("active seek anchor missing")
              player = player.replace(seek_old, seek_new, 1)

          helper = (
              "bool CardputerSmfPlayerService::queueSongPositionPointerAtCurrentAnchor(\n"
              "        uint32_t tick) {\n"
              "    const GroovePuterMidi::MidiTransportCapabilities capabilities =\n"
              "        GroovePuterMidi::midiTransportCapabilityRuntime().capabilities();\n"
              "    if (!capabilities.songPositionTx || fileIndex_.division == 0) {\n"
              "        return true;\n"
              "    }\n"
              "\n"
              "    uint32_t anchorBlock = 0;\n"
              "    uint32_t anchorMicros = 0;\n"
              "    if (!snapshotCardputerUsbMidiBlockAnchor(anchorBlock, anchorMicros)) {\n"
              "        return false;\n"
              "    }\n"
              "    (void)anchorMicros;\n"
              "    const uint16_t position =\n"
              "        GroovePuterMidi::songPositionPointerFromPpqnTicks(\n"
              "            tick, fileIndex_.division);\n"
              "    return eventQueue_.tryPushSongPositionPointer(\n"
              "        position, anchorBlock + 1u, 0);\n"
              "}\n"
              "\n"
          )
          helper_anchor = "void CardputerSmfPlayerService::pauseAtCurrentPosition() {\n"
          if "bool CardputerSmfPlayerService::queueSongPositionPointerAtCurrentAnchor" not in player:
              if helper_anchor not in player:
                  raise SystemExit("player helper anchor missing")
              player = player.replace(helper_anchor, helper + helper_anchor, 1)
          player_path.write_text(player, encoding="utf-8")

          dispatch_path = Path("src/platform/cardputer_usb_midi_transport.cpp")
          dispatch = dispatch_path.read_text(encoding="utf-8")
          if "handleSmfSongPositionPointer" not in dispatch:
              start = dispatch.index(
                  "bool dispatchSmfEvent(const ScheduledSmfMidiEvent& event) {")
              end = dispatch.index("\nbool projectSmfNoteOnStillCurrent", start)
              replacement = (
                  "bool dispatchSmfEvent(const ScheduledSmfMidiEvent& event) {\n"
                  "    switch (event.type) {\n"
                  "        case ScheduledSmfMidiEventType::NoteOn:\n"
                  "            return g_output.handleSmfNoteOn(\n"
                  "                event.channel, event.note, event.velocity);\n"
                  "        case ScheduledSmfMidiEventType::NoteOff:\n"
                  "            return g_output.handleSmfNoteOff(\n"
                  "                event.channel, event.note, event.velocity);\n"
                  "        case ScheduledSmfMidiEventType::SongPositionPointer:\n"
                  "            return g_output.handleSmfSongPositionPointer(\n"
                  "                scheduledSmfSongPositionPointerValue(event));\n"
                  "    }\n"
                  "    return false;\n"
                  "}\n"
              )
              dispatch = dispatch[:start] + replacement + dispatch[end:]
          dispatch_path.write_text(dispatch, encoding="utf-8")

          source_test = Path("tests/test_smf_panel_completion_source_regressions.py")
          source = source_test.read_text(encoding="utf-8")
          layout_line = (
              '    layout = (ROOT / "src/ui/layout_manager.cpp").read_text(encoding="utf-8")\n'
          )
          extra_reads = (
              layout_line
              + '    player_service = (ROOT / "src/platform/cardputer_smf_player.cpp").read_text(encoding="utf-8")\n'
              + '    dispatcher = (ROOT / "src/platform/cardputer_usb_midi_transport.cpp").read_text(encoding="utf-8")\n'
              + '    smf_queue = (ROOT / "src/midi/scheduled_smf_midi_event_queue.h").read_text(encoding="utf-8")\n'
          )
          if "player_service =" not in source:
              if layout_line not in source:
                  raise SystemExit("panel source read anchor missing")
              source = source.replace(layout_line, extra_reads, 1)

          marker = '    print("SMF panel completion source regressions: OK")\n'
          assertions = (
              '    require("queueSongPositionPointerAtCurrentAnchor(targetTick)" in player_service and\n'
              '            "tryPushSongPositionPointer" in player_service,\n'
              '            "active PROJECT seek must publish a bounded SPP intent")\n'
              '    require("ScheduledSmfMidiEventType::SongPositionPointer" in dispatcher and\n'
              '            "handleSmfSongPositionPointer" in dispatcher,\n'
              '            "MidiDispatchTask must own the physical active-seek SPP write")\n'
              '    require("pendingSppEpoch_" in smf_queue and\n'
              '            "takePendingSongPositionPointer" in smf_queue,\n'
              '            "active-seek SPP must use a latest-wins bounded mailbox")\n'
              '\n'
          )
          if "active PROJECT seek must publish a bounded SPP intent" not in source:
              if marker not in source:
                  raise SystemExit("panel source test marker missing")
              source = source.replace(marker, assertions + marker, 1)
          source_test.write_text(source, encoding="utf-8")
          PY

      - name: Run host regressions
        run: bash tests/run_host_tests.sh

      - name: Restore workflow and remove temporary patch file
        run: |
          git fetch origin feature/midi-lifecycle-panel-performance
          git show origin/feature/midi-lifecycle-panel-performance:.github/workflows/core-regressions.yml > .github/workflows/core-regressions.yml
          rm -f .github/workflows/apply-active-seek-spp.yml

      - name: Commit and push implementation
        run: |
          git add -A
          git commit -m "feat(midi): schedule SPP for active PROJECT seek"
          git push origin HEAD:feature/midi-lifecycle-panel-performance-completion
