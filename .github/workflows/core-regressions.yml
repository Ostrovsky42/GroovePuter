name: Core regressions

on:
  push:
    branches:
      - main
      - agent/fix-core-reliability
  pull_request:

permissions:
  contents: write

jobs:
  apply-channel-inspector:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/smf-channel-inspector' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/smf-channel-inspector
          fetch-depth: 0

      - name: Extract and apply focused patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-smf-channel-inspector.yml').read_text(encoding='utf-8').splitlines()
          output = []
          capture = False
          in_triple = False
          for raw in source:
              if not capture:
                  if "python3 - <<'PY'" in raw:
                      capture = True
                  continue
              if not in_triple and raw.strip() == 'PY':
                  break
              line = raw
              if not in_triple and line.startswith('          '):
                  line = line[10:]
              output.append(line)
              if line.count("'''") % 2 == 1:
                  in_triple = not in_triple
          if not output or in_triple:
              raise SystemExit('embedded patch extraction failed')
          Path('/tmp/apply-smf-channel-inspector.py').write_text(
              '\n'.join(output) + '\n', encoding='utf-8')
          PY
          python3 /tmp/apply-smf-channel-inspector.py

      - name: Run host tests
        run: bash tests/run_host_tests.sh

      - name: Commit clean feature branch
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/core-regressions.yml
          rm -f .github/workflows/apply-smf-channel-inspector.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add bounded SMF channel inspector"
          git push origin HEAD:feature/smf-channel-inspector

  host-tests:
    if: github.head_ref != 'feature/smf-channel-inspector' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run core host regressions
        run: bash tests/run_host_tests.sh

  sdl-build:
    if: github.head_ref != 'feature/smf-channel-inspector' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libsdl2-dev \
            libsdl2-gfx-dev

      - name: Build desktop target
        working-directory: platform_sdl
        run: make clean all CXX=g++

  cardputer-adv-build:
    if: github.head_ref != 'feature/smf-channel-inspector' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install pinned M5Stack dependencies
        run: bash scripts/install_arduino_deps.sh

      - name: Compile Cardputer ADV firmware
        run: bash scripts/build.sh --warnings all
