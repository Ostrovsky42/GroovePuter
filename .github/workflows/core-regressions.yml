name: Core regressions

on:
  push:
    branches:
      - main
      - agent/fix-core-reliability
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run core host regressions
        run: bash tests/run_host_tests.sh

  sdl-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libsdl2-dev \
            libsdl2-gfx-dev

      - name: Build desktop target
        working-directory: platform_sdl
        run: make clean all CXX=g++

  cardputer-adv-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install pinned M5Stack dependencies
        run: bash scripts/install_arduino_deps.sh

      - name: Compile Cardputer ADV firmware
        id: cardputer_compile
        shell: bash
        run: |
          set +e
          bash scripts/build.sh --warnings all > cardputer-build.log 2>&1
          status=$?
          tail -n 200 cardputer-build.log
          exit "$status"

      - name: Upload Cardputer compile diagnostics
        if: failure() && steps.cardputer_compile.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cardputer-compile-diagnostics
          path: cardputer-build.log
          if-no-files-found: error
          retention-days: 1
