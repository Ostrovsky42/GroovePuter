name: Core regressions

on:
  pull_request:

permissions:
  contents: write

jobs:
  update-scene-scratch-regression:
    if: github.head_ref == 'agent/fix-cardputer-dram-scene-storage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-cardputer-dram-scene-storage
          fetch-depth: 0

      - name: Update legacy scratch-buffer invariant
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/test_source_regressions.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def test_scene_and_page_validation_share_one_scratch_buffer() -> None:')
          end = text.index('\ndef test_genre_regeneration_uses_full_compiled_params()', start)
          replacement = '''def test_scene_and_page_validation_share_one_scratch_buffer() -> None:
              scenes_header = (ROOT / "scenes.h").read_text(encoding="utf-8")
              scenes = (ROOT / "scenes.cpp").read_text(encoding="utf-8")
              paging = (ROOT / "src/audio/pattern_paging.cpp").read_text(encoding="utf-8")

              require("class SceneScratchLease" in scenes_header and
                      "SceneScratchLease::SceneScratchLease()" in scenes and
                      "SceneScratchLease::~SceneScratchLease()" in scenes,
                      "scene parsing and page validation need a bounded RAII scratch contract")
              require("MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT" in scenes and
                      "MALLOC_CAP_SPIRAM" not in scenes,
                      "Cardputer scratch scenes must use internal heap without PSRAM")
              require("PageStaging" not in paging and "g_stagingPage" not in paging,
                      "pattern paging must not retain a second static staging buffer")
              require(paging.count("SceneScratchLease scratch;") == 2 and
                      "SceneScratchLease scratch;" in scenes and
                      "readAndValidatePage(const std::string& path, Scene& staging)" in paging,
                      "project and page validation must lease and release transaction scenes")

          '''.replace('          ', '')
          path.write_text(text[:start] + replacement + text[end + 1:], encoding='utf-8')
          PY

          python3 tests/test_source_regressions.py
          python3 tests/test_cardputer_dram_storage_source_regressions.py
          git diff --check

      - name: Commit regression update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_source_regressions.py
          git commit -m "test: enforce bounded Scene scratch lifetime"
          git push origin HEAD:agent/fix-cardputer-dram-scene-storage
