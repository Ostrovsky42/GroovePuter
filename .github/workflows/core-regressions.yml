name: Core regressions

on:
  push:
    branches:
      - main
      - dev
      - agent/fix-core-reliability
  pull_request:

permissions:
  contents: write

jobs:
  fix-unified-midi-file-manager-regression:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/unified-midi-file-manager'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-midi-file-manager
          fetch-depth: 0

      - name: Update SMF load ownership regression
        run: python3 tools/fix_unified_midi_manager_performance_regression.py

      - name: Run focused host regressions
        run: |
          python3 tests/test_performance_source_regressions.py
          python3 tests/test_source_regressions.py
          python3 tests/test_midi_file_manager_source_regressions.py

      - name: Commit production diff
        run: |
          git checkout origin/dev -- .github/workflows/core-regressions.yml
          rm -f tools/fix_unified_midi_manager_performance_regression.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: track SMF load through shared MIDI browser"
          git push origin HEAD:feature/unified-midi-file-manager

  host-tests:
    if: github.event_name != 'pull_request' || github.head_ref != 'feature/unified-midi-file-manager'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run core host regressions
        run: bash tests/run_host_tests.sh

      - name: Run UI status chrome tests
        run: |
          python3 tests/test_ui_status_chrome_source_regressions.py
          mkdir -p build/host-tests
          g++ -std=c++17 -Wall -Wextra -Werror -I. \
            tests/test_ui_status_chrome.cpp \
            -o build/host-tests/test_ui_status_chrome
          build/host-tests/test_ui_status_chrome

  sdl-build:
    if: github.event_name != 'pull_request' || github.head_ref != 'feature/unified-midi-file-manager'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libsdl2-dev \
            libsdl2-gfx-dev

      - name: Build desktop target
        working-directory: platform_sdl
        run: make clean all CXX=g++

  cardputer-adv-build:
    if: github.event_name != 'pull_request' || github.head_ref != 'feature/unified-midi-file-manager'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install pinned M5Stack dependencies
        run: bash scripts/install_arduino_deps.sh

      - name: Compile Cardputer ADV firmware
        run: bash scripts/build.sh --warnings all
