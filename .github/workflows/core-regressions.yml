name: Core regressions

on:
  push:
    branches:
      - main
      - agent/fix-core-reliability
  pull_request:

permissions:
  contents: write

jobs:
  migrate-atlas-recipes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/fix-core-reliability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-core-reliability
          fetch-depth: 0

      - name: Apply guarded Atlas migration
        run: |
          if grep -q '"Rolling Acid"' src/dsp/genre_manager.cpp; then
            echo "Atlas recipe migration already applied"
            exit 0
          fi
          base64 -d scripts/migrate_atlas_recipes.py.gz.b64 | gzip -d > /tmp/migrate_atlas_recipes.py
          python3 /tmp/migrate_atlas_recipes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/dsp/genre_manager.cpp \
            src/ui/pages/genre_page.cpp \
            src/generated \
            tools/atlas \
            tests/test_atlas_runtime.cpp \
            tests/test_atlas_sound_profile.py \
            tests/test_source_regressions.py \
            docs/tests/ATLAS_RECIPE_RUNTIME_TESTS.md
          git commit -m "feat: add visible Atlas acid UKG and dub recipes"
          git push origin HEAD:agent/fix-core-reliability

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run core host regressions
        run: bash tests/run_host_tests.sh

  sdl-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libsdl2-dev \
            libsdl2-gfx-dev

      - name: Build desktop target
        working-directory: platform_sdl
        run: make clean all CXX=g++

  cardputer-adv-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install pinned M5Stack dependencies
        run: bash scripts/install_arduino_deps.sh

      - name: Compile Cardputer ADV firmware
        run: bash scripts/build.sh --warnings all
