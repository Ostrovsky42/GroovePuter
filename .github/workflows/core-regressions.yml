name: Core regressions

on:
  pull_request:

permissions:
  contents: write

jobs:
  agent-scene-storage-repair:
    if: github.head_ref == 'agent/fix-cardputer-dram-scene-storage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-cardputer-dram-scene-storage
          fetch-depth: 0

      - name: Apply no-PSRAM Scene repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/agent-fix-scene-internal-heap.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          payload = textwrap.dedent(workflow[start:end])

          scene_call = re.compile(
              r'\nreplace_once\(\n    "scenes\.cpp",\n    """.*?""",\n    """.*?""",\n\)\n',
              re.DOTALL,
          )
          payload, count = scene_call.subn('\n', payload)
          if count != 2:
              raise SystemExit(f'unexpected scenes.cpp repair call count: {count}')

          duplicate = '''replace_once(
              "GroovePuter.ino",
              "fixed internal Cardputer ADV heap.",
              "DRAM-only Cardputer ADV heap.",
          )
          '''
          if payload.count(duplicate) != 2:
              raise SystemExit('unexpected duplicate boot-comment repair payload')
          payload = payload.replace(duplicate, '', 2)
          exec(compile(payload, 'agent-scene-storage-repair', 'exec'))

          p = Path('scenes.cpp')
          text = p.read_text(encoding='utf-8')
          storage_start = text.index('namespace {\nstruct SceneStorageBlock')
          storage_end = text.index('\nvoid SceneManager::loadDefaultScene()', storage_start)
          storage = '''namespace {
          #if defined(ESP32) || defined(ESP_PLATFORM)
          Scene* g_mainScene = nullptr;

          Scene* allocateInternalScene() {
            void* memory = heap_caps_malloc(
                sizeof(Scene), MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT);
            return memory ? new (memory) Scene() : nullptr;
          }

          void releaseInternalScene(Scene* scene) {
            if (!scene) return;
            scene->~Scene();
            heap_caps_free(scene);
          }
          #else
          Scene g_mainScene;

          Scene* allocateInternalScene() {
            return new (std::nothrow) Scene();
          }

          void releaseInternalScene(Scene* scene) {
            delete scene;
          }
          #endif
          }  // namespace

          SceneScratchLease::SceneScratchLease() : scene_(allocateInternalScene()) {}

          SceneScratchLease::~SceneScratchLease() {
            releaseInternalScene(scene_);
          }

          SceneManager::SceneManager()
          #if defined(ESP32) || defined(ESP_PLATFORM)
              : scene_(nullptr)
          #else
              : scene_(&g_mainScene)
          #endif
          {
            PatternPagingService::ensureDirectory();
          }

          bool SceneManager::initializeSceneStorage() {
          #if defined(ESP32) || defined(ESP_PLATFORM)
            if (scene_) return true;
            scene_ = allocateInternalScene();
            g_mainScene = scene_;
            return scene_ != nullptr;
          #else
            return true;
          #endif
          }
          '''.replace('          ', '')
          text = text[:storage_start] + storage + text[storage_end:]

          load_start = text.index('Scene& sceneTransactionScratch()')
          marker = '  clearSceneData(*loaded);\n'
          load_end = text.index(marker, load_start) + len(marker)
          load = '''bool SceneManager::loadSceneEventedWithReader(JsonVisitor::NextChar nextChar) {
          #ifdef ARDUINO
            Serial.println("  - loadSceneEventedWithReader: Allocating bounded transaction Scene...");
          #endif

            SceneScratchLease scratch;
            if (!scratch) {
          #ifdef ARDUINO
              Serial.println("ERROR: Scene transaction allocation failed");
          #endif
              return false;
            }
            Scene* loaded = scratch.get();
            clearSceneData(*loaded);
          '''.replace('          ', '')
          text = text[:load_start] + load + text[load_end:]
          p.write_text(text, encoding='utf-8')

          p = Path('GroovePuter.ino')
          text = p.read_text(encoding='utf-8')
          if text.count('fixed internal Cardputer ADV heap.') != 2:
              raise SystemExit('unexpected Cardputer heap comment count')
          p.write_text(text.replace('fixed internal Cardputer ADV heap.',
                                    'DRAM-only Cardputer ADV heap.', 2),
                       encoding='utf-8')
          PY

          python3 tests/test_cardputer_dram_storage_source_regressions.py
          git diff --check

      - name: Commit source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GroovePuter.ino scenes.cpp scenes.h scripts/build.sh \
            scripts/build_seqtrak_midi_only.sh src/audio/pattern_paging.cpp \
            src/dsp/miniacid_engine.cpp tests/test_cardputer_dram_storage_source_regressions.py \
            docs/stages/CARDPUTER_FIXED_DRAM_SCENE_STORAGE.md
          git commit -m "fix: allocate Scene storage without PSRAM"
          git push origin HEAD:agent/fix-cardputer-dram-scene-storage
