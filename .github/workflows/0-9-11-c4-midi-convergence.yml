name: 0.9.11 C4 MIDI Final Gate

on:
  push:
    branches:
      - feature/20260913-c4-midi-convergence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-c4-midi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove C4 production lineage
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a619f8e7f418b25a7325f7abc6909f8c9ade0b36 HEAD

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-gfx-dev pkg-config

      - name: Focused C4 MIDI ingress and lifecycle contracts
        run: bash tests/run_0_9_11_c4_midi_convergence_tests.sh

      - name: Existing host and MIDI preservation matrix
        run: bash tests/run_host_tests.sh

      - name: Stage15 tonal integration preservation
        run: bash tests/run_stage15_tonal_integration_tests.sh

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install pinned M5Stack dependencies
        run: bash scripts/install_arduino_deps.sh

      - name: Build Cardputer ADV product image
        shell: bash
        run: |
          set -euo pipefail
          BUILD_PATH="${GITHUB_WORKSPACE}/build/c4-cardputer-product" \
            bash scripts/build_cardputer_memory_baseline.sh normal product --warnings all

      - name: Enforce Cardputer DRAM budget
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check_cardputer_dram_budget.sh \
            "${GITHUB_WORKSPACE}/build/c4-cardputer-product/GroovePuter.ino.elf"

      - name: Prove verification did not mutate tracked source
        run: |
          set -euo pipefail
          git diff --exit-code
