name: Apply synth parameter tabs

on:
  push:
    branches:
      - agent/compact-synth-controls

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply MAIN MORE tabs
        run: python3 tools/agent_synth_param_tabs.py

      - name: Run host regressions
        run: bash tests/run_host_tests.sh

      - name: Publish tested tabbed UI
        run: |
          git config user.name "openai-coding-agent"
          git config user.email "openai-coding-agent@users.noreply.github.com"
          git rm .github/workflows/agent-synth-param-tabs.yml
          git rm tools/agent_synth_param_tabs.py
          git add src/ui/pages/tb303_params_page.h \
                  src/ui/pages/tb303_params_page.cpp \
                  tests/test_wavemorph_performance_source_regressions.py \
                  docs/stages/COMPACT_SYNTH_CONTROLS_STAGE.md
          git commit -m "ui: split synth parameters into main and more tabs"
          git push origin HEAD:agent/compact-synth-controls
