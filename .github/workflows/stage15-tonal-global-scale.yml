name: Stage 15 tonal global scale

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  global-scale-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve global scale across harmonic event roots
        env:
          ASAN_OPTIONS: "detect_leaks=0"
        run: bash tests/run_tonal_materializer_global_scale_test.sh
