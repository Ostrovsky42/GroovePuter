name: Apply SMF velocity boost range from PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/smf-velocity-boost-range
          fetch-depth: 0

      - name: Apply focused patch
        run: python3 .github/scripts/apply_smf_velocity_boost_range.py

      - name: Run host tests
        run: bash tests/run_host_tests.sh

      - name: Commit clean feature branch
        shell: bash
        run: |
          rm -f .github/workflows/apply-smf-velocity-boost-range.yml
          rm -f .github/workflows/apply-smf-velocity-boost-range-pr.yml
          rm -f .github/scripts/apply_smf_velocity_boost_range.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: extend SMF velocity boost to +48"
          git push origin HEAD:feature/smf-velocity-boost-range
