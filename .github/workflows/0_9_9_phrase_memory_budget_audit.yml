name: 0.9.9 PMB-A1 phrase memory budget audit

on:
  push:
    branches:
      - research/20260830-01-0.9.9-phrase-memory-budget-audit
  pull_request:
    branches:
      - agent/20260828-09-0.9.9-ui-final-product-pass

jobs:
  memory-budget-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install SDL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libsdl2-dev \
            libsdl2-gfx-dev
      - name: Run PMB-A1 memory budget audit gate
        run: bash tests/run_0_9_9_phrase_memory_budget_audit_tests.sh
