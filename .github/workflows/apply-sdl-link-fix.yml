name: Apply guarded SDL paging link fix

on:
  push:
    branches:
      - agent/fix-core-reliability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-core-reliability
          fetch-depth: 0
      - name: Add paging implementation to SDL sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('platform_sdl/Makefile')
          text = path.read_text(encoding='utf-8')
          old = "\t../src/audio/wasm_audio_recorder.cpp \\\n"
          new = old + "\t../src/audio/pattern_paging.cpp \\\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected one insertion point, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit link fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform_sdl/Makefile
          git commit -m "fix: link pattern paging in SDL target"
          git push origin HEAD:agent/fix-core-reliability
