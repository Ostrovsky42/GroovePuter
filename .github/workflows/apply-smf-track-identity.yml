name: Apply SMF track identity

on:
  push:
    branches:
      - feature/midi-lifecycle-panel-performance
    paths:
      - .github/workflows/apply-smf-track-identity.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/midi-lifecycle-panel-performance
          fetch-depth: 0

      - name: Configure identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Carry track identity through queue
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/midi/scheduled_smf_midi_event_queue.h")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "                       uint16_t frameOffset,\n                       uint32_t projectTransportEpoch = 0) {",
              "                       uint16_t frameOffset,\n                       uint32_t projectTransportEpoch = 0,\n                       uint8_t trackIndex = 0) {",
              1,
          )
          text = text.replace(
              "                                 frameOffset,\n                                 projectTransportEpoch));",
              "                                 frameOffset,\n                                 projectTransportEpoch,\n                                 trackIndex));",
              1,
          )
          text = text.replace(
              "                        uint16_t frameOffset,\n                        uint32_t projectTransportEpoch = 0) {",
              "                        uint16_t frameOffset,\n                        uint32_t projectTransportEpoch = 0,\n                        uint8_t trackIndex = 0) {",
              1,
          )
          text = text.replace(
              "                              frameOffset,\n                              projectTransportEpoch))) {",
              "                              frameOffset,\n                              projectTransportEpoch,\n                              trackIndex))) {",
              1,
          )
          text = text.replace(
              "                                    uint16_t frameOffset,\n                                    uint32_t projectTransportEpoch) {",
              "                                    uint16_t frameOffset,\n                                    uint32_t projectTransportEpoch,\n                                    uint8_t trackIndex) {",
              1,
          )
          text = text.replace(
              "        event.velocity = velocity;\n        event.blockSequence = blockSequence;",
              "        event.velocity = velocity;\n        event.trackIndex = trackIndex > 63u ? 63u : trackIndex;\n        event.blockSequence = blockSequence;",
              1,
          )

          required = [
              "uint8_t trackIndex = 0",
              "event.trackIndex = trackIndex > 63u ? 63u : trackIndex;",
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f"track queue patch incomplete: {token}")
          path.write_text(text, encoding="utf-8")

          test = Path("tests/test_scheduled_smf_midi_event_queue.cpp")
          source = test.read_text(encoding="utf-8")
          source = source.replace(
              "    assert(queue.tryPushNoteOn(8, 64, 127, 42, 511));",
              "    assert(queue.tryPushNoteOn(8, 64, 127, 42, 511, 0, 37));",
              1,
          )
          source = source.replace(
              "    assert(event.velocity == 127);\n    assert(event.blockSequence == 42);",
              "    assert(event.velocity == 127);\n    assert(event.trackIndex == 37);\n    assert(event.blockSequence == 42);",
              1,
          )
          source = source.replace(
              "    assert(queue.tryPushNoteOff(3, 72, 12, 50, 10));",
              "    assert(queue.tryPushNoteOff(3, 72, 12, 50, 10, 0, 99));",
              1,
          )
          source = source.replace(
              "    assert(event.type == ScheduledSmfMidiEventType::NoteOff);\n    assert(event.generation == 3);",
              "    assert(event.type == ScheduledSmfMidiEventType::NoteOff);\n    assert(event.trackIndex == 63);\n    assert(event.generation == 3);",
              1,
          )
          test.write_text(source, encoding="utf-8")
          PY

      - name: Run host regressions
        run: bash tests/run_host_tests.sh

      - name: Commit implementation
        run: |
          git add src/midi/scheduled_smf_midi_event.h src/midi/scheduled_smf_midi_event_queue.h tests/test_scheduled_smf_midi_event_queue.cpp
          git commit -m "feat(midi): carry bounded SMF track identity"

      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/apply-smf-track-identity.yml
          git commit -m "chore: remove SMF track identity workflow"

      - name: Push branch
        run: git push origin HEAD:feature/midi-lifecycle-panel-performance
