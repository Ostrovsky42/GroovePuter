name: One-shot Generate help update

on:
  push:
    branches:
      - agent/remove-genre-manager

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[help-two-page-done]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-genre-manager
      - name: Update help numbering
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          sed -i 's/=== GENRE 1\/3 ===/=== GENRE 1\/2 ===/g; s/=== FEEL 2\/3 ===/=== FEEL 2\/2 ===/g' src/ui/global_help_content.h
          rm -f .github/workflows/tmp-help-two-page.yml
          git add -A
          git commit -m 'docs: show two-page Generate help [help-two-page-done]'
          git push origin HEAD:agent/remove-genre-manager
