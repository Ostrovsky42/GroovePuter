name: Four-axis UI

on:
  push:
    branches:
      - dev
    paths:
      - 'src/dsp/atlas_runtime.*'
      - 'src/dsp/genre_manager.cpp'
      - 'src/dsp/genre_materializer.h'
      - 'src/dsp/genre_sparse_repair.h'
      - 'src/dsp/genre_variant_catalog.h'
      - 'src/generated/rec_*.generated.h'
      - 'src/ui/axis_page_palette.h'
      - 'src/ui/pages/genre_page.*'
      - 'src/ui/pages/feel_page.*'
      - 'src/ui/pages/song_page.*'
      - 'src/ui/ui_input.h'
      - 'src/ui/workflow_mode.h'
      - 'src/ui/global_help_content.h'
      - 'src/state/ui_session_state.h'
      - 'tests/test_atlas_runtime.cpp'
      - 'tests/test_four_axis_ui_source_regressions.py'
      - 'tests/test_axis_hardware_feedback_source_regressions.py'
      - 'tests/test_global_help_content.cpp'
      - 'tests/test_ui_session_state.cpp'
      - 'tools/atlas/**'
      - 'docs/research/GROOVE_MODEL_*.md'
      - 'docs/stages/FOUR_AXIS_GENERATE_UI.md'
      - 'docs/stages/GENRE_VARIANT_CORRECTNESS.md'
      - '.github/workflows/four-axis-ui.yml'
  pull_request:
    paths:
      - 'src/dsp/atlas_runtime.*'
      - 'src/dsp/genre_manager.cpp'
      - 'src/dsp/genre_materializer.h'
      - 'src/dsp/genre_sparse_repair.h'
      - 'src/dsp/genre_variant_catalog.h'
      - 'src/generated/rec_*.generated.h'
      - 'src/ui/axis_page_palette.h'
      - 'src/ui/pages/genre_page.*'
      - 'src/ui/pages/feel_page.*'
      - 'src/ui/pages/song_page.*'
      - 'src/ui/ui_input.h'
      - 'src/ui/workflow_mode.h'
      - 'src/ui/global_help_content.h'
      - 'src/state/ui_session_state.h'
      - 'tests/test_atlas_runtime.cpp'
      - 'tests/test_four_axis_ui_source_regressions.py'
      - 'tests/test_axis_hardware_feedback_source_regressions.py'
      - 'tests/test_global_help_content.cpp'
      - 'tests/test_ui_session_state.cpp'
      - 'tools/atlas/**'
      - 'docs/research/GROOVE_MODEL_*.md'
      - 'docs/stages/FOUR_AXIS_GENERATE_UI.md'
      - 'docs/stages/GENRE_VARIANT_CORRECTNESS.md'
      - '.github/workflows/four-axis-ui.yml'

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check generate-axis ownership
        run: |
          python3 tests/test_four_axis_ui_source_regressions.py
          if test -f tests/test_axis_hardware_feedback_source_regressions.py; then
            python3 tests/test_axis_hardware_feedback_source_regressions.py
          fi

      - name: Build GENERATE pages
        run: |
          mkdir -p build/host-tests/four-axis
          COMMON_FLAGS='-std=c++17 -Wall -Wextra -Werror -Wno-c++20-extensions -I. -Iplatform_sdl -include platform_sdl/arduino_compat.h'
          g++ ${COMMON_FLAGS} -c src/ui/pages/genre_page.cpp \
            -o build/host-tests/four-axis/genre_page.o
          g++ ${COMMON_FLAGS} -c src/ui/pages/feel_page.cpp \
            -o build/host-tests/four-axis/feel_page.o

      - name: Build and run navigation/help tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I. \
            tests/test_global_help_content.cpp \
            -o build/host-tests/four-axis/test_global_help_content
          g++ -std=c++17 -Wall -Wextra -Werror -I. \
            tests/test_ui_session_state.cpp \
            -o build/host-tests/four-axis/test_ui_session_state
          build/host-tests/four-axis/test_global_help_content
          build/host-tests/four-axis/test_ui_session_state