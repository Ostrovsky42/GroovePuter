name: Stage 15 tonal baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare frozen legacy tonal fingerprints
        run: |
          mkdir -p build/host-tests
          bash tests/run_stage15_tonal_baseline_dump.sh > build/host-tests/stage15_tonal_legacy_actual.tsv
          test "$(wc -l < build/host-tests/stage15_tonal_legacy_actual.tsv)" -eq 257
          diff -u tests/data/stage15_tonal_legacy_baseline.tsv build/host-tests/stage15_tonal_legacy_actual.tsv
      - name: Compare frozen tonal-materialized fingerprints
        run: |
          mkdir -p build/host-tests
          bash tests/run_stage15_tonal_baseline_dump.sh --tonal > build/host-tests/stage15_tonal_enabled_actual.tsv
          test "$(wc -l < build/host-tests/stage15_tonal_enabled_actual.tsv)" -eq 257
          if [[ ! -f tests/data/stage15_tonal_enabled_baseline.tsv ]]; then
            echo "BOOTSTRAP_STAGE15_TONAL_ENABLED_BASELINE"
            cat build/host-tests/stage15_tonal_enabled_actual.tsv
            exit 1
          fi
          diff -u tests/data/stage15_tonal_enabled_baseline.tsv build/host-tests/stage15_tonal_enabled_actual.tsv
