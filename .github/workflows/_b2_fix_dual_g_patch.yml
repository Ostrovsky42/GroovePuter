name: temporary B2 dual G ownership patch

on:
  push:
    branches:
      - feature/0.9.9-b2-pattern-generation-owner

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.9.9-b2-pattern-generation-owner

      - name: Patch dual Pattern G ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/ui/pages/pattern_edit_page.cpp")
          s = p.read_text()
          old = (
              "    auto& owner = GroovePuterUndo::undoOwner();\n"
              "    if (owner.kind() == UndoKind::Generation &&\n"
              "        owner.payloadSize() == sizeof(SynthPatternUndoPayload)) {\n"
          )
          insert = (
              "    auto& owner = GroovePuterUndo::undoOwner();\n"
              "    // Plain G uses the B1 quantized-generation receipt. Handle that exact\n"
              "    // larger payload first; the legacy/fallback G path below uses the compact\n"
              "    // SynthPattern receipt. Size discrimination prevents cross-decoding.\n"
              "    if (owner.kind() == UndoKind::Generation &&\n"
              "        owner.payloadSize() == GroovePuterRhythm::quantizedGenerationUndoPayloadSize()) {\n"
              "      const UndoResult result =\n"
              "          GroovePuterRhythm::undoLastQuantizedGeneration(mini_acid_);\n"
              "      switch (result) {\n"
              "        case UndoResult::Restored:\n"
              "          UI::showToast(\"UNDO: GENERATION\", 900);\n"
              "          return true;\n"
              "        case UndoResult::NothingToUndo:\n"
              "          UI::showToast(\"NOTHING TO UNDO\", 800);\n"
              "          return true;\n"
              "        case UndoResult::TargetUnavailable:\n"
              "          UI::showToast(\"UNDO: RETURN PAGE\", 1000);\n"
              "          return true;\n"
              "        case UndoResult::Expired:\n"
              "          UI::showToast(\"UNDO EXPIRED\", 900);\n"
              "          return true;\n"
              "        case UndoResult::KindMismatch:\n"
              "        default:\n"
              "          return false;\n"
              "      }\n"
              "    }\n"
              "    if (owner.kind() == UndoKind::Generation &&\n"
              "        owner.payloadSize() == sizeof(SynthPatternUndoPayload)) {\n"
          )
          if old not in s:
              raise SystemExit("B2 undo discriminator anchor not found")
          s = s.replace(old, insert, 1)
          old_mark = (
              "    if (result == QuantizedGenerationResult::CommittedNow)\n"
              "      GroovePuterState::markSceneMutated();\n\n"
              "    const char* label = \"GEN FAILED\";\n"
          )
          new_mark = (
              "    // B1 commitPrepared() is the sole persistent revision owner. Do not\n"
              "    // advance Scene revision again here for CommittedNow.\n\n"
              "    const char* label = \"GEN FAILED\";\n"
          )
          if old_mark not in s:
              raise SystemExit("plain G duplicate revision anchor not found")
          s = s.replace(old_mark, new_mark, 1)
          p.write_text(s)
          PY

      - name: Commit production fix
        run: |
          if git diff --quiet -- src/ui/pages/pattern_edit_page.cpp; then
            echo "No production patch needed"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ui/pages/pattern_edit_page.cpp
          git commit -m "fix: complete dual Pattern G generation ownership"
          git push origin HEAD:feature/0.9.9-b2-pattern-generation-owner
