name: R9 history hardware fix bootstrap

on:
  push:
    branches:
      - agent/20260817-0.9.8-r8-global-ctrl-z

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply accepted generation owner source delta
        run: |
          git fetch origin dev_0.9.9
          git diff d6db59c1fe3ddee0e9d611807508d6e44010e729^ d6db59c1fe3ddee0e9d611807508d6e44010e729 -- \
            src/generation/migration/quantized_generation_commit.h \
            src/generation/migration/quantized_generation_undo_owner_impl.h \
            src/ui/pages/genre_page.cpp | git apply --3way

      - name: Apply R9 one-slot history and hardware fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {actual}: {old[:80]!r}")
              p.write_text(text.replace(old, new, count))

          # Reuse the padding byte in BoundedUndoSlot for direction. This keeps
          # the authoritative UndoOwner within its existing fixed DRAM ceiling.
          patch('src/state/bounded_undo_slot.h',
                '  uint16_t payloadSize() const { return payload_size_; }\n',
                '  uint16_t payloadSize() const { return payload_size_; }\n'
                '  bool nextIsRedo() const { return next_is_redo_; }\n'
                '  void setNextIsRedo(bool redo) { next_is_redo_ = redo; }\n')
          patch('src/state/bounded_undo_slot.h',
                '    payload_size_ = static_cast<uint16_t>(sizeof(Payload));\n'
                '    kind_ = kind;\n'
                '    return true;\n',
                '    payload_size_ = static_cast<uint16_t>(sizeof(Payload));\n'
                '    kind_ = kind;\n'
                '    next_is_redo_ = false;\n'
                '    return true;\n')
          patch('src/state/bounded_undo_slot.h',
                '    revision_before_ = GroovePuterState::SceneRevisionState{};\n'
                '  }\n',
                '    revision_before_ = GroovePuterState::SceneRevisionState{};\n'
                '    next_is_redo_ = false;\n'
                '  }\n')
          patch('src/state/bounded_undo_slot.h',
                '  UndoKind kind_{UndoKind::None};\n',
                '  UndoKind kind_{UndoKind::None};\n'
                '  bool next_is_redo_{false};\n')

          # Byte-wise exchange avoids a second full Song/Generation-sized stack
          # temporary. One retained payload remains the only history storage.
          patch('src/state/undo_owner.h',
                'enum class UndoResult : uint8_t {\n'
                '  NothingToUndo = 0,\n'
                '  KindMismatch,\n'
                '  TargetUnavailable,\n'
                '  Expired,\n'
                '  Restored,\n'
                '};\n',
                'enum class UndoResult : uint8_t {\n'
                '  NothingToUndo = 0,\n'
                '  KindMismatch,\n'
                '  TargetUnavailable,\n'
                '  Expired,\n'
                '  Restored,\n'
                '};\n\n'
                'template <typename T>\n'
                'inline void exchangeFixedValue(T& live, T& retained) {\n'
                '  static_assert(std::is_trivially_copyable<T>::value,\n'
                '                "history exchange requires fixed trivially-copyable values");\n'
                '  auto* lhs = reinterpret_cast<uint8_t*>(&live);\n'
                '  auto* rhs = reinterpret_cast<uint8_t*>(&retained);\n'
                '  for (std::size_t i = 0; i < sizeof(T); ++i) {\n'
                '    const uint8_t value = lhs[i];\n'
                '    lhs[i] = rhs[i];\n'
                '    rhs[i] = value;\n'
                '  }\n'
                '}\n')
          patch('src/state/undo_owner.h',
                '  uint32_t committedRevision() const { return committed_revision_; }\n',
                '  uint32_t committedRevision() const { return committed_revision_; }\n'
                '  bool nextIsRedo() const { return slot_.nextIsRedo(); }\n')
          marker = '  template <typename Payload, typename ValidateFn, typename RestoreFn>\n  UndoResult undoPrepared('
          idx = Path('src/state/undo_owner.h').read_text().find(marker)
          if idx < 0:
              raise SystemExit('undo_owner.h: undoPrepared marker missing')
          insert_at = Path('src/state/undo_owner.h').read_text().find('\n private:', idx)
          text = Path('src/state/undo_owner.h').read_text()
          toggle = r'''

  // One-step history toggle. The retained target payload is exchanged with the
  // live state in-place, then the same fixed slot stores the reverse transition.
  // No second resident payload and no second full-size stack object are created.
  template <typename Payload, typename ValidateFn, typename ExchangeFn>
  UndoResult togglePrepared(UndoKind expected_kind,
                            ValidateFn&& validate,
                            ExchangeFn&& exchange) {
    static_assert(std::is_trivially_copyable<Payload>::value,
                  "Undo payloads must remain trivially copyable fixed values");
    if (!slot_.hasUndo()) return UndoResult::NothingToUndo;
    if (slot_.kind() != expected_kind) return UndoResult::KindMismatch;

    const GroovePuterState::SceneRevisionState current =
        GroovePuterState::sceneRevisionSnapshot();
    if (committed_revision_ == 0 || current.currentRevision != committed_revision_) {
      clear();
      return UndoResult::Expired;
    }

    Payload retained{};
    if (!slot_.read(expected_kind, retained)) return UndoResult::KindMismatch;
    if (!std::forward<ValidateFn>(validate)(retained)) {
      return UndoResult::TargetUnavailable;
    }

    const bool was_redo = slot_.nextIsRedo();
    const GroovePuterState::SceneRevisionState target_revision =
        slot_.revisionBefore();
    std::forward<ExchangeFn>(exchange)(retained);

    GroovePuterState::SceneRevisionState restored_revision = target_revision;
    if (current.persistedRevision == committed_revision_) {
      restored_revision.persistedRevision = current.persistedRevision;
    }
    GroovePuterState::restoreSceneRevision(restored_revision);

    // Same admitted payload size/kind, so publication cannot fail here. The
    // retained value now contains the state we just left and current is the
    // revision to restore on the inverse keypress.
    if (!slot_.publish(expected_kind, retained, current)) {
      clear();
      return UndoResult::Expired;
    }
    slot_.setNextIsRedo(!was_redo);
    committed_revision_ = restored_revision.currentRevision;
    return UndoResult::Restored;
  }
'''
          text = text[:insert_at] + toggle + text[insert_at:]
          Path('src/state/undo_owner.h').write_text(text)

