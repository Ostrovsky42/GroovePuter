name: Apply MIDI lifecycle stage

on:
  push:
    branches:
      - feature/midi-lifecycle-panel-performance
    paths:
      - .github/workflows/apply-midi-lifecycle-stage.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/midi-lifecycle-panel-performance
          fetch-depth: 0

      - name: Configure identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Wire Continue into dispatcher
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/platform/cardputer_usb_midi_transport.cpp")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "constexpr uint8_t kStatusStart = 0xFA;\nconstexpr uint8_t kStatusStop = 0xFC;",
                  "constexpr uint8_t kStatusStart = 0xFA;\nconstexpr uint8_t kStatusContinue = 0xFB;\nconstexpr uint8_t kStatusStop = 0xFC;",
              ),
              (
                  "    uint32_t startSent{0};\n    uint32_t stopSent{0};",
                  "    uint32_t startSent{0};\n    uint32_t continueSent{0};\n    uint32_t stopSent{0};",
              ),
              (
                  "        case MidiTransportEventType::Stop:\n            sent = g_transport.sendStop();",
                  "        case MidiTransportEventType::Continue:\n            sent = g_transport.sendContinue();\n            if (sent) {\n                ++g_diagnostics.continueSent;\n            } else {\n                ++g_diagnostics.transportSendFailures;\n            }\n            break;\n        case MidiTransportEventType::Stop:\n            sent = g_transport.sendStop();",
              ),
              (
                  '        "clockSent=%u clockLate=%u clockDropped=%u start=%u stop=%u "',
                  '        "clockSent=%u clockLate=%u clockDropped=%u start=%u continue=%u stop=%u "',
              ),
              (
                  "        static_cast<unsigned>(g_diagnostics.startSent),\n        static_cast<unsigned>(g_diagnostics.stopSent),",
                  "        static_cast<unsigned>(g_diagnostics.startSent),\n        static_cast<unsigned>(g_diagnostics.continueSent),\n        static_cast<unsigned>(g_diagnostics.stopSent),",
              ),
              (
                  "    if (status != kStatusTimingClock &&\n        status != kStatusStart &&\n        status != kStatusStop) {",
                  "    if (status != kStatusTimingClock &&\n        status != kStatusStart &&\n        status != kStatusContinue &&\n        status != kStatusStop) {",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"expected dispatcher block not found: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

          test = Path("tests/test_midi_transport_source_regressions.py")
          source = test.read_text(encoding="utf-8")
          source = source.replace(
              '            "Clock" in event_header and "Start" in event_header and "Stop" in event_header,\n            "transport events need a dedicated Clock/Start/Stop model")',
              '            "Clock" in event_header and "Start" in event_header and\n            "Continue" in event_header and "Stop" in event_header,\n            "transport events need a dedicated Clock/Start/Continue/Stop model")',
              1,
          )
          source = source.replace(
              '    require("sendTimingClock() override" in transport_h and\n            "sendStart() override" in transport_h and\n            "sendStop() override" in transport_h,\n            "Cardputer transport must retain the accepted realtime surface")',
              '    require("sendTimingClock() override" in transport_h and\n            "sendStart() override" in transport_h and\n            "sendContinue() override" in transport_h and\n            "sendStop() override" in transport_h and\n            "sendSongPositionPointer(uint16_t sixteenthNotes) override" in transport_h,\n            "Cardputer transport must implement the extended lifecycle surface")',
              1,
          )
          source = source.replace(
              '            "kStatusStart = 0xFA" in transport and\n            "kStatusStop = 0xFC" in transport,',
              '            "kStatusStart = 0xFA" in transport and\n            "kStatusContinue = 0xFB" in transport and\n            "kStatusStop = 0xFC" in transport,',
              1,
          )
          source = source.replace(
              '    require("g_transport.sendTimingClock()" in transport and\n            "g_transport.sendStart()" in transport and\n            "g_transport.sendStop()" in transport,\n            "MidiDispatchTask translation unit must own all accepted realtime USB writes")',
              '    require("g_transport.sendTimingClock()" in transport and\n            "g_transport.sendStart()" in transport and\n            "g_transport.sendContinue()" in transport and\n            "g_transport.sendStop()" in transport,\n            "MidiDispatchTask translation unit must own all realtime USB writes")',
              1,
          )
          test.write_text(source, encoding="utf-8")
          PY

      - name: Run host regressions
        run: bash tests/run_host_tests.sh

      - name: Commit implementation
        run: |
          git add src/platform/cardputer_usb_midi_transport.cpp tests/test_midi_transport_source_regressions.py
          git commit -m "feat(midi): dispatch sample-timed Continue"

      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/apply-midi-lifecycle-stage.yml
          git commit -m "chore: remove MIDI lifecycle patch workflow"

      - name: Push branch
        run: git push origin HEAD:feature/midi-lifecycle-panel-performance
