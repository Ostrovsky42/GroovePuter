name: Apply Groovebox RNG domains

on:
  push:
    branches:
      - agent/groovebox-rng-domains

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/groovebox-rng-domains
          fetch-depth: 0

      - name: Apply scoped RNG migration
        run: python3 .github/scripts/apply_groovebox_rng_domains.py

      - name: Check patch shape
        run: |
          python3 tests/test_generation_rng_source_regressions.py
          git diff --check

      - name: Run host tests
        run: bash tests/run_host_tests.sh

      - name: Remove one-shot patch machinery
        run: |
          rm -f .github/scripts/apply_groovebox_rng_domains.py
          rm -f .github/workflows/apply-groovebox-rng-domains.yml

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: isolate groovebox generation RNG domains"
          git push origin HEAD:agent/groovebox-rng-domains
