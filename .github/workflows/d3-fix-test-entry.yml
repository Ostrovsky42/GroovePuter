name: D3 fix test entry
on:
  push:
    branches:
      - 'agent/20260821-03-0.9.9-d3-song-live-arrangement'
    paths:
      - 'tools/d3_fix_test_entry.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/20260821-03-0.9.9-d3-song-live-arrangement
          fetch-depth: 0
      - run: python3 tools/d3_fix_test_entry.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm tools/d3_fix_test_entry.py .github/workflows/d3-fix-test-entry.yml
          git add -- src/generation/migration/live_song_arrangement_activation.h tests/test_song_phrase_edit_0_9_8_r4_source_regressions.py tools/d3_fix_test_entry.py .github/workflows/d3-fix-test-entry.yml
          git commit -m 'fix(d3): close compile and inherited R4 gates'
          git push origin HEAD:agent/20260821-03-0.9.9-d3-song-live-arrangement
