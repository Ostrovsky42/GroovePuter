name: 0.9.10 UI Constitution V1

on:
  push:
    branches:
      - feature/20260906-04-0.9.10-ui-constitution-v1
    paths:
      - 'src/ui/**'
      - 'tests/test_ui_constitution_u1a_*'
      - 'tests/test_ui_constitution_u1b_*'
      - 'tests/test_ui_constitution_u1c_*'
      - 'tests/test_ui_constitution_u1d_*'
      - 'tests/test_ui_constitution_u1e_*'
      - 'tests/test_ui_status_chrome_source_regressions.py'
      - 'tests/run_ui_constitution_u1a_tests.sh'
      - 'tests/run_ui_constitution_u1b_tests.sh'
      - 'tests/run_ui_constitution_u1c_tests.sh'
      - 'tests/run_ui_constitution_u1d_tests.sh'
      - 'tests/run_ui_constitution_u1e_tests.sh'
      - 'docs/contracts/0_9_10_UI_CONSTITUTION_V1.md'
      - 'docs/contracts/0_9_10_UI_CONSTITUTION_V1_RESOURCE_LAW.md'
      - 'docs/audits/0_9_10_UI_CONSTITUTION_U0_BASELINE.md'
      - 'docs/audits/0_9_10_UI_CONSTITUTION_U1A_EVIDENCE.md'
      - 'docs/audits/0_9_10_UI_CONSTITUTION_U1B_EVIDENCE.md'
      - 'docs/audits/0_9_10_UI_CONSTITUTION_U1C_EVIDENCE.md'
      - 'docs/audits/0_9_10_UI_CONSTITUTION_U1D_EVIDENCE.md'
      - 'docs/audits/0_9_10_UI_CONSTITUTION_U1E_EVIDENCE.md'
      - 'docs/superpowers/plans/2026-09-06-ui-constitution-u1c-frame-status-snapshot.md'
      - 'docs/superpowers/plans/2026-09-06-ui-constitution-u1d-renderer-residency-continuity.md'
      - 'docs/superpowers/plans/2026-09-06-ui-constitution-u1e-pixel-zone-geometry.md'
      - '.github/workflows/0_9_10_ui_constitution_v1.yml'
  pull_request:
    paths:
      - 'src/ui/**'
      - 'tests/test_ui_constitution_u1a_*'
      - 'tests/test_ui_constitution_u1b_*'
      - 'tests/test_ui_constitution_u1c_*'
      - 'tests/test_ui_constitution_u1d_*'
      - 'tests/test_ui_constitution_u1e_*'
      - 'tests/test_ui_status_chrome_source_regressions.py'
      - 'tests/run_ui_constitution_u1a_tests.sh'
      - 'tests/run_ui_constitution_u1b_tests.sh'
      - 'tests/run_ui_constitution_u1c_tests.sh'
      - 'tests/run_ui_constitution_u1d_tests.sh'
      - 'tests/run_ui_constitution_u1e_tests.sh'
      - 'docs/contracts/0_9_10_UI_CONSTITUTION_V1.md'
      - 'docs/contracts/0_9_10_UI_CONSTITUTION_V1_RESOURCE_LAW.md'
      - 'docs/audits/0_9_10_UI_CONSTITUTION_U0_BASELINE.md'
      - 'docs/audits/0_9_10_UI_CONSTITUTION_U1A_EVIDENCE.md'
      - 'docs/audits/0_9_10_UI_CONSTITUTION_U1B_EVIDENCE.md'
      - 'docs/audits/0_9_10_UI_CONSTITUTION_U1C_EVIDENCE.md'
      - 'docs/audits/0_9_10_UI_CONSTITUTION_U1D_EVIDENCE.md'
      - 'docs/audits/0_9_10_UI_CONSTITUTION_U1E_EVIDENCE.md'
      - 'docs/superpowers/plans/2026-09-06-ui-constitution-u1c-frame-status-snapshot.md'
      - 'docs/superpowers/plans/2026-09-06-ui-constitution-u1d-renderer-residency-continuity.md'
      - 'docs/superpowers/plans/2026-09-06-ui-constitution-u1e-pixel-zone-geometry.md'
      - '.github/workflows/0_9_10_ui_constitution_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  u1a-semantic-location:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run U1A focused gate
        shell: bash
        run: |
          set -o pipefail
          bash tests/run_ui_constitution_u1a_tests.sh 2>&1 | tee ui-constitution-u1a.log

      - name: Upload focused gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-constitution-u1a-log
          path: ui-constitution-u1a.log
          if-no-files-found: error

  u1b-source-transport-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run U1B focused gate
        shell: bash
        run: |
          set -o pipefail
          bash tests/run_ui_constitution_u1b_tests.sh 2>&1 | tee ui-constitution-u1b.log

      - name: Upload U1B focused gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-constitution-u1b-log
          path: ui-constitution-u1b.log
          if-no-files-found: error

  u1c-coherent-frame-status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run U1C focused gate
        shell: bash
        run: |
          set -o pipefail
          bash tests/run_ui_constitution_u1c_tests.sh 2>&1 | tee ui-constitution-u1c.log

      - name: Upload U1C focused gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-constitution-u1c-log
          path: ui-constitution-u1c.log
          if-no-files-found: error

  u1d-renderer-residency-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run U1D focused gate
        shell: bash
        run: |
          set -o pipefail
          bash tests/run_ui_constitution_u1d_tests.sh 2>&1 | tee ui-constitution-u1d.log

      - name: Upload U1D focused gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-constitution-u1d-log
          path: ui-constitution-u1d.log
          if-no-files-found: error

  u1e-pixel-zone-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run U1E focused gate
        shell: bash
        run: |
          set -o pipefail
          bash tests/run_ui_constitution_u1e_tests.sh 2>&1 | tee ui-constitution-u1e.log

      - name: Upload U1E focused gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-constitution-u1e-log
          path: ui-constitution-u1e.log
          if-no-files-found: error

  preserve-p3-u1-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            libsdl2-dev \
            libsdl2-gfx-dev \
            pkg-config

      - name: Run inherited P3-U1 focused gate
        shell: bash
        run: |
          set -o pipefail
          bash tests/run_pattern_phrase_p3_u1_tests.sh 2>&1 | tee p3-u1-preservation.log

      - name: Upload preservation gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-u1-preservation-log
          path: p3-u1-preservation.log
          if-no-files-found: error
