name: Project pattern host

on:
  pull_request:
    paths:
      - "src/audio/pattern_paging.cpp"
      - "src/audio/pattern_paging.h"
      - "src/pattern/pattern_address.h"
      - "scene_storage_cardputer.cpp"
      - "platform_sdl/scene_storage_sdl.cpp"
      - "src/ui/components/pattern_selection_bar.cpp"
      - "src/ui/components/bank_selection_bar.cpp"
      - "src/ui/pages/project_page.h"
      - "tests/test_pattern_paging.cpp"
      - "tests/test_pattern_address.cpp"
      - ".github/workflows/project-pattern-host.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run pattern paging tests
        shell: bash
        run: |
          cat > /tmp/pattern_paging_scratch.cpp <<'CPP'
          #include "scenes.h"

          Scene& sceneTransactionScratch() {
            static Scene scratch{};
            return scratch;
          }
          CPP

          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I. \
            tests/test_pattern_paging.cpp \
            src/audio/pattern_paging.cpp \
            /tmp/pattern_paging_scratch.cpp \
            -o /tmp/test_pattern_paging
          /tmp/test_pattern_paging

      - name: Build and run pattern address tests
        shell: bash
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I. \
            tests/test_pattern_address.cpp \
            -o /tmp/test_pattern_address
          /tmp/test_pattern_address
