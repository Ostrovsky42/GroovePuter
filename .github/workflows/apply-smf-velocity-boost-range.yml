name: Apply SMF velocity boost range

on:
  push:
    branches:
      - feature/smf-velocity-boost-range
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/smf-velocity-boost-range
          fetch-depth: 0

      - name: Apply focused velocity patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          routing = Path('src/midi/smf_routing.h')
          text = routing.read_text(encoding='utf-8')
          marker = '''inline constexpr uint8_t applySmfVelocityBoost(uint8_t velocity,
                                                uint8_t boost) {
    if (velocity == 0) return 0;
    const uint16_t boosted = static_cast<uint16_t>(velocity) + boost;
    return static_cast<uint8_t>(boosted > 127u ? 127u : boosted);
}
'''
          helper = marker + '''
inline constexpr uint8_t nextSmfVelocityBoost(uint8_t current) {
    switch (current) {
        case 0: return 8;
        case 8: return 16;
        case 16: return 24;
        case 24: return 32;
        case 32: return 48;
        default: return 0;
    }
}
'''
          if 'nextSmfVelocityBoost' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('smf_routing.h: velocity helper insertion point changed')
              routing.write_text(text.replace(marker, helper, 1), encoding='utf-8')

          replace_once(
              'src/platform/cardputer_smf_player.cpp',
              '''        case CommandType::CycleVelocityBoost:
            velocityBoost_ = velocityBoost_ == 0
                ? 8
                : (velocityBoost_ == 8 ? 16 : 0);
''',
              '''        case CommandType::CycleVelocityBoost:
            velocityBoost_ = nextSmfVelocityBoost(velocityBoost_);
''')

          replace_once(
              'src/platform/cardputer_smf_player.cpp',
              '''    tempoScalePermille_ = kSmfOriginalTempoScalePermille;
    velocityBoost_ = 0;
    pausedTick_ = musicStartTick_;
''',
              '''    tempoScalePermille_ = kSmfOriginalTempoScalePermille;
    // Velocity is a player-session preference: keep the selected boost while
    // browsing and loading another file, but still default to +0 after reboot.
    pausedTick_ = musicStartTick_;
''')

          test = Path('tests/test_smf_routing.cpp')
          text = test.read_text(encoding='utf-8')
          anchor = '''    assert(applySmfVelocityBoost(64, 8) == 72);
    assert(applySmfVelocityBoost(120, 16) == 127);
'''
          expanded = '''    assert(applySmfVelocityBoost(64, 8) == 72);
    assert(applySmfVelocityBoost(20, 48) == 68);
    assert(applySmfVelocityBoost(64, 48) == 112);
    assert(applySmfVelocityBoost(96, 48) == 127);
    assert(applySmfVelocityBoost(127, 48) == 127);

    uint8_t boost = 0;
    constexpr uint8_t kExpectedBoosts[] = {8, 16, 24, 32, 48, 0};
    for (uint8_t expected : kExpectedBoosts) {
        boost = nextSmfVelocityBoost(boost);
        assert(boost == expected);
    }
    assert(nextSmfVelocityBoost(7) == 0);
'''
          if 'kExpectedBoosts' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('test_smf_routing.cpp: boost test insertion point changed')
              test.write_text(text.replace(anchor, expanded, 1), encoding='utf-8')

          regression = Path('tests/test_performance_source_regressions.py')
          text = regression.read_text(encoding='utf-8')
          insertion = '''\n\ndef test_smf_velocity_boost_range_is_session_sticky() -> None:\n    routing = (ROOT / "src/midi/smf_routing.h").read_text(encoding="utf-8")\n    player = (ROOT / "src/platform/cardputer_smf_player.cpp").read_text(\n        encoding="utf-8"\n    )\n\n    require("nextSmfVelocityBoost" in routing,\n            "velocity boost cycle must stay in the testable SMF routing core")\n    for value in ("case 0: return 8", "case 8: return 16",\n                  "case 16: return 24", "case 24: return 32",\n                  "case 32: return 48"):\n        require(value in routing,\n                f"velocity boost cycle is missing {value}")\n\n    cycle_start = player.index("case CommandType::CycleVelocityBoost:")\n    cycle = player[cycle_start:player.index("break;", cycle_start)]\n    require("nextSmfVelocityBoost(velocityBoost_)" in cycle,\n            "Cardputer player must use the shared +0..+48 cycle")\n\n    load = player[player.index("bool CardputerSmfPlayerService::loadFile"):\n                  player.index("bool CardputerSmfPlayerService::scanMetadata")]
    require("velocityBoost_ = 0" not in load,\n            "loading another MIDI must keep the session velocity boost")\n'''
          if 'test_smf_velocity_boost_range_is_session_sticky' not in text:
              main_marker = '\n\nif __name__ == "__main__":\n'
              if main_marker not in text:
                  raise SystemExit('test_performance_source_regressions.py: main marker missing')
              text = text.replace(main_marker, insertion + main_marker, 1)
              call_marker = '    test_smf_player_is_additive_and_keeps_single_usb_owner()\n'
              if call_marker not in text:
                  raise SystemExit('test_performance_source_regressions.py: call insertion point missing')
              text = text.replace(call_marker,
                                  call_marker + '    test_smf_velocity_boost_range_is_session_sticky()\n',
                                  1)
              regression.write_text(text, encoding='utf-8')

          doc = Path('docs/stages/SMF_TEMPO_VELOCITY_CONTROLS_STAGE.md')
          text = doc.read_text(encoding='utf-8')
          for old, new in {
              '`V`: cycle velocity boost `+0 -> +8 -> +16 -> +0`;':
                  '`V`: cycle velocity boost `+0 -> +8 -> +16 -> +24 -> +32 -> +48 -> +0`;',
              '`V` cycles `+0 -> +8 -> +16 -> +0`.':
                  '`V` cycles `+0 -> +8 -> +16 -> +24 -> +32 -> +48 -> +0`.',
              '- [ ] `V` cycles `+0/+8/+16/+0`.':
                  '- [ ] `V` cycles `+0/+8/+16/+24/+32/+48/+0`.',
          }.items():
              if old in text:
                  text = text.replace(old, new)
          sticky = '''\nVelocity boost is intentionally session-sticky: loading another MIDI file keeps the selected value. A reboot creates a new player service and restores the safe `+0` default.\n'''
          if 'session-sticky' not in text:
              heading = '\n## Expected behavior\n'
              if heading not in text:
                  raise SystemExit('velocity stage doc: Expected behavior heading missing')
              text = text.replace(heading, sticky + heading, 1)
          doc.write_text(text, encoding='utf-8')
          PY

      - name: Run host tests
        run: bash tests/run_host_tests.sh

      - name: Remove patch workflow and commit
        if: github.event_name == 'push'
        shell: bash
        run: |
          rm -f .github/workflows/apply-smf-velocity-boost-range.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: extend SMF velocity boost to +48"
          git push origin HEAD:feature/smf-velocity-boost-range
