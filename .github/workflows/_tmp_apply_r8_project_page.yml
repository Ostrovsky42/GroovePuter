name: TEMP apply 0.9.7 R8 Project UI patch

on:
  push:
    branches:
      - agent/20260816-0.9.7-device-profile-ui-staging
    paths:
      - tools/_r8_project_page.patch
      - .github/workflows/_tmp_apply_r8_project_page.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply R8 ProjectPage patch
        run: |
          git apply --check tools/_r8_project_page.patch
          git apply tools/_r8_project_page.patch
      - name: Run dedicated R8 contract before publication
        run: bash tests/run_midi_device_profile_ui_0_9_7_tests.sh
      - name: Publish patched tree and remove transport files
        run: |
          git rm tools/_r8_project_page.patch .github/workflows/_tmp_apply_r8_project_page.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "0.9.7-R8 add Device Profile selector UI"
          git push origin HEAD:${GITHUB_REF_NAME}
