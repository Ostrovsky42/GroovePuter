name: Apply Phrase Alt+W shortcut fix

on:
  push:
    branches:
      - experiment/phrase-arranger-stage-2
    paths:
      - '.github/workflows/apply-phrase-shortcut-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/phrase-arranger-stage-2
          fetch-depth: 0

      - name: Apply exact shortcut routing patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          display = Path('src/ui/miniacid_display.cpp')
          text = display.read_text(encoding='utf-8')
          old = """        if (event.alt && (event.key == 'w' || event.key == 'W')) {
                      UI::waveformOverlay.enabled = !UI::waveformOverlay.enabled;
                      return true;
                  }
          """
          new = """        if (event.alt && (event.key == 'w' || event.key == 'W') &&
                      page_index_ != WorkflowPages::kPhrase) {
                      UI::waveformOverlay.enabled = !UI::waveformOverlay.enabled;
                      return true;
                  }
          """
          if text.count(old) != 1:
              raise SystemExit('expected exactly one global Alt+W handler')
          display.write_text(text.replace(old, new), encoding='utf-8')

          phrase = Path('src/ui/pages/phrase_page.cpp')
          text = phrase.read_text(encoding='utf-8')
          replacements = {
              'W:WRITE SH+W:OVER': 'W:WRITE ALT+W:OVER',
              'writeArrangementToCurrentRow(ui_event.shift)':
                  'writeArrangementToCurrentRow(ui_event.alt)',
              'writeToCurrentRow(ui_event.shift)':
                  'writeToCurrentRow(ui_event.alt)',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'missing expected Phrase replacement: {old}')
              text = text.replace(old, new)
          phrase.write_text(text, encoding='utf-8')

          source_test = Path('tests/test_phrase_ui_source_regressions.py')
          text = source_test.read_text(encoding='utf-8')
          marker = 'print("Phrase UI source regressions: PASS")\n'
          checks = '''\n# Alt+W belongs to Phrase while retaining the global overlay elsewhere.\ndisplay_cpp = (ROOT / "src/ui/miniacid_display.cpp").read_text(encoding="utf-8")\nrequire(display_cpp, "page_index_ != WorkflowPages::kPhrase",\n        "Global Alt+W must defer to the Phrase page")\nrequire(CPP, "writeArrangementToCurrentRow(ui_event.alt)",\n        "Phrase Arranger overwrite must use Alt+W")\nrequire(CPP, "writeToCurrentRow(ui_event.alt)",\n        "Phrase Core overwrite must use Alt+W")\nif "SH+W:OVER" in CPP:\n    raise AssertionError("Phrase footer must not advertise the temporary Shift+W mapping")\n\n'''
          if checks not in text:
              if marker not in text:
                  raise SystemExit('Phrase UI source test marker missing')
              text = text.replace(marker, checks + marker)
          source_test.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        run: |
          git rm .github/workflows/apply-phrase-shortcut-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ui/miniacid_display.cpp \
                  src/ui/pages/phrase_page.cpp \
                  tests/test_phrase_ui_source_regressions.py
          git commit -m "Route Alt+W to Phrase overwrite"
          git push origin HEAD:experiment/phrase-arranger-stage-2
