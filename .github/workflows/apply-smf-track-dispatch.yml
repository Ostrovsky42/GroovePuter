name: Apply SMF track dispatch

on:
  push:
    branches:
      - feature/midi-lifecycle-panel-performance
    paths:
      - .github/workflows/apply-smf-track-dispatch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/midi-lifecycle-panel-performance
          fetch-depth: 0

      - name: Configure identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Wire track identity and mute guard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          player = Path("src/platform/cardputer_smf_player.cpp")
          text = player.read_text(encoding="utf-8")
          text = text.replace(
              "                tempoMode_ == SmfTempoMode::Project\n                    ? projectTransport.transportEpoch\n                    : 0u);",
              "                tempoMode_ == SmfTempoMode::Project\n                    ? projectTransport.transportEpoch\n                    : 0u,\n                static_cast<uint8_t>(event.trackIndex));",
              2,
          )
          if text.count("static_cast<uint8_t>(event.trackIndex)") < 2:
              raise SystemExit("failed to wire SMF track index into both queue paths")
          player.write_text(text, encoding="utf-8")

          dispatch = Path("src/platform/cardputer_usb_midi_transport.cpp")
          text = dispatch.read_text(encoding="utf-8")
          include_anchor = '#include "src/midi/smf_late_policy.h"\n'
          if '#include "src/midi/smf_track_mute.h"' not in text:
              text = text.replace(include_anchor,
                                  include_anchor + '#include "src/midi/smf_track_mute.h"\n',
                                  1)
          guard = (
              "            } else if (pendingSmf.type == ScheduledSmfMidiEventType::NoteOn &&\n"
              "                       GroovePuterMidi::smfTrackMuteState().isMuted(\n"
              "                           pendingSmf.trackIndex)) {\n"
              "                ++g_diagnostics.smfStaleGenerationDrops;\n"
              "                clearPendingSmf();\n"
          )
          anchor = (
              "            } else if (pendingSmf.type == ScheduledSmfMidiEventType::NoteOn &&\n"
              "                       !projectSmfNoteOnStillCurrent(pendingSmf)) {\n"
          )
          if anchor not in text:
              raise SystemExit("dispatcher NoteOn recheck anchor missing")
          text = text.replace(anchor, guard + anchor, 1)
          dispatch.write_text(text, encoding="utf-8")

          test = Path("tests/test_performance_source_regressions.py")
          source = test.read_text(encoding="utf-8")
          marker = "def test_smf_player_is_additive_and_keeps_single_usb_owner() -> None:\n"
          addition = '''def test_smf_track_identity_reaches_dispatch_guard() -> None:\n    event = (ROOT / "src/midi/scheduled_smf_midi_event.h").read_text(encoding="utf-8")\n    queue = (ROOT / "src/midi/scheduled_smf_midi_event_queue.h").read_text(encoding="utf-8")\n    player = (ROOT / "src/platform/cardputer_smf_player.cpp").read_text(encoding="utf-8")\n    dispatch = (ROOT / "src/platform/cardputer_usb_midi_transport.cpp").read_text(encoding="utf-8")\n\n    require("uint8_t trackIndex" in event,\n            "scheduled SMF events must retain source track identity")\n    require("event.trackIndex = trackIndex" in queue,\n            "SMF queue must copy bounded source track identity")\n    require(player.count("static_cast<uint8_t>(event.trackIndex)") >= 2,\n            "NoteOn and NoteOff publication must carry source track identity")\n    require("smfTrackMuteState().isMuted" in dispatch and\n            "pendingSmf.trackIndex" in dispatch,\n            "dispatcher must reject queued NoteOn from a newly muted track")\n\n\n'''
          if "def test_smf_track_identity_reaches_dispatch_guard" not in source:
              source = source.replace(marker, addition + marker, 1)
          main_anchor = "    test_smf_player_is_additive_and_keeps_single_usb_owner()\n"
          if "test_smf_track_identity_reaches_dispatch_guard()" not in source.split("if __name__ == \"__main__\":")[-1]:
              source = source.replace(main_anchor,
                                      "    test_smf_track_identity_reaches_dispatch_guard()\n" + main_anchor,
                                      1)
          test.write_text(source, encoding="utf-8")
          PY

      - name: Run host regressions
        run: bash tests/run_host_tests.sh

      - name: Commit implementation
        run: |
          git add src/platform/cardputer_smf_player.cpp src/platform/cardputer_usb_midi_transport.cpp tests/test_performance_source_regressions.py
          git commit -m "feat(midi): guard queued SMF notes by track mute"

      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/apply-smf-track-dispatch.yml
          git commit -m "chore: remove SMF track dispatch workflow"

      - name: Push branch
        run: git push origin HEAD:feature/midi-lifecycle-panel-performance
