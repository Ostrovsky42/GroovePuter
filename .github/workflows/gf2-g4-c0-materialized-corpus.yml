name: GF2 G4-C0 materialized corpus

on:
  push:
    branches:
      - research/20260909-01-g4-c0-materialized-corpus
      - feature/20260909-02-0.9.11-g4-reference-genre-contracts
    paths:
      - 'src/generation/composition/generation_profile.cpp'
      - 'src/generation/migration/phrase_execution.cpp'
      - 'src/generation/rhythm/rhythm_selection.cpp'
      - 'tests/test_gf2_g4_c0_materialized_corpus.cpp'
      - 'tests/test_gf2_g4_c0_cross_genre.cpp'
      - 'tests/run_gf2_g4_c0_tests.sh'
      - 'tests/test_gf2_g4_r1_reference_contracts.cpp'
      - 'tests/run_gf2_g4_r1_tests.sh'
      - 'tests/test_gf2_g4_i3_phrase_truthfulness.cpp'
      - 'tests/run_gf2_g4_i3_tests.sh'
      - 'tests/test_gf2_i3_phrase_law_execution.cpp'
      - 'tests/run_gf2_i3_tests.sh'
      - '.github/workflows/gf2-g4-c0-materialized-corpus.yml'
      - 'docs/research/GF2_I2A_FEEL_AMPLITUDE_CENSUS.tsv'
      - 'docs/superpowers/plans/2026-09-09-g4-c0-materialized-corpus.md'
      - 'docs/gf2/GF2_G4_C0_MATERIALIZED_IDEA_CORPUS.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialized-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libsdl2-dev libsdl2-gfx-dev pkg-config

      - name: Run G4-C0 corpus first pass
        run: |
          mkdir -p build/host-tests/gf2-g4-c0
          bash tests/run_gf2_g4_c0_tests.sh > build/host-tests/gf2-g4-c0/run-1.log
          cp build/host-tests/gf2-g4-c0/g4-c0-summary.txt \
             build/host-tests/gf2-g4-c0/g4-c0-summary-1.txt

      - name: Run G4-C0 corpus deterministic repeat
        run: |
          bash tests/run_gf2_g4_c0_tests.sh > build/host-tests/gf2-g4-c0/run-2.log
          cp build/host-tests/gf2-g4-c0/g4-c0-summary.txt \
             build/host-tests/gf2-g4-c0/g4-c0-summary-2.txt
          diff -u \
            build/host-tests/gf2-g4-c0/g4-c0-summary-1.txt \
            build/host-tests/gf2-g4-c0/g4-c0-summary-2.txt

      - name: Run G4-R1 reference contracts
        run: |
          bash tests/run_gf2_g4_r1_tests.sh \
            > build/host-tests/gf2-g4-c0/g4-r1.log

      - name: Run G4-I3 phrase truthfulness
        run: |
          bash tests/run_gf2_g4_i3_tests.sh \
            > build/host-tests/gf2-g4-c0/g4-i3.log

      - name: Regenerate FEEL census candidate
        run: |
          python3 tools/gf2/generate_gf2_i2a_feel_amplitude_census.py

      - name: Validate and refresh intended FEEL census delta
        run: |
          python3 - <<'PY'
          import subprocess

          path = "docs/research/GF2_I2A_FEEL_AMPLITUDE_CENSUS.tsv"
          diff = subprocess.check_output(
              ["git", "diff", "--unified=0", "--", path], text=True)
          changed = [
              line for line in diff.splitlines()
              if line[:1] in "+-" and not line.startswith(("+++", "---"))
          ]
          if not changed:
              print("FEEL census baseline already current")
              raise SystemExit(0)

          expected = {
              "-5\tDub/Reggae\t5\tDub Techno\t": 55,
              "+5\tDub/Reggae\t5\tDub Techno\t": 55,
              "-14\tDrum&Bass\t0\tBASE\t": 55,
              "+14\tDrum&Bass\t0\tBASE\t": 55,
          }
          counts = {prefix: 0 for prefix in expected}
          bad = []
          for line in changed:
              matched = False
              for prefix in expected:
                  if line.startswith(prefix):
                      counts[prefix] += 1
                      matched = True
                      break
              if not matched:
                  bad.append(line)
          if bad:
              print("Unexpected FEEL census changes:", *bad[:20], sep="\n")
              raise SystemExit(1)
          if len(changed) != 220:
              print(f"Expected 220 changed data lines, got {len(changed)}")
              print(counts)
              raise SystemExit(1)
          if counts != expected:
              print("Unexpected per-scope counts")
              print("expected:", expected)
              print("actual:  ", counts)
              raise SystemExit(1)
          print("Validated FEEL census delta:", counts)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/GF2_I2A_FEEL_AMPLITUDE_CENSUS.tsv
          git diff --cached --quiet && exit 0
          git commit -m "docs(gf2): refresh FEEL census for G4 contracts"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Run existing GF2-I3 ownership regressions
        run: |
          set -o pipefail
          bash tests/run_gf2_i3_tests.sh 2>&1 | \
            tee build/host-tests/gf2-g4-c0/gf2-i3-regression.log

      - name: Preserve regenerated FEEL census
        if: always()
        run: |
          if test -f docs/research/GF2_I2A_FEEL_AMPLITUDE_CENSUS.tsv; then
            cp docs/research/GF2_I2A_FEEL_AMPLITUDE_CENSUS.tsv \
              build/host-tests/gf2-g4-c0/GF2_I2A_FEEL_AMPLITUDE_CENSUS.regenerated.tsv
          fi

      - name: Print accepted G4-C0 summary
        if: always()
        run: |
          test -f build/host-tests/gf2-g4-c0/g4-c0-summary-1.txt && \
            cat build/host-tests/gf2-g4-c0/g4-c0-summary-1.txt || true

      - name: Print focused verification summaries
        if: always()
        run: |
          for log in g4-r1.log g4-i3.log gf2-i3-regression.log; do
            if test -f "build/host-tests/gf2-g4-c0/${log}"; then
              echo "===== ${log} ====="
              cat "build/host-tests/gf2-g4-c0/${log}"
            fi
          done

      - name: Upload G4-C0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-c0-materialized-corpus
          path: |
            build/host-tests/gf2-g4-c0/g4-c0-summary-1.txt
            build/host-tests/gf2-g4-c0/run-1.log
            build/host-tests/gf2-g4-c0/run-2.log
            build/host-tests/gf2-g4-c0/g4-r1.log
            build/host-tests/gf2-g4-c0/g4-i3.log
            build/host-tests/gf2-g4-c0/gf2-i3-regression.log
            build/host-tests/gf2-g4-c0/GF2_I2A_FEEL_AMPLITUDE_CENSUS.regenerated.tsv
          if-no-files-found: error
