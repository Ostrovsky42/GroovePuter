name: GF2 G4-C0 materialized corpus

on:
  push:
    branches:
      - research/20260909-01-g4-c0-materialized-corpus
      - feature/20260909-02-0.9.11-g4-reference-genre-contracts
      - feature/20260909-02-0.9.11-g4-i4-dub-techno-structural-ownership
    paths:
      - 'src/generation/composition/generation_profile.cpp'
      - 'src/generation/composition/rhythm_selection.cpp'
      - 'src/generation/migration/phrase_execution.cpp'
      - 'tests/test_gf2_g4_c0_materialized_corpus.cpp'
      - 'tests/test_gf2_g4_c0_cross_genre.cpp'
      - 'tests/run_gf2_g4_c0_tests.sh'
      - 'tests/test_gf2_g4_r1_reference_contracts.cpp'
      - 'tests/run_gf2_g4_r1_tests.sh'
      - 'tests/test_gf2_g4_i3_phrase_truthfulness.cpp'
      - 'tests/run_gf2_g4_i3_tests.sh'
      - 'tests/test_gf2_g4_i4_dub_techno_structural_ownership.cpp'
      - 'tests/run_gf2_g4_i4_tests.sh'
      - 'tests/test_gf2_i3_phrase_law_execution.cpp'
      - 'tests/run_gf2_i3_tests.sh'
      - '.github/workflows/gf2-g4-c0-materialized-corpus.yml'
      - 'docs/research/GF2_I2A_FEEL_AMPLITUDE_CENSUS.tsv'
      - 'docs/superpowers/plans/2026-09-09-g4-c0-materialized-corpus.md'
      - 'docs/gf2/GF2_G4_C0_MATERIALIZED_IDEA_CORPUS.md'
  workflow_dispatch:

# TEMPORARY G4-I4 baseline-refresh authority. Remove after the validated census
# commit is materialized; the final exact-SHA gate must return to contents: read.
permissions:
  contents: write

jobs:
  materialized-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libsdl2-dev libsdl2-gfx-dev pkg-config

      - name: Run G4-C0 corpus first pass
        run: |
          mkdir -p build/host-tests/gf2-g4-c0
          bash tests/run_gf2_g4_c0_tests.sh > build/host-tests/gf2-g4-c0/run-1.log
          cp build/host-tests/gf2-g4-c0/g4-c0-summary.txt \
             build/host-tests/gf2-g4-c0/g4-c0-summary-1.txt

      - name: Run G4-C0 corpus deterministic repeat
        run: |
          bash tests/run_gf2_g4_c0_tests.sh > build/host-tests/gf2-g4-c0/run-2.log
          cp build/host-tests/gf2-g4-c0/g4-c0-summary.txt \
             build/host-tests/gf2-g4-c0/g4-c0-summary-2.txt
          diff -u \
            build/host-tests/gf2-g4-c0/g4-c0-summary-1.txt \
            build/host-tests/gf2-g4-c0/g4-c0-summary-2.txt

      - name: Run G4-R1 reference contracts
        run: |
          bash tests/run_gf2_g4_r1_tests.sh \
            > build/host-tests/gf2-g4-c0/g4-r1.log

      - name: Run G4-I3 phrase truthfulness
        run: |
          bash tests/run_gf2_g4_i3_tests.sh \
            > build/host-tests/gf2-g4-c0/g4-i3.log

      - name: Run G4-I4 Dub Techno structural ownership
        run: |
          bash tests/run_gf2_g4_i4_tests.sh \
            > build/host-tests/gf2-g4-c0/g4-i4.log

      - name: Validate and materialize G4-I4 FEEL census baseline
        run: |
          set -euo pipefail
          census='docs/research/GF2_I2A_FEEL_AMPLITUDE_CENSUS.tsv'
          old="$(mktemp)"
          git show "HEAD:${census}" > "${old}"
          python3 tools/gf2/generate_gf2_i2a_feel_amplitude_census.py

          python3 - "${old}" "${census}" <<'PY'
          import collections
          import sys

          old_path, new_path = sys.argv[1:]
          old = open(old_path, encoding='utf-8').read().splitlines()
          new = open(new_path, encoding='utf-8').read().splitlines()
          if len(old) != 1816 or len(new) != 1816:
              raise SystemExit(f'G4-I4 census row-count drift: old={len(old)-1} new={len(new)-1}')
          if old[0] != new[0]:
              raise SystemExit('G4-I4 census header drift')

          changed = []
          for index, (before, after) in enumerate(zip(old[1:], new[1:]), start=2):
              if before == after:
                  continue
              b = before.split('\t')
              a = after.split('\t')
              if b[:9] != a[:9]:
                  raise SystemExit(f'G4-I4 census identity/order drift at line {index}')
              if not (a[0] == '5' and a[1] == 'Dub/Reggae' and
                      a[2] == '5' and a[3] == 'Dub Techno' and
                      a[4] == 'DUB_TECHNO'):
                  raise SystemExit(f'G4-I4 census changed outside Dub Techno at line {index}')
              changed.append((a[6], a[7]))

          if len(changed) != 55:
              raise SystemExit(f'G4-I4 expected 55 changed rows, got {len(changed)}')
          counts = collections.Counter(profile for profile, _ in changed)
          expected_profiles = {'STRAIGHT', 'SWING COMPAT', 'LAID BACK', 'PUSH/PULL', 'AUTO'}
          if set(counts) != expected_profiles or any(counts[p] != 11 for p in expected_profiles):
              raise SystemExit(f'G4-I4 FEEL profile coverage drift: {dict(counts)}')
          if len(set(changed)) != 55:
              raise SystemExit('G4-I4 duplicate profile/amount key in changed census rows')

          print('G4-I4 census candidate validated: 55 Dub Techno rows only')
          PY

          if git diff --quiet -- "${census}"; then
            echo 'G4-I4 census baseline already current'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- "${census}"
            git commit -m 'docs(gf2): refresh FEEL census for G4-I4 ownership'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Run existing GF2-I3 ownership regressions and FEEL census freshness
        run: |
          set -o pipefail
          bash tests/run_gf2_i3_tests.sh 2>&1 | \
            tee build/host-tests/gf2-g4-c0/gf2-i3-regression.log

      - name: Preserve verified FEEL census
        if: always()
        run: |
          if test -f docs/research/GF2_I2A_FEEL_AMPLITUDE_CENSUS.tsv; then
            cp docs/research/GF2_I2A_FEEL_AMPLITUDE_CENSUS.tsv \
              build/host-tests/gf2-g4-c0/GF2_I2A_FEEL_AMPLITUDE_CENSUS.regenerated.tsv
          fi

      - name: Print accepted G4-C0 summary
        if: always()
        run: |
          test -f build/host-tests/gf2-g4-c0/g4-c0-summary-1.txt && \
            cat build/host-tests/gf2-g4-c0/g4-c0-summary-1.txt || true

      - name: Print focused verification summaries
        if: always()
        run: |
          for log in g4-r1.log g4-i3.log g4-i4.log gf2-i3-regression.log; do
            if test -f "build/host-tests/gf2-g4-c0/${log}"; then
              echo "===== ${log} ====="
              cat "build/host-tests/gf2-g4-c0/${log}"
            fi
          done

      - name: Upload G4-C0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-c0-materialized-corpus
          path: |
            build/host-tests/gf2-g4-c0/g4-c0-summary-1.txt
            build/host-tests/gf2-g4-c0/run-1.log
            build/host-tests/gf2-g4-c0/run-2.log
            build/host-tests/gf2-g4-c0/g4-r1.log
            build/host-tests/gf2-g4-c0/g4-i3.log
            build/host-tests/gf2-g4-c0/g4-i4.log
            build/host-tests/gf2-g4-c0/gf2-i3-regression.log
            build/host-tests/gf2-g4-c0/GF2_I2A_FEEL_AMPLITUDE_CENSUS.regenerated.tsv
          if-no-files-found: error
