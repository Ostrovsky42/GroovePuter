name: TEMP Pattern Phrase UI Hardware Verifier

on:
  push:
    branches:
      - feature/20260908-03-0.9.10-pattern-phrase-ui-instrument-closure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardware-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SDL test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libsdl2-dev \
            libsdl2-gfx-dev

      - name: Apply exact page integration
        run: python3 scripts/apply_pattern_phrase_ui_instrument_page_patch.py

      - name: Recognize Phrase G and L by key or scancode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("src/ui/pages/synth_sequencer_page.cpp")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"(  const char plainKey = ui_event\.key\s*\n"
              r"\s*\? static_cast<char>\(std::tolower\(static_cast<unsigned char>\(ui_event\.key\)\)\)\s*\n"
              r"\s*: 0;\s*\n)"
          )
          replacement = (
              r"\1"
              "  const bool isPhraseLengthKey =\n"
              "      plainKey == 'l' || ui_event.scancode == GROOVEPUTER_L;\n"
              "  const bool isPhraseGridKey =\n"
              "      plainKey == 'g' || ui_event.scancode == GROOVEPUTER_G;\n"
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"plain-key regex count={count}; expected one")
          if text.count("if (plainKey == 'l') {") != 1:
              raise SystemExit("length-key marker not unique")
          text = text.replace("if (plainKey == 'l') {", "if (isPhraseLengthKey) {", 1)
          old_grid = "(ui_event.key == 'g' || ui_event.key == 'G')) {"
          if text.count(old_grid) != 1:
              raise SystemExit(f"grid-key marker count={text.count(old_grid)}; expected one")
          text = text.replace(old_grid, "isPhraseGridKey) {", 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Prepare Phrase length against requested extent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/ui/pages/synth_sequencer_page.cpp")
          text = path.read_text(encoding="utf-8")
          old = '''          auto candidate = before;
          if (RuntimePhraseEdit::setLengthBars(candidate, bars) !=
              RuntimePhraseEdit::LengthEditResult::Changed) {
            return false;
          }
'''
          new = '''          PhraseRuntime::RuntimeSynthEventBuffer candidate{};
          if (!PhraseInstrumentControls::prepareLengthTarget(
                  before, bars, candidate)) {
            return false;
          }
'''
          if text.count(old) != 1:
              raise SystemExit(f"length-preflight marker count={text.count(old)}; expected one")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Run stateless Phrase control unit gate
        run: |
          mkdir -p build/ui-pattern-phrase-instrument
          g++ -std=c++17 -I. tests/test_ui_pattern_phrase_instrument_controls.cpp \
            -o build/ui-pattern-phrase-instrument/test_controls
          build/ui-pattern-phrase-instrument/test_controls

      - name: Verify roll cursor selection causality
        run: python3 tests/test_ui_phrase_roll_selection_causality.py

      - name: Run real SynthSequencerPage hardware controls
        run: bash tests/run_ui_pattern_phrase_hardware_controls.sh
