name: Squash validated PERFORM and TR-606 fix

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  squash-validated-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Squash target branch with lease protection
        run: |
          set -euo pipefail
          expected_head=71be578bb940cbf244fe50068ac40c6bdf093208
          git fetch origin dev fix/perform-tools-knob-tr606
          actual_head=$(git rev-parse origin/fix/perform-tools-knob-tr606)
          test "$actual_head" = "$expected_head"
          git checkout -B fix/perform-tools-knob-tr606 origin/fix/perform-tools-knob-tr606
          git config user.name "openai-coding-agent"
          git config user.email "openai-coding-agent@users.noreply.github.com"
          git reset --soft origin/dev
          git commit -m "fix: improve knob controls and TR-606 behavior"
          git push \
            --force-with-lease=refs/heads/fix/perform-tools-knob-tr606:$expected_head \
            origin HEAD:fix/perform-tools-knob-tr606
