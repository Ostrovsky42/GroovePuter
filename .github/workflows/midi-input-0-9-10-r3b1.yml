name: MIDI Input Controllers 0.9.10 R3b1

on:
  pull_request:
    paths:
      - "src/input/midi_input_message.h"
      - "src/midi/usb_midi_channel_voice_parser.h"
      - "src/midi/usb_midi_realtime_parser.h"
      - "src/platform/cardputer_usb_midi_transport.cpp"
      - "tests/test_midi_input_0_9_10_r3b1.cpp"
      - "tests/test_midi_input_0_9_10_r3b1_source_regressions.py"
      - "tests/run_midi_input_0_9_10_r3b1_tests.sh"
      - "docs/releases/0_9_10_R3B1_USB_MIDI_PACKET_ADAPTER.md"
      - ".github/workflows/midi-input-0-9-10-r3b1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  usb-midi-channel-voice-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run 0.9.10-R3b1 USB MIDI parser tests
        run: bash tests/run_midi_input_0_9_10_r3b1_tests.sh
