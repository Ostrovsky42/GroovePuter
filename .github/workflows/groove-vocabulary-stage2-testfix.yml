name: Groove Vocabulary Stage 2 temporary adversarial test fix

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/20260808-04-groove-vocabulary-stage2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Correct fixture family enum
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/test_rhythm_stage2_adversarial.cpp')
          text = p.read_text(encoding='utf-8')
          old = 'RhythmFamily::BrokenBeat'
          if old not in text:
              raise SystemExit('expected fixture enum not found')
          p.write_text(text.replace(old, 'RhythmFamily::Breakbeat', 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_rhythm_stage2_adversarial.cpp
          git commit -m 'test: use valid Stage 2 fixture family'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
