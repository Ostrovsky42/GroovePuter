name: Kick sample-timed MIDI integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/usb-midi-dispatch-timing'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout timing branch
        uses: actions/checkout@v4
        with:
          ref: fix/usb-midi-dispatch-timing
          fetch-depth: 0

      - name: Extract and run bounded integration patch
        shell: bash
        run: |
          awk '
            /python3 - <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-midi-dispatch-timing.yml > /tmp/apply_midi_dispatch.py
          python3 /tmp/apply_midi_dispatch.py

      - name: Run host regressions
        run: bash tests/run_host_tests.sh

      - name: Commit timing integration
        shell: bash
        run: |
          rm .github/workflows/apply-midi-dispatch-timing.yml
          rm .github/workflows/kick-midi-dispatch-timing.yml
          rm -f .github/midi-dispatch-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: route Pattern MIDI through sample-timed dispatcher"
          git push origin HEAD:fix/usb-midi-dispatch-timing
