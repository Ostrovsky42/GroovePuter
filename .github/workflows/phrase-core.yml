name: Phrase Core

on:
  push:
    branches:
      - agent/phrase-core-foundation
      - experiment/phrase-arranger-stage-2
    paths:
      - 'src/phrase/**'
      - 'src/input/cardputer_input_edges.h'
      - 'src/ui/pages/phrase_page.*'
      - 'src/ui/workflow_mode.h'
      - 'src/ui/global_help_content.h'
      - 'src/ui/miniacid_display.cpp'
      - 'src/ui/miniacid_display.h'
      - 'src/state/ui_session_state.h'
      - 'scenes.h'
      - 'scenes.cpp'
      - 'platform_sdl/Makefile'
      - 'tests/test_phrase_*.cpp'
      - 'tests/test_phrase_*_regressions.py'
      - 'tests/test_cardputer_input_source_regressions.py'
      - 'tests/test_scene_roundtrip.cpp'
      - 'tests/test_global_help_content.cpp'
      - 'tests/test_ui_session_state.cpp'
      - 'docs/stages/PHRASE_CORE_*.md'
      - 'docs/stages/PHRASE_ARRANGER_*.md'
      - '.github/workflows/phrase-core.yml'
  pull_request:
    paths:
      - 'src/phrase/**'
      - 'src/input/cardputer_input_edges.h'
      - 'src/ui/pages/phrase_page.*'
      - 'src/ui/workflow_mode.h'
      - 'src/ui/global_help_content.h'
      - 'src/ui/miniacid_display.cpp'
      - 'src/ui/miniacid_display.h'
      - 'src/state/ui_session_state.h'
      - 'scenes.h'
      - 'scenes.cpp'
      - 'platform_sdl/Makefile'
      - 'tests/test_phrase_*.cpp'
      - 'tests/test_phrase_*_regressions.py'
      - 'tests/test_cardputer_input_source_regressions.py'
      - 'tests/test_scene_roundtrip.cpp'
      - 'tests/test_global_help_content.cpp'
      - 'tests/test_ui_session_state.cpp'
      - 'docs/stages/PHRASE_CORE_*.md'
      - 'docs/stages/PHRASE_ARRANGER_*.md'
      - '.github/workflows/phrase-core.yml'

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Phrase source and Scene codec integration
        run: |
          python3 tests/test_phrase_scene_source_regressions.py
          python3 tests/test_phrase_ui_source_regressions.py
          python3 tests/test_global_help_source_regressions.py
          python3 tests/test_cardputer_input_source_regressions.py

      - name: Build Phrase Core and UI host tests
        run: |
          mkdir -p build/host-tests
          COMMON_FLAGS='-std=c++17 -Wall -Wextra -Werror -Wno-c++20-extensions -I.'
          g++ ${COMMON_FLAGS} \
            tests/test_phrase_core.cpp \
            -o build/host-tests/test_phrase_core
          g++ ${COMMON_FLAGS} \
            tests/test_phrase_arranger.cpp \
            -o build/host-tests/test_phrase_arranger
          g++ ${COMMON_FLAGS} \
            tests/test_phrase_persistence_preview.cpp \
            -o build/host-tests/test_phrase_persistence_preview
          g++ ${COMMON_FLAGS} \
            tests/test_phrase_workspace.cpp \
            -o build/host-tests/test_phrase_workspace
          g++ ${COMMON_FLAGS} \
            tests/test_global_help_content.cpp \
            -o build/host-tests/test_global_help_content
          g++ ${COMMON_FLAGS} \
            tests/test_ui_session_state.cpp \
            -o build/host-tests/test_ui_session_state
          g++ ${COMMON_FLAGS} \
            -Iplatform_sdl \
            -include platform_sdl/arduino_compat.h \
            -c src/ui/pages/phrase_page.cpp \
            -o build/host-tests/phrase_page.o
          g++ ${COMMON_FLAGS} \
            -Wno-unused-variable \
            -Wno-unused-but-set-variable \
            -Iplatform_sdl \
            -include platform_sdl/arduino_compat.h \
            tests/test_scene_roundtrip.cpp \
            scenes.cpp \
            json_evented.cpp \
            src/audio/pattern_paging.cpp \
            -o build/host-tests/test_scene_roundtrip

      - name: Run Phrase Core and UI host tests
        run: |
          build/host-tests/test_phrase_core
          build/host-tests/test_phrase_arranger
          build/host-tests/test_phrase_persistence_preview
          build/host-tests/test_phrase_workspace
          build/host-tests/test_global_help_content
          build/host-tests/test_ui_session_state
          build/host-tests/test_scene_roundtrip
