name: Apply Phrase Scene integration

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'tools/apply_phrase_scene_integration.py'
      - '.github/workflows/apply-phrase-scene-integration.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/phrase-core-foundation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phrase-core-foundation
          fetch-depth: 0
      - name: Scope evented numeric handler patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_phrase_scene_integration.py')
          text = path.read_text()
          old = """cpp = replace_once(\n    cpp,\n    '''  Path path = stack_[stackSize_ - 1].path;\n  if (path == Path::Song) {'''"""
          new = """cpp = replace_first(\n    cpp,\n    '''  Path path = stack_[stackSize_ - 1].path;\n  if (path == Path::Song) {'''"""
          if text.count(old) != 1:
              raise SystemExit(f'numeric handler patch anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply exact integration patch
        run: python3 tools/apply_phrase_scene_integration.py
      - name: Build focused Phrase tests
        run: |
          mkdir -p build/host-tests
          COMMON_FLAGS='-std=c++17 -Wall -Wextra -Werror -Wno-c++20-extensions -I.'
          g++ ${COMMON_FLAGS} tests/test_phrase_core.cpp \
            -o build/host-tests/test_phrase_core
          g++ ${COMMON_FLAGS} tests/test_phrase_persistence_preview.cpp \
            -o build/host-tests/test_phrase_persistence_preview
          build/host-tests/test_phrase_core
          build/host-tests/test_phrase_persistence_preview
      - name: Remove staging files
        run: |
          rm tools/apply_phrase_scene_integration.py
          rm .github/workflows/apply-phrase-scene-integration.yml
      - name: Commit integrated Scene codec
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scenes.h scenes.cpp tools/apply_phrase_scene_integration.py \
            .github/workflows/apply-phrase-scene-integration.yml
          git commit -m 'feat: persist Phrase Core in Scene codec'
          git push origin HEAD:agent/phrase-core-foundation
