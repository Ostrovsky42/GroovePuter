name: Apply FILE MASTER implementation

on:
  push:
    branches:
      - feature/transport-synced-performance-tools
    paths:
      - .github/workflows/apply-file-master.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/transport-synced-performance-tools
          fetch-depth: 0

      - name: Apply implementation patch
        run: |
          git apply --check .agent/file-master.patch
          git apply .agent/file-master.patch

      - name: Run host regressions
        run: bash tests/run_host_tests.sh

      - name: Commit clean implementation tree
        run: |
          rm -f .agent/file-master.patch
          rm -f .github/workflows/apply-file-master.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add SMF FILE MASTER clock mode"
          git push origin HEAD:feature/transport-synced-performance-tools
