name: Apply PR46 input integration

on:
  push:
    branches:
      - agent/deterministic-cardputer-input

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deterministic-cardputer-input
          fetch-depth: 0

      - name: Restore deterministic input files
        run: |
          git fetch origin backup/deterministic-cardputer-input-stage-a
          git checkout origin/backup/deterministic-cardputer-input-stage-a -- \
            GroovePuter.ino \
            docs/stages/DETERMINISTIC_CARDPUTER_INPUT_STAGE.md \
            src/input/cardputer_input_edges.h \
            tests/test_cardputer_input_edges.cpp \
            tests/test_cardputer_input_source_regressions.py

      - name: Merge host test entrypoints
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/run_host_tests.sh')
          text = path.read_text(encoding='utf-8')

          source_line = 'python3 "${ROOT_DIR}/tests/test_cardputer_input_source_regressions.py"\n'
          anchor = 'python3 "${ROOT_DIR}/tests/test_source_regressions.py"\n'
          if source_line not in text:
              if anchor not in text:
                  raise SystemExit('source regression anchor missing')
              text = text.replace(anchor, anchor + source_line, 1)

          block = '''\n\n"${CXX}" \\
            -std=c++17 \\
            -Wall \\
            -Wextra \\
            -Werror \\
            -I"${ROOT_DIR}" \\
            "${ROOT_DIR}/tests/test_cardputer_input_edges.cpp" \\
            -o "${BUILD_DIR}/test_cardputer_input_edges"\n\n"${BUILD_DIR}/test_cardputer_input_edges"\n'''
          if 'test_cardputer_input_edges.cpp' not in text:
              text += block

          path.write_text(text, encoding='utf-8')
          PY

      - name: Run combined focused tests
        run: |
          python3 tests/test_cardputer_input_source_regressions.py
          python3 tests/test_ui_session_source_regressions.py
          mkdir -p build/host-tests
          g++ -std=c++17 -Wall -Wextra -Werror -I. \
            tests/test_cardputer_input_edges.cpp \
            -o build/host-tests/test_cardputer_input_edges
          build/host-tests/test_cardputer_input_edges
          g++ -std=c++17 -Wall -Wextra -Werror -I. \
            tests/test_ui_session_state.cpp \
            -o build/host-tests/test_ui_session_state
          build/host-tests/test_ui_session_state

      - name: Commit integrated test branch
        run: |
          rm -f .github/workflows/apply-pr46-input-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: combine workflow persistence with deterministic input"
          git push origin HEAD:agent/deterministic-cardputer-input
