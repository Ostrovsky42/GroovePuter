name: Groove Vocabulary temporary size audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  firmware-size-delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install pinned M5Stack dependencies
        run: bash scripts/install_arduino_deps.sh

      - name: Build head profiles and collect metrics
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          REPORT="$GITHUB_WORKSPACE/groove-vocabulary-size.tsv"
          printf 'revision\tprofile\tsha\ttext\tdata\tbss\tdram_data\tdram_bss\tdram_total\tbin_bytes\n' > "$REPORT"

          find_size_tool() {
            find "$HOME/.arduino15/packages" -type f -name xtensa-esp32s3-elf-size -perm -111 -print \
              | sort -V | tail -n 1
          }

          collect() {
            local profile="$1"
            local build_dir="$2"
            local elf="$build_dir/GroovePuter.ino.elf"
            local bin="$build_dir/GroovePuter.ino.bin"
            local size_tool
            size_tool="$(find_size_tool)"
            test -x "$size_tool"
            test -f "$elf"
            test -f "$bin"

            read -r text data bss _ < <("$size_tool" "$elf" | awk 'NR==2 {print $1, $2, $3, $4}')
            read -r dram_data dram_bss < <(
              "$size_tool" -A "$elf" | awk '
                $1 == ".dram0.data" { data = $2 }
                $1 == ".dram0.bss" { bss = $2 }
                END { print data + 0, bss + 0 }
              '
            )
            local dram_total=$((dram_data + dram_bss))
            local bin_bytes
            bin_bytes="$(stat -c %s "$bin")"
            printf 'head\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$profile" "$HEAD_SHA" "$text" "$data" "$bss" \
              "$dram_data" "$dram_bss" "$dram_total" "$bin_bytes" >> "$REPORT"
          }

          normal="$RUNNER_TEMP/head-normal"
          midi="$RUNNER_TEMP/head-midi-only"
          BUILD_PATH="$normal" bash scripts/build.sh --warnings all
          bash scripts/check_cardputer_dram_budget.sh "$normal/GroovePuter.ino.elf"
          collect normal "$normal"

          BUILD_PATH="$midi" bash scripts/build_seqtrak_midi_only.sh --warnings all
          collect midi-only "$midi"
          cat "$REPORT"

      - name: Upload size report
        uses: actions/upload-artifact@v4
        with:
          name: groove-vocabulary-size-audit
          path: groove-vocabulary-size.tsv
          if-no-files-found: error
