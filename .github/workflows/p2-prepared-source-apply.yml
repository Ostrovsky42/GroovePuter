name: P2 prepared source apply
on:
  push:
    branches:
      - feature/20260904-01-0.9.10-pattern-phrase-p2-common-runtime-playback
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/20260904-01-0.9.10-pattern-phrase-p2-common-runtime-playback
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/p2_apply_prepared_source.py
      - name: Install focused-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libsdl2-dev libsdl2-gfx-dev
      - name: Verify P2 and P1C before commit
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          bash tests/run_pattern_phrase_p2_tests.sh
          bash tests/run_pattern_phrase_p1c_tests.sh
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dsp/miniacid_engine.h src/dsp/miniacid_engine.cpp src/ui/pages/pattern_edit_page.h src/ui/pages/pattern_edit_page_legacy.h src/ui/pages/pattern_edit_page.cpp src/ui/pages/synth_sequencer_page.cpp src/ui/pages/feel_page.cpp src/ui/miniacid_display.cpp
          git commit -m "feat: publish resident P2 prepared Pattern bank"
          git push origin HEAD:feature/20260904-01-0.9.10-pattern-phrase-p2-common-runtime-playback
