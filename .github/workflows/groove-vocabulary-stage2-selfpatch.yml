name: Groove Vocabulary Stage 2 temporary self-patch

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/20260808-04-groove-vocabulary-stage2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply reviewed surgical fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          realizer = Path('src/generation/rhythm/rhythm_realizer.cpp')
          text = realizer.read_text(encoding='utf-8')
          old = '    if (function == BarFunction::Repeat) continue;\n'
          new = ('    if (function == BarFunction::Repeat ||\n'
                 '        function == BarFunction::Return) {\n'
                 '      continue;\n'
                 '    }\n')
          if old not in text:
              raise SystemExit('expected Return variation patch target missing')
          text = text.replace(old, new, 1)
          realizer.write_text(text, encoding='utf-8')

          test = Path('tests/test_rhythm_stage2.cpp')
          text = test.read_text(encoding='utf-8')
          old = ('  fixture.archetype.density.structuralPreferred = 11;\n'
                 '  fixture.archetype.density.structuralMax = 12;\n')
          new = ('  // Make preferred density valid in the declared budgets but impossible\n'
                 '  // in actual legal candidate space: Backbeat declares max 6 while its\n'
                 '  // anchors/optional mask expose only four distinct structural steps.\n'
                 '  fixture.lanes[2].structuralMax = 6;\n'
                 '  fixture.archetype.density.structuralPreferred = 13;\n'
                 '  fixture.archetype.density.structuralMax = 14;\n')
          if old not in text:
              raise SystemExit('expected ValidButSparse patch target missing')
          text = text.replace(old, new, 1)
          test.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- src/generation/rhythm/rhythm_realizer.cpp tests/test_rhythm_stage2.cpp

      - name: Commit patch
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/generation/rhythm/rhythm_realizer.cpp tests/test_rhythm_stage2.cpp
          git commit -m 'fix: tighten Stage 2 return and sparse contracts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
