name: Groove Vocabulary Stage 2 temporary intent self-patch

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/20260808-04-groove-vocabulary-stage2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Constrain trajectory selection by explicit intent
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/generation/rhythm/rhythm_realizer.cpp')
          text = p.read_text(encoding='utf-8')

          old = '''const BarTrajectory* chooseTrajectory(const RhythmCatalogView& catalog,
                                      const RhythmArchetype& archetype,
                                      uint8_t phraseBars,
                                      RealizationLevel level,
                                      TrajectoryId pinned,
                                      const GenerationContext& context) {
'''
          new = '''bool trajectorySupportsIntent(const BarTrajectory& trajectory,
                              TransformationIntent intent) {
  if (intent == TransformationIntent::Auto ||
      intent == TransformationIntent::Fill) {
    return true;
  }

  BarFunction required = BarFunction::Statement;
  switch (intent) {
    case TransformationIntent::Reduce:
      required = BarFunction::Reduction;
      break;
    case TransformationIntent::Break:
      required = BarFunction::Break;
      break;
    case TransformationIntent::Build:
      required = BarFunction::Build;
      break;
    case TransformationIntent::Turnaround:
      required = BarFunction::Turnaround;
      break;
    case TransformationIntent::Response:
      required = BarFunction::Response;
      break;
    case TransformationIntent::Auto:
    case TransformationIntent::Fill:
    case TransformationIntent::Count:
      return true;
  }

  for (uint8_t bar = 0; bar < trajectory.barCount; ++bar) {
    if (trajectory.bars[bar] == required) return true;
  }
  return false;
}

const BarTrajectory* chooseTrajectory(const RhythmCatalogView& catalog,
                                      const RhythmArchetype& archetype,
                                      uint8_t phraseBars,
                                      RealizationLevel level,
                                      TransformationIntent requestedIntent,
                                      TrajectoryId pinned,
                                      const GenerationContext& context) {
'''
          if old not in text:
              raise SystemExit('chooseTrajectory signature target missing')
          text = text.replace(old, new, 1)

          old = '''    if (!ref || !trajectory || trajectory->barCount != phraseBars ||
        !(ref->allowedLevels & realizationLevelBit(level))) {
'''
          new = '''    if (!ref || !trajectory || trajectory->barCount != phraseBars ||
        !(ref->allowedLevels & realizationLevelBit(level)) ||
        !trajectorySupportsIntent(*trajectory, requestedIntent)) {
'''
          if old not in text:
              raise SystemExit('pinned trajectory target missing')
          text = text.replace(old, new, 1)

          old = '''    if (!trajectory || trajectory->barCount != phraseBars ||
        !(ref.allowedLevels & realizationLevelBit(level))) {
      continue;
    }
    totalWeight = static_cast<uint16_t>(totalWeight + ref.weight);
'''
          new = '''    if (!trajectory || trajectory->barCount != phraseBars ||
        !(ref.allowedLevels & realizationLevelBit(level)) ||
        !trajectorySupportsIntent(*trajectory, requestedIntent)) {
      continue;
    }
    totalWeight = static_cast<uint16_t>(totalWeight + ref.weight);
'''
          if old not in text:
              raise SystemExit('trajectory weight filter target missing')
          text = text.replace(old, new, 1)

          old = '''    if (!trajectory || trajectory->barCount != phraseBars ||
        !(ref.allowedLevels & realizationLevelBit(level))) {
      continue;
    }
    if (pick < ref.weight) return trajectory;
'''
          new = '''    if (!trajectory || trajectory->barCount != phraseBars ||
        !(ref.allowedLevels & realizationLevelBit(level)) ||
        !trajectorySupportsIntent(*trajectory, requestedIntent)) {
      continue;
    }
    if (pick < ref.weight) return trajectory;
'''
          if old not in text:
              raise SystemExit('trajectory pick filter target missing')
          text = text.replace(old, new, 1)

          old = '''  const BarTrajectory* trajectory = chooseTrajectory(
      *request.catalog, *archetype, request.phraseBars, request.level,
      pinned, request.generation);
'''
          new = '''  const BarTrajectory* trajectory = chooseTrajectory(
      *request.catalog, *archetype, request.phraseBars, request.level,
      request.intent, pinned, request.generation);
'''
          if old not in text:
              raise SystemExit('chooseTrajectory call target missing')
          text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/generation/rhythm/rhythm_realizer.cpp
          git commit -m 'fix: bind explicit intent to trajectory selection'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
