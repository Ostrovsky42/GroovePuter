name: 0.9.9-P1b Phrase KEEP ownership

on:
  push:
    branches:
      - agent/20260823-08-0.9.9-p1b-phrase-keep-undo
    paths-ignore:
      - tests/.p1b_focused_result.txt
      - tests/.p1b_validation_result.txt
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  p1b-pre-pr-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/20260823-08-0.9.9-p1b-phrase-keep-undo

      - name: Validate through cumulative P1a
        shell: bash
        run: |
          set +e
          mkdir -p build/host-tests
          : > tests/.p1b_validation_result.txt
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "STEP1=focused"
            g++ -std=c++17 -O2 -Wall -Wextra -Werror -Wno-c++20-extensions -I. \
              tests/test_0_9_9_p1b_phrase_keep_undo.cpp \
              -o build/host-tests/test_0_9_9_p1b_phrase_keep_undo
            build_status=$?
            echo "FOCUSED_BUILD_EXIT=${build_status}"
            if [ "${build_status}" -eq 0 ]; then
              build/host-tests/test_0_9_9_p1b_phrase_keep_undo
              focused_status=$?
            else
              focused_status=125
            fi
            echo "FOCUSED_TEST_EXIT=${focused_status}"

            echo "STEP2=source-contract"
            python3 tests/test_0_9_9_p1b_phrase_keep_undo_source.py
            source_status=$?
            echo "SOURCE_EXIT=${source_status}"

            echo "STEP3=cumulative-p1a"
            bash tests/run_0_9_9_p1a_tests.sh
            p1a_status=$?
            echo "P1A_EXIT=${p1a_status}"

            if [ "${build_status}" -eq 0 ] && \
               [ "${focused_status}" -eq 0 ] && \
               [ "${source_status}" -eq 0 ] && \
               [ "${p1a_status}" -eq 0 ]; then
              echo "RESULT=PASS"
            else
              echo "RESULT=FAIL"
            fi
          } >> tests/.p1b_validation_result.txt 2>&1
          cat tests/.p1b_validation_result.txt

      - name: Publish pre-PR validation result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/.p1b_validation_result.txt
          if ! git diff --cached --quiet; then
            git commit -m "test(0.9.9-p1b): record pre-PR validation [skip ci]"
            git push origin HEAD:agent/20260823-08-0.9.9-p1b-phrase-keep-undo
          fi

      - name: Enforce pre-PR validation
        shell: bash
        run: grep -q '^RESULT=PASS$' tests/.p1b_validation_result.txt
