name: 0.9.9-P1b Phrase KEEP ownership

on:
  push:
    branches:
      - agent/20260823-08-0.9.9-p1b-phrase-keep-undo
    paths-ignore:
      - tests/.p1b_focused_result.txt
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  focused-p1b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/20260823-08-0.9.9-p1b-phrase-keep-undo
      - name: Build and run focused P1b ownership test
        id: focused
        shell: bash
        run: |
          set +e
          mkdir -p build/host-tests
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "COMMAND=g++ -std=c++17 -O2 -Wall -Wextra -Werror -Wno-c++20-extensions -I. tests/test_0_9_9_p1b_phrase_keep_undo.cpp"
            g++ -std=c++17 -O2 -Wall -Wextra -Werror -Wno-c++20-extensions -I. \
              tests/test_0_9_9_p1b_phrase_keep_undo.cpp \
              -o build/host-tests/test_0_9_9_p1b_phrase_keep_undo
            build_status=$?
            echo "BUILD_EXIT=${build_status}"
            if [ "${build_status}" -eq 0 ]; then
              build/host-tests/test_0_9_9_p1b_phrase_keep_undo
              test_status=$?
            else
              test_status=125
            fi
            echo "TEST_EXIT=${test_status}"
            if [ "${build_status}" -eq 0 ] && [ "${test_status}" -eq 0 ]; then
              echo "RESULT=PASS"
            else
              echo "RESULT=FAIL"
            fi
          } > tests/.p1b_focused_result.txt 2>&1
          cat tests/.p1b_focused_result.txt
      - name: Publish focused result to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/.p1b_focused_result.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test(0.9.9-p1b): record focused probe [skip ci]"
          git push origin HEAD:agent/20260823-08-0.9.9-p1b-phrase-keep-undo
      - name: Enforce focused result
        shell: bash
        run: |
          grep -q '^RESULT=PASS$' tests/.p1b_focused_result.txt
