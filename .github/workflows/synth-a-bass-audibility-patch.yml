name: Apply Synth A bass audibility patch

on:
  push:
    branches:
      - agent/synth-a-bass-audibility

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/synth-a-bass-audibility
          fetch-depth: 0

      - name: Apply auditable transform
        run: python3 tools/patches/apply_synth_a_bass_audibility.py

      - name: Run focused source regression
        run: python3 tests/test_synth_a_bass_profile_source_regressions.py

      - name: Run full host suite
        run: bash tests/run_host_tests.sh

      - name: Commit validated product changes
        run: |
          if git diff --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dsp/mode_manager.cpp src/dsp/genre_manager.cpp tests/run_host_tests.sh
          git commit -m "fix: improve Synth A bass register and audibility"
          git push origin HEAD:agent/synth-a-bass-audibility
