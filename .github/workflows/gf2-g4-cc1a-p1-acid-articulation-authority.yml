name: GF2 G4-CC1A-P1 Acid articulation ratification

on:
  push:
    branches:
      - feature/20260911-01-g4-cc1a-p1-acid-articulation-authority
    paths:
      - 'tests/run_gf2_g4_cc1a_p1_ratification.sh'
      - 'tests/test_gf2_g4_cc1a_p1_acid_articulation_authority.cpp'
      - 'tests/run_gf2_g4_cc1a_p1_tests.sh'
      - 'tests/test_gf2_g4_r1_reference_contracts.cpp'
      - 'tests/run_gf2_g4_r1_tests.sh'
      - 'tests/test_gf2_g4_i3_phrase_truthfulness.cpp'
      - 'tests/run_gf2_g4_i3_tests.sh'
      - 'tests/test_gf2_g4_i4_dub_techno_structural_ownership.cpp'
      - 'tests/run_gf2_g4_i4_tests.sh'
      - 'tests/test_gf2_g4_i5_house_structural_ownership.cpp'
      - 'tests/run_gf2_g4_i5_tests.sh'
      - 'tests/test_gf2_g4_i6_*'
      - 'tests/run_gf2_g4_i6_tests.sh'
      - 'tests/test_gf2_g4_cc1_contract_wave.cpp'
      - 'tests/run_gf2_g4_cc1_tests.sh'
      - 'tests/test_gf2_g4_cc1a_acid_structural_minimum.cpp'
      - 'tests/run_gf2_g4_cc1a_tests.sh'
      - 'tests/test_pattern_phrase_p2_*'
      - 'tests/run_pattern_phrase_p2_*'
      - 'tests/test_p3_*'
      - 'tests/run_pattern_phrase_p3_*'
      - 'docs/research/GF2_G4_CC1A_P1_C3A_RATIFICATION_ENTRYPOINT.md'
      - 'docs/research/GF2_G4_CC1A_P1_ACID_ARTICULATION_AUTHORITY.md'
      - 'docs/research/GF2_G4_CC1A_P1_ACID_ARTICULATION_CENSUS.tsv'
      - '.github/workflows/gf2-g4-cc1a-p1-acid-articulation-authority.yml'
      - 'src/generation/composition/generation_profile.cpp'
      - 'src/generation/roles/bass_rhythm.cpp'
      - 'src/generation/roles/bass_pitch_behavior.cpp'
      - 'src/generation/migration/strong_rhythm_migration.cpp'
      - 'src/generation/migration/tonal_pattern_adapter.cpp'
      - 'src/phrase/runtime_synth_events.h'
      - 'src/phrase/runtime_synth_events.cpp'
      - 'src/phrase/runtime_synth_playback.h'
      - 'src/phrase/runtime_synth_playback.cpp'
      - 'src/dsp/miniacid_engine.h'
      - 'src/dsp/miniacid_engine.cpp'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acid-articulation-ratification:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ratification host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            libsdl2-dev \
            libsdl2-gfx-dev \
            pkg-config

      - name: Run exact ratification entrypoint
        run: bash tests/run_gf2_g4_cc1a_p1_ratification.sh

      - name: Print ratification summary
        if: always()
        run: |
          if test -f build/host-tests/gf2-g4-cc1a-p1-ratification/ratification-summary.txt; then
            cat build/host-tests/gf2-g4-cc1a-p1-ratification/ratification-summary.txt
          fi
          if test -f build/host-tests/gf2-g4-cc1a-p1-ratification/g4_cc1a_retained.log; then
            cat build/host-tests/gf2-g4-cc1a-p1-ratification/g4_cc1a_retained.log
          fi

      - name: Upload ratification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-cc1a-p1-ratification
          path: |
            build/host-tests/gf2-g4-cc1a-p1-ratification/
            build/host-tests/gf2-g4-cc1a-p1/g4-cc1a-p1-summary.txt
            build/host-tests/gf2-g4-cc1a-p1/g4-cc1a-p1-census.tsv
            build/pattern-phrase-p2-lifecycle-barriers/behavior.out
            build/host-tests/gf2-g4-i6/run-a/GF2_G4_I6_OWNERSHIP_CENSUS.tsv
            build/host-tests/gf2-g4-i6/run-a/GF2_G4_I6_OWNERSHIP_ANOMALIES.tsv
            build/host-tests/gf2-g4-i6/run-a/GF2_G4_I6_COLLISION_PROJECTION.tsv
          if-no-files-found: warn
