name: R6 surgical patch

on:
  push:
    branches:
      - agent/20260816-0.9.8-r6-undo-ux
    paths:
      - tools/r6_apply.py
      - .github/workflows/r6-apply.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scope MiniAcidDisplay transform anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/r6_apply.py")
          text = path.read_text(encoding="utf-8")
          start_anchor = "replace_once(\n    display,\n    '    IPage* currentPage = getPage_(page_index_);\\n',"
          end_anchor = '    "display Undo fallback",\n)\n'
          start = text.index(start_anchor)
          end = text.index(end_anchor, start) + len(end_anchor)
          scoped = r'''display_text = display.read_text(encoding="utf-8")
          handle_start = display_text.index("bool MiniAcidDisplay::handleEvent(UIEvent event)")
          page_anchor = "    IPage* currentPage = getPage_(page_index_);\n"
          page_pos = display_text.index(page_anchor, handle_start)
          promotion = (
              "    // R6 exposes one global user gesture while preserving page ownership.\n"
              "    // The active page still decides whether it can restore the retained\n"
              "    // domain receipt; this layer only promotes Ctrl+U to APP_EVENT_UNDO.\n"
              "    GroovePuterUndoUx::promoteUndoShortcut(event);\n\n"
          )
          display_text = display_text[:page_pos] + promotion + display_text[page_pos:]
          app_anchor = "    if (event.event_type == GROOVEPUTER_APPLICATION_EVENT) {\n"
          fallback_pos = display_text.index(app_anchor, page_pos + len(promotion) + len(page_anchor))
          fallback = (
              "    // If the active page declined Undo, do not restore another domain here.\n"
              "    // A retained receipt remains intact so the user can return to its owner.\n"
              "    if (GroovePuterUndoUx::isUndoEvent(event)) {\n"
              "        const bool hasReceipt = GroovePuterUndo::undoOwner().hasUndo();\n"
              "        UI::showToast(GroovePuterUndoUx::fallbackToast(hasReceipt), 1000);\n"
              "        return true;\n"
              "    }\n\n"
          )
          display_text = display_text[:fallback_pos] + fallback + display_text[fallback_pos:]
          display.write_text(display_text, encoding="utf-8")
          '''
          path.write_text(text[:start] + scoped + text[end:], encoding="utf-8")
          PY
      - name: Apply deterministic R6 UX patch
        run: python3 tools/r6_apply.py
      - name: Scope R6 handleEvent source assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/test_undo_0_9_8_r6_ux_source_regressions.py")
          text = path.read_text(encoding="utf-8")
          old = '''    promotion = display.index("GroovePuterUndoUx::promoteUndoShortcut(event);")
    page_dispatch = display.index("IPage* currentPage = getPage_(page_index_);")
    fallback = display.index("GroovePuterUndoUx::isUndoEvent(event)", page_dispatch)
'''
          new = '''    handle_start = display.index("bool MiniAcidDisplay::handleEvent(UIEvent event)")
    promotion = display.index("GroovePuterUndoUx::promoteUndoShortcut(event);", handle_start)
    page_dispatch = display.index("IPage* currentPage = getPage_(page_index_);", promotion)
    fallback = display.index("GroovePuterUndoUx::isUndoEvent(event)", page_dispatch)
'''
          if text.count(old) != 1:
              raise RuntimeError("expected exactly one unscoped R6 display-order assertion")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Update cumulative R2 UX expectation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/test_undo_owner_0_9_8_source_regressions.py")
          text = path.read_text(encoding="utf-8")
          old = 'UI::showToast("UNDO EXPIRED"'
          new = 'UI::showToast("UNDO: EXPIRED"'
          if text.count(old) != 1:
              raise RuntimeError("expected exactly one legacy Pattern expired-toast assertion")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Validate R6 focused contracts
        run: |
          git diff --check
          bash tests/run_undo_0_9_8_r6_tests.sh
      - name: Commit R6 UX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui src/ui/pages tests docs
          git commit -m "0.9.8-R6: unify Undo shortcut and page UX"
          git push origin HEAD:agent/20260816-0.9.8-r6-undo-ux
