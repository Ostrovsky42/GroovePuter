name: 0.9.11 A1 Persistence Identity

on:
  push:
    branches:
      - feature/20260909-0.9.11-a1-material-id
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-persistence-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build A1 persistence contracts
        run: |
          mkdir -p build/host-tests
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Wno-c++20-extensions -I. \
            tests/test_0_9_11_a1_material_id.cpp \
            -o build/host-tests/test_0_9_11_a1_material_id
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Wno-c++20-extensions -I. \
            tests/test_0_9_11_a1_material_id_api.cpp \
            -o build/host-tests/test_0_9_11_a1_material_id_api
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Wno-c++20-extensions -I. \
            tests/test_melody_promotion.cpp \
            -o build/host-tests/test_melody_promotion

      - name: Run A1 persistence identity contracts
        run: |
          build/host-tests/test_0_9_11_a1_material_id
          build/host-tests/test_0_9_11_a1_material_id_api
          build/host-tests/test_melody_promotion

      - name: Diff hygiene
        run: git diff --check

  host-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            libsdl2-dev \
            libsdl2-gfx-dev \
            pkg-config

      - name: Run core host regressions
        run: bash tests/run_host_tests.sh

      - name: Run P3 lifetime regressions
        run: bash tests/run_pattern_phrase_p3_tests.sh

      - name: Run P3-U1 UI regressions
        run: bash tests/run_pattern_phrase_p3_u1_tests.sh

  cardputer-adv-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install pinned M5Stack dependencies
        run: bash scripts/install_arduino_deps.sh

      - name: Compile Cardputer ADV firmware
        run: bash scripts/build.sh --warnings all

      - name: Check fixed DRAM budget
        run: bash scripts/check_cardputer_dram_budget.sh build/cardputer-adv-current/GroovePuter.ino.elf
