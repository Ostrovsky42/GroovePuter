name: 0.9.10 Pattern Phrase Runtime Lifetime Apply Fix

on:
  push:
    branches:
      - feature/20260908-02-pattern-phrase-runtime-lifetime
    paths:
      - .github/workflows/0_9_10_pattern_phrase_runtime_lifetime_apply_fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-prove:
    name: Apply minimal ownership-transfer fix and prove focused GREEN
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/20260908-02-pattern-phrase-runtime-lifetime

      - name: Apply exact production patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/dsp/miniacid_engine.cpp")
          text = path.read_text()

          old_setter = '''void MiniAcid::setSequencedSource(int voiceIndex, SequencedSource source) {
            const int voice = clamp303Voice(voiceIndex);
            activeMaterial_[voice].kind =
                source == SequencedSource::Phrase
                    ? GroovePuterMaterial::MaterialKind::Melody
                    : GroovePuterMaterial::MaterialKind::Pattern;
          }
          '''
          new_setter = '''void MiniAcid::setSequencedSource(int voiceIndex, SequencedSource source) {
            const int voice = clamp303Voice(voiceIndex);
            const GroovePuterMaterial::MaterialKind nextKind =
                source == SequencedSource::Phrase
                    ? GroovePuterMaterial::MaterialKind::Melody
                    : GroovePuterMaterial::MaterialKind::Pattern;
            if (activeMaterial_[voice].kind == nextKind) return;
            hardBarrierPatternPlayback_(voice);
            activeMaterial_[voice].kind = nextKind;
          }
          '''

          old_make_line = "  activeMaterial_[voiceIndex].kind = GroovePuterMaterial::MaterialKind::Melody;"
          new_make_line = "  setSequencedSource(voiceIndex, SequencedSource::Phrase);"

          old_setter_count = text.count(old_setter)
          old_make_count = text.count(old_make_line)
          new_setter_count = text.count(new_setter)
          new_make_count = text.count(new_make_line)

          if old_setter_count == 1 and old_make_count == 1:
              text = text.replace(old_setter, new_setter, 1)
              text = text.replace(old_make_line, new_make_line, 1)
              path.write_text(text)
              print("Applied exact Pattern/Phrase ownership-transfer patch")
          elif new_setter_count == 1 and new_make_count == 1:
              print("Patch already present; no production change needed")
          else:
              raise SystemExit(
                  "Refusing mutation: expected exact source shapes not found uniquely "
                  f"(old_setter={old_setter_count}, old_make={old_make_count}, "
                  f"new_setter={new_setter_count}, new_make={new_make_count})"
              )
          PY

      - name: Create exact production commit locally
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dsp/miniacid_engine.cpp
          if git diff --cached --quiet; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "fix: barrier Pattern Phrase ownership transfer"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "FIX_SHA=$(git rev-parse HEAD)"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            libsdl2-dev \
            libsdl2-gfx-dev \
            pkg-config

      - name: Prove focused GREEN on exact local commit
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.commit.outputs.sha }}"
          echo "FOCUSED_GREEN_SHA=$(git rev-parse HEAD)"
          bash tests/run_pattern_phrase_p2_lifecycle_barriers.sh

      - name: Push proven production commit
        if: steps.commit.outputs.created == 'true'
        run: git push origin HEAD:feature/20260908-02-pattern-phrase-runtime-lifetime
