name: Integrate dev_0.9 into dev_0.9_test post-143

on:
  pull_request:
    branches: [dev_0.9_test]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'integration/dev09-into-dev09-test-post143'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/dev09-into-dev09-test-post143
          fetch-depth: 0

      - name: Merge release ancestry and adapt persistence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dev_0.9 dev_0.9_test agent/remove-texture-mode

          if git merge-base --is-ancestor origin/dev_0.9 HEAD; then
            echo "dev_0.9 already integrated"
            exit 0
          fi

          git merge -s ours --no-ff origin/dev_0.9 \
            -m "Merge dev_0.9 into dev_0.9_test after synth persistence"

          git checkout origin/dev_0.9 -- \
            .github/workflows/synth-persistence.yml \
            docs/refactors/SYNTH_PERSISTENCE_LOAD_OWNERSHIP_0_9.md \
            scenes.cpp scenes.h src/dsp/miniacid_engine.cpp \
            src/dsp/swappable_synth_voice.cpp \
            tests/test_new_synth_voices.cpp \
            tests/test_scene_revision_persistence_contract.cpp \
            tests/test_scene_roundtrip.cpp \
            tests/test_synth_persistence_source_regressions.py

          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text, pattern, repl, label, flags=0):
              out, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f"{label}: expected one match, got {n}")
              return out

          p = Path('scenes.h')
          s = p.read_text()
          for token in (
              '    uint8_t textureMode = 0;      // TextureMode enum value\n',
              '    uint8_t textureAmount = 70;   // 0..100 intensity\n',
              '    bool curatedMode = true;      // true: only allowed Genre x Texture combos\n',
              '    bool applySoundMacros = false; // true: Flavor change overwrites 303/Tape\n',
          ):
              if token not in s:
                  raise SystemExit(f'scenes.h missing expected legacy field: {token.strip()}')
              s = s.replace(token, '')
          for pattern, label in (
              (r'\n  if \(!writeLiteral\(",\\"tex\\":"\)\) return false;\n  if \(!writeInt\(scene_->genre\.textureMode\)\) return false;', 'stream tex'),
              (r'\n  if \(!writeLiteral\(",\\"amt\\":"\)\) return false;\n  if \(!writeInt\(scene_->genre\.textureAmount\)\) return false;', 'stream amt'),
              (r'\n  if \(!writeLiteral\(",\\"cur\\":"\)\) return false;\n  if \(!writeBool\(scene_->genre\.curatedMode\)\) return false;', 'stream cur'),
              (r'\n  if \(!writeLiteral\(",\\"sound\\":"\)\) return false;\n  if \(!writeBool\(scene_->genre\.applySoundMacros\)\) return false;', 'stream sound'),
          ):
              s = sub_once(s, pattern, '', label)
          p.write_text(s)

          p = Path('scenes.cpp')
          s = p.read_text()
          s = sub_once(
              s,
              r'    \} else if \(lastKey_ == "tex"\) \{.*?target_\.genre\.textureAmount = static_cast<uint8_t>\(v\);',
              '    } else if (lastKey_ == "tex" || lastKey_ == "textureMode" ||\n'
              '               lastKey_ == "amt" || lastKey_ == "textureAmount") {\n'
              '      // Legacy TEXTURE values are accepted but intentionally ignored.',
              'evented numeric texture decode', re.S)
          s = sub_once(
              s,
              r'    else if \(lastKey_ == "cur"\) target_\.genre\.curatedMode = value;\n'
              r'    else if \(lastKey_ == "sound"\) target_\.genre\.applySoundMacros = value;',
              '    else if (lastKey_ == "cur" || lastKey_ == "curated" ||\n'
              '             lastKey_ == "sound" || lastKey_ == "snd") {\n'
              '      // Legacy TEXTURE policy values are decode-only.\n'
              '    }',
              'evented bool texture decode')
          for line in (
              '  genreObj["tex"] = scene_->genre.textureMode;\n',
              '  genreObj["amt"] = scene_->genre.textureAmount;\n',
              '  genreObj["cur"] = scene_->genre.curatedMode;\n',
              '  genreObj["sound"] = scene_->genre.applySoundMacros;\n',
          ):
              if line not in s:
                  raise SystemExit(f'scenes.cpp missing writer line: {line.strip()}')
              s = s.replace(line, '')
          s = sub_once(
              s,
              r'    int tex = valueToInt\(genreObj\["tex"\], loaded->genre\.textureMode\);.*?loaded->genre\.textureAmount = static_cast<uint8_t>\(amt\);',
              '    // Historical tex/amt (and long-form aliases) are ignored. Concrete\n'
              '    // synth/FX state already persisted in the Scene remains authoritative.',
              'document texture numeric decode', re.S)
          for line in (
              '    loaded->genre.curatedMode = genreObj["cur"].is<bool>() ? genreObj["cur"].as<bool>() : loaded->genre.curatedMode;\n',
              '    loaded->genre.applySoundMacros = genreObj["sound"].is<bool>() ? genreObj["sound"].as<bool>() : loaded->genre.applySoundMacros;\n',
          ):
              if line not in s:
                  raise SystemExit(f'scenes.cpp missing legacy bool assignment: {line.strip()}')
              s = s.replace(line, '')
          p.write_text(s)

          p = Path('src/dsp/miniacid_engine.cpp')
          s = p.read_text()
          for old in (
              '  // Reset bias tracking since scene overwrites all params\n  genreManager_.resetTextureBiasTracking();\n  \n',
              '  genreManager_.setTextureMode(static_cast<TextureMode>(gs.textureMode));\n',
              '  // Mark the decoded texture bias as already represented. Texture/Genre sound\n  // projection remains available only through explicit user APPLY/MATERIALIZE.\n  genreManager_.syncTextureBiasBaselineFromCurrentState();\n\n',
              '  sceneManager_.currentScene().genre.textureMode = static_cast<uint8_t>(genreManager_.textureMode());\n',
              '  // NOW reset bias tracking (after all base params are set)\n  genreManager_.resetTextureBiasTracking();\n  // Apply texture to bring engine into consistent state with current genre\n  genreManager_.applyTexture(*this);\n',
          ):
              s = s.replace(old, '')
          apply_start = s.index('void MiniAcid::applySceneStateFromManager()')
          apply_end = s.index('void MiniAcid::applyTextureFromScene_()', apply_start)
          apply = s[apply_start:apply_end]
          for forbidden in ('genreManager_.applyGenreTimbre(*this)', 'genreManager_.applyTexture(*this)', 'TextureMode'):
              if forbidden in apply:
                  raise SystemExit(f'normal Load contains forbidden projection/state: {forbidden}')
          if 'if (sceneManager_.hasVersionedSynthState())' not in apply:
              raise SystemExit('versioned synth load path missing after integration')
          p.write_text(s)

          p = Path('tests/test_synth_persistence_source_regressions.py')
          s = p.read_text()
          s = s.replace(
              'if "syncTextureBiasBaselineFromCurrentState" not in apply:\n'
              '    raise AssertionError("load must synchronize texture bias without applying it")\n',
              'if "TextureMode" in engine and "syncTextureBiasBaselineFromCurrentState" not in apply:\n'
              '    raise AssertionError("load must synchronize texture bias while TextureMode exists")\n')
          p.write_text(s)

          p = Path('tests/run_host_tests.sh')
          s = p.read_text()
          line = 'python3 "${ROOT_DIR}/tests/test_synth_persistence_source_regressions.py"\n'
          if line not in s:
              anchor = 'python3 "${ROOT_DIR}/tests/test_atlas_sound_profile.py"\n'
              if anchor not in s:
                  raise SystemExit('run_host_tests.sh anchor missing')
              s = s.replace(anchor, anchor + line)
          p.write_text(s)
          PY

          python3 tests/test_remove_texture_mode_runtime.py
          python3 tests/test_synth_persistence_source_regressions.py

          rm -f .github/workflows/integrate-dev09-test-post143.yml
          git add -A
          git commit -m "test: integrate post-143 release persistence into dev_0.9_test"
          git push origin HEAD:integration/dev09-into-dev09-test-post143
