name: TEMP U4A Green Builder 2

on:
  push:
    branches:
      - tmp/20260906-ui-u4a-green-builder2

permissions:
  contents: write

jobs:
  build-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: tmp/20260906-ui-u4a-green-builder2

      - name: Apply guarded U4A patch
        shell: bash
        run: |
          cat > src/ui/phrase_notes_viewport.h <<'EOF'
          #pragma once
          #include <cstdint>
          #include "../phrase/runtime_synth_events.h"

          namespace PhraseNotesViewport {
          struct Window {
            uint8_t totalBars = 0;
            uint8_t focusBar = 0;
            uint8_t startBar = 0;
            uint8_t barCount = 0;
          };

          inline uint8_t barsForLength(uint16_t lengthTicks) {
            const uint16_t bar = PhraseRuntime::kTicksPerBar;
            if (lengthTicks == bar) return 1;
            if (lengthTicks == static_cast<uint16_t>(2u * bar)) return 2;
            if (lengthTicks == static_cast<uint16_t>(4u * bar)) return 4;
            if (lengthTicks == static_cast<uint16_t>(8u * bar)) return 8;
            return 0;
          }

          inline Window resolve(uint16_t lengthTicks, uint8_t requestedFocusBar) {
            Window out{};
            out.totalBars = barsForLength(lengthTicks);
            if (out.totalBars == 0) return out;
            out.focusBar = requestedFocusBar < out.totalBars
                ? requestedFocusBar
                : static_cast<uint8_t>(out.totalBars - 1u);
            if (out.totalBars <= 2u) {
              out.startBar = 0;
              out.barCount = out.totalBars;
              return out;
            }
            out.barCount = 2;
            out.startBar = out.focusBar == 0
                ? 0
                : static_cast<uint8_t>(out.focusBar - 1u);
            const uint8_t latestStart =
                static_cast<uint8_t>(out.totalBars - out.barCount);
            if (out.startBar > latestStart) out.startBar = latestStart;
            return out;
          }

          inline uint8_t moveFocus(uint8_t currentFocusBar,
                                   int delta,
                                   uint16_t lengthTicks) {
            const Window current = resolve(lengthTicks, currentFocusBar);
            if (current.totalBars == 0) return 0;
            int next = static_cast<int>(current.focusBar) + delta;
            if (next < 0) next = 0;
            const int last = static_cast<int>(current.totalBars) - 1;
            if (next > last) next = last;
            return static_cast<uint8_t>(next);
          }
          }  // namespace PhraseNotesViewport
          EOF

          python3 - <<'PY'
          from pathlib import Path

          def replace_one(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label} anchor count={text.count(old)}')
              return text.replace(old, new, 1)

          p = Path('src/ui/ui_view_continuity.h')
          s = p.read_text()
          if 'phraseFocusBar' in s:
              raise SystemExit('phrase continuity already exists')
          s = replace_one(s,
              '  uint8_t synthTab[2]{0, 0};\n',
              '  uint8_t synthTab[2]{0, 0};\n  uint8_t phraseFocusBar[2]{0, 0};\n',
              'continuity')
          p.write_text(s)

          p = Path('src/ui/pages/synth_sequencer_page.h')
          s = p.read_text()
          if 'phrase_focus_bar_' in s:
              raise SystemExit('phrase focus member already exists')
          s = replace_one(s,
              '    state.synthTab[voice_index_] = static_cast<uint8_t>(synth_tab_);\n',
              '    state.synthTab[voice_index_] = static_cast<uint8_t>(synth_tab_);\n'
              '    state.phraseFocusBar[voice_index_] = phrase_focus_bar_;\n',
              'capture')
          s = replace_one(s,
              '    setSynthTab(static_cast<SynthTab>(value));\n',
              '    setSynthTab(static_cast<SynthTab>(value));\n'
              '    phrase_focus_bar_ = state.phraseFocusBar[voice_index_];\n',
              'restore')
          s = replace_one(s,
              '  SynthTab synth_tab_ = SynthTab::Notes;\n',
              '  SynthTab synth_tab_ = SynthTab::Notes;\n'
              '  uint8_t phrase_focus_bar_ = 0;\n',
              'member')
          p.write_text(s)

          p = Path('src/ui/pages/synth_sequencer_page.cpp')
          s = p.read_text()
          if 'phrase_notes_viewport.h' in s:
              raise SystemExit('viewport include already exists')
          s = replace_one(s,
              '#include "../phrase_notes_projection.h"\n',
              '#include "../phrase_notes_projection.h"\n'
              '#include "../phrase_notes_viewport.h"\n',
              'include')

          s = replace_one(s,
              '''  char status[32];\n  const unsigned bars = phrase.lengthTicks / PhraseRuntime::kTicksPerBar;\n''',
              '''  const PhraseNotesViewport::Window viewport =\n      PhraseNotesViewport::resolve(phrase.lengthTicks, phrase_focus_bar_);\n  phrase_focus_bar_ = viewport.focusBar;\n\n  char status[32];\n  const unsigned bars = phrase.lengthTicks / PhraseRuntime::kTicksPerBar;\n''',
              'viewport resolve')

          s = replace_one(s,
              '''  gfx.setTextColor(COLOR_WHITE);\n  gfx.drawText(bounds.x + 4, bounds.y + 18, status);\n\n  const int timelineX = bounds.x + 4;\n  const int timelineY = bounds.y + 34;\n''',
              '''  gfx.setTextColor(COLOR_WHITE);\n  gfx.drawText(bounds.x + 4, bounds.y + 18, status);\n\n  const int overviewX = bounds.x + 4;\n  const int overviewY = bounds.y + 30;\n  const int overviewW = std::max(16, bounds.w - 8);\n  const int overviewH = 6;\n  const IGfxColor noteColor = synthTabColor(voice_index_);\n  for (uint8_t bar = 0; bar < viewport.totalBars; ++bar) {\n    const int x0 = overviewX + static_cast<int>(\n        (static_cast<uint32_t>(bar) * overviewW) / viewport.totalBars);\n    const int x1 = overviewX + static_cast<int>(\n        (static_cast<uint32_t>(bar + 1u) * overviewW) / viewport.totalBars);\n    const int cellW = std::max(1, x1 - x0 - 1);\n    gfx.drawRect(x0, overviewY, cellW, overviewH, COLOR_LABEL);\n    if (bar == viewport.focusBar) {\n      gfx.fillRect(x0 + 1, overviewY + 1, std::max(1, cellW - 2),\n                   overviewH - 2, noteColor);\n    }\n  }\n\n  const int timelineX = bounds.x + 4;\n  const int timelineY = bounds.y + 42;\n''',
              'overview')

          s = replace_one(s,
              '''  const int maxRows = std::max(1, (bounds.h - 38) / rowH);\n  const uint16_t visibleTicks = std::min<uint16_t>(\n      phrase.lengthTicks, 2 * PhraseRuntime::kTicksPerBar);\n  const uint32_t visibleSubticks =\n      static_cast<uint32_t>(visibleTicks) * PhraseRuntime::kSubticksPerTick;\n''',
              '''  const int maxRows = std::max(1, (bounds.h - 46) / rowH);\n  const uint16_t windowStartTick = static_cast<uint16_t>(\n      static_cast<uint16_t>(viewport.startBar) * PhraseRuntime::kTicksPerBar);\n  const uint16_t windowTicks = static_cast<uint16_t>(\n      static_cast<uint16_t>(viewport.barCount) * PhraseRuntime::kTicksPerBar);\n  const uint32_t windowStartSubtick =\n      static_cast<uint32_t>(windowStartTick) * PhraseRuntime::kSubticksPerTick;\n  const uint32_t windowSubticks =\n      static_cast<uint32_t>(windowTicks) * PhraseRuntime::kSubticksPerTick;\n  const uint32_t windowEndSubtick = windowStartSubtick + windowSubticks;\n''',
              'window')

          s = replace_one(s,
              '''  if (visibleTicks > PhraseRuntime::kTicksPerBar) {\n    const int barX = timelineX +\n        static_cast<int>((static_cast<uint32_t>(PhraseRuntime::kTicksPerBar) *\n                          timelineW) / visibleTicks);\n    gfx.fillRect(barX, timelineY, 1, maxRows * rowH, COLOR_LABEL);\n  }\n''',
              '''  if (viewport.barCount == 2u) {\n    gfx.fillRect(timelineX + timelineW / 2, timelineY,\n                 1, maxRows * rowH, COLOR_LABEL);\n  }\n''',
              'bar boundary')

          s = replace_one(s,
              '''    if (span.startSubtick >= visibleSubticks) continue;\n\n    const uint32_t clippedEnd = std::min<uint32_t>(span.endSubtick, visibleSubticks);\n    const int startX = timelineX + static_cast<int>(\n        (span.startSubtick * static_cast<uint32_t>(timelineW)) / visibleSubticks);\n    int endX = timelineX + static_cast<int>(\n        (clippedEnd * static_cast<uint32_t>(timelineW)) / visibleSubticks);\n''',
              '''    if (span.endSubtick <= windowStartSubtick ||\n        span.startSubtick >= windowEndSubtick) continue;\n\n    const uint32_t clippedStart =\n        std::max<uint32_t>(span.startSubtick, windowStartSubtick);\n    const uint32_t clippedEnd =\n        std::min<uint32_t>(span.endSubtick, windowEndSubtick);\n    const int startX = timelineX + static_cast<int>(\n        ((clippedStart - windowStartSubtick) *\n         static_cast<uint32_t>(timelineW)) / windowSubticks);\n    int endX = timelineX + static_cast<int>(\n        ((clippedEnd - windowStartSubtick) *\n         static_cast<uint32_t>(timelineW)) / windowSubticks);\n''',
              'span clipping')

          s = replace_one(s,
              '''    const IGfxColor noteColor = synthTabColor(voice_index_);\n    gfx.fillRect(startX, y, 2, 5, noteColor);  // onset\n    const int continuationX = startX + 2;\n''',
              '''    const bool onsetVisible = span.startSubtick >= windowStartSubtick;\n    if (onsetVisible) {\n      gfx.fillRect(startX, y, 2, 5, noteColor);\n    }\n    const int continuationX = onsetVisible ? startX + 2 : startX;\n''',
              'onset continuation')

          s = replace_one(s,
              '''  }\n}\n\nbool SynthSequencerPage::handlePhraseNotesEvent(UIEvent& ui_event) {\n  (void)ui_event;\n  // Slice 2 remains presentation-only. Phrase mutation is added only after the\n  // bounded PREPARE -> VALIDATE -> COMMIT owner is characterized.\n  return false;\n}\n''',
              '''  }\n\n  UI::drawStandardFooter(gfx, "L/R:BAR", "TAB:VIEW");\n}\n\nbool SynthSequencerPage::handlePhraseNotesEvent(UIEvent& ui_event) {\n  if (ui_event.event_type != GROOVEPUTER_KEY_DOWN ||\n      ui_event.ctrl || ui_event.alt || ui_event.meta) {\n    return false;\n  }\n\n  const int nav = UIInput::navCode(ui_event);\n  if (nav != GROOVEPUTER_LEFT && nav != GROOVEPUTER_RIGHT) return false;\n\n  const auto& phrase = mini_acid_.currentPhraseBuffer(voice_index_);\n  phrase_focus_bar_ = PhraseNotesViewport::moveFocus(\n      phrase_focus_bar_, nav == GROOVEPUTER_RIGHT ? 1 : -1, phrase.lengthTicks);\n  return true;\n}\n''',
              'handler footer')
          p.write_text(s)
          PY

      - name: Verify focused U4A gate
        shell: bash
        run: bash tests/run_ui_constitution_u4a_tests.sh

      - name: Verify diff scope
        shell: bash
        run: |
          git diff --check
          git add src/ui/phrase_notes_viewport.h \
                  src/ui/ui_view_continuity.h \
                  src/ui/pages/synth_sequencer_page.cpp \
                  src/ui/pages/synth_sequencer_page.h
          printf '%s\n' \
            src/ui/pages/synth_sequencer_page.cpp \
            src/ui/pages/synth_sequencer_page.h \
            src/ui/phrase_notes_viewport.h \
            src/ui/ui_view_continuity.h | sort > /tmp/expected
          git diff --cached --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual

      - name: Commit GREEN
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(ui): add bounded Phrase focus viewport'
          git push origin HEAD:tmp/20260906-ui-u4a-green-builder2
