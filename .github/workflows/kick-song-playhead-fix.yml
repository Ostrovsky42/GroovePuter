name: Kick Song playhead repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/song-playhead-advance'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/song-playhead-advance
          fetch-depth: 0

      - name: Extract and run bounded repair
        shell: bash
        run: |
          awk '
            /python3 - <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-song-playhead-fix.yml > /tmp/apply_song_playhead.py
          python3 /tmp/apply_song_playhead.py

      - name: Run host regressions
        run: bash tests/run_host_tests.sh

      - name: Commit repaired implementation
        shell: bash
        run: |
          rm .github/workflows/apply-song-playhead-fix.yml
          rm .github/workflows/kick-song-playhead-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: advance Song rows on bar boundaries"
          git push origin HEAD:fix/song-playhead-advance
