name: Kick Song playhead repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/song-playhead-advance'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/song-playhead-advance
          fetch-depth: 0

      - name: Extract and run bounded repair
        shell: bash
        run: |
          awk '
            /python3 - <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-song-playhead-fix.yml > /tmp/apply_song_playhead.py

          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply_song_playhead.py')
          text = path.read_text(encoding='utf-8')
          old = 'replace_once(engine, "  songStepCounter_ = 0;", "  songBarIndex_ = -1;")'
          new = '''replace_once(
              engine,
              "  currentTick_ = 0;\\n  songStepCounter_ = 0;\\n  currentTimingOffset_ = 0;",
              "  currentTick_ = 0;\\n  songBarIndex_ = -1;\\n  currentTimingOffset_ = 0;",
          )'''
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f'expected one repair-script match, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          python3 /tmp/apply_song_playhead.py

      - name: Run host regressions
        run: bash tests/run_host_tests.sh

      - name: Commit repaired implementation
        shell: bash
        run: |
          rm .github/workflows/apply-song-playhead-fix.yml
          rm .github/workflows/kick-song-playhead-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: advance Song rows on bar boundaries"
          git push origin HEAD:fix/song-playhead-advance
