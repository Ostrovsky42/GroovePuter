name: Phrase Arranger Stage 2

on:
  push:
    branches:
      - experiment/phrase-arranger-stage-2
  pull_request:

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Phrase and input source gates
        run: |
          python3 tests/test_phrase_scene_source_regressions.py
          python3 tests/test_phrase_ui_source_regressions.py
          python3 tests/test_global_help_source_regressions.py
          python3 tests/test_cardputer_input_source_regressions.py

      - name: Build focused Phrase tests
        run: |
          mkdir -p build/host-tests
          COMMON_FLAGS='-std=c++17 -Wall -Wextra -Werror -Wno-c++20-extensions -I.'
          g++ ${COMMON_FLAGS} tests/test_phrase_core.cpp \
            -o build/host-tests/test_phrase_core
          g++ ${COMMON_FLAGS} tests/test_phrase_arranger.cpp \
            -o build/host-tests/test_phrase_arranger
          g++ ${COMMON_FLAGS} tests/test_phrase_arranger_capacity.cpp \
            -o build/host-tests/test_phrase_arranger_capacity
          g++ ${COMMON_FLAGS} tests/test_phrase_persistence_preview.cpp \
            -o build/host-tests/test_phrase_persistence_preview
          g++ ${COMMON_FLAGS} tests/test_phrase_workspace.cpp \
            -o build/host-tests/test_phrase_workspace
          g++ ${COMMON_FLAGS} tests/test_global_help_content.cpp \
            -o build/host-tests/test_global_help_content
          g++ ${COMMON_FLAGS} \
            -Iplatform_sdl \
            -include platform_sdl/arduino_compat.h \
            -c src/ui/pages/phrase_page.cpp \
            -o build/host-tests/phrase_page.o
          g++ ${COMMON_FLAGS} \
            -Wno-unused-variable \
            -Wno-unused-but-set-variable \
            -Iplatform_sdl \
            -include platform_sdl/arduino_compat.h \
            tests/test_scene_roundtrip.cpp \
            scenes.cpp \
            json_evented.cpp \
            src/audio/pattern_paging.cpp \
            -o build/host-tests/test_scene_roundtrip

      - name: Run focused Phrase tests
        run: |
          build/host-tests/test_phrase_core
          build/host-tests/test_phrase_arranger
          build/host-tests/test_phrase_arranger_capacity
          build/host-tests/test_phrase_persistence_preview
          build/host-tests/test_phrase_workspace
          build/host-tests/test_global_help_content
          build/host-tests/test_scene_roundtrip

      - name: Run complete host regression suite
        run: bash tests/run_host_tests.sh

  sdl-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libsdl2-dev \
            libsdl2-gfx-dev

      - name: Build desktop target
        working-directory: platform_sdl
        run: make clean all CXX=g++

  cardputer-adv-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install pinned M5Stack dependencies
        run: bash scripts/install_arduino_deps.sh

      - name: Compile Cardputer ADV firmware
        run: bash scripts/build.sh --warnings all

      - name: Check fixed DRAM budget
        run: bash scripts/check_cardputer_dram_budget.sh build/cardputer-adv-current/GroovePuter.ino.elf
