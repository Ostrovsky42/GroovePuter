name: Apply Pattern MIDI Stage 1

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-pattern-midi-stage1.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/pattern-midi-output'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pattern-midi-output
          fetch-depth: 0

      - name: Apply implementation patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          patch = Path('scripts/apply_pattern_midi_stage1.py')
          text = patch.read_text(encoding='utf-8')
          broad = '''    replace_once(path,
                  "  if (synthVoices_[idx]) synthVoices_[idx]->release();\\n  liveNotes_[idx] = -1;\\n",
                  "  if (playing) publishPatternNoteOff_(idx);\\n  if (synthVoices_[idx]) synthVoices_[idx]->release();\\n  liveNotes_[idx] = -1;\\n")
          '''
          if broad not in text:
              raise SystemExit('broad synth release patch block not found')
          patch.write_text(text.replace(broad, '', 1), encoding='utf-8')
          PY

          python3 scripts/apply_pattern_midi_stage1.py

          python3 - <<'PY'
          from pathlib import Path

          engine = Path('src/dsp/miniacid_engine.cpp')
          text = engine.read_text(encoding='utf-8')
          old = '''  if (synthEngineNames_[idx] == targetName) {
              return;
            }
          
            if (synthVoices_[idx]) synthVoices_[idx]->release();
            liveNotes_[idx] = -1;
          '''
          new = '''  if (synthEngineNames_[idx] == targetName) {
              return;
            }
          
            if (playing) publishPatternNoteOff_(idx);
            if (synthVoices_[idx]) synthVoices_[idx]->release();
            liveNotes_[idx] = -1;
          '''
          if old not in text:
              raise SystemExit('setSynthEngine lifecycle block not found')
          engine.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/run_host_tests.sh')
          text = tests.read_text(encoding='utf-8')
          obsolete = 'python3 "${ROOT_DIR}/tests/test_usb_midi_source_regressions.py"\n'
          if obsolete in text:
              text = text.replace(obsolete, '', 1)
          tests.write_text(text, encoding='utf-8')
          PY

      - name: Run host regressions and publish implementation
        shell: bash
        run: |
          set +e
          bash tests/run_host_tests.sh
          test_status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_pattern_midi_stage1.py
          git rm .github/workflows/apply-pattern-midi-stage1.yml
          git add -A
          git commit -m "feat(midi): route PatternPlayer synth events to USB MIDI"
          git push origin HEAD:feature/pattern-midi-output

          exit "$test_status"
