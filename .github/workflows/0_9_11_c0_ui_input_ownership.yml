name: 0.9.11 C0 UI Input Ownership

on:
  push:
    branches:
      - fix/20260911-0.9.11-c0-ui-input-ownership
  workflow_dispatch:

permissions:
  contents: write

jobs:
  focused-ui-input-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove exact checkout
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Install SDL host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-gfx-dev pkg-config
      - name: Apply minimal ownership repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          synth = Path("src/ui/pages/synth_sequencer_page.cpp")
          text = synth.read_text(encoding="utf-8")
          old = """  if (!ui_event.alt && lower == 'l') {\n    const auto outcome = PhraseInstrumentControls::applyLengthChangeDetailed(\n        phrase, +1, [&](uint8_t bars) {\n"""
          new = """  if (lower == 'l' || ui_event.scancode == GROOVEPUTER_L) {\n    const int direction = ui_event.alt ? -1 : +1;\n    const auto outcome = PhraseInstrumentControls::applyLengthChangeDetailed(\n        phrase, direction, [&](uint8_t bars) {\n"""
          if old not in text:
              raise SystemExit("expected Phrase LENGTH ownership site not found")
          text = text.replace(old, new, 1)

          old = """  if (!ui_event.alt && !ui_event.ctrl && !ui_event.meta &&\n      (ui_event.key == 'g' || ui_event.key == 'G')) {\n"""
          new = """  if (!ui_event.alt && !ui_event.ctrl && !ui_event.meta &&\n      (lower == 'g' || ui_event.scancode == GROOVEPUTER_G)) {\n"""
          if old not in text:
              raise SystemExit("expected Phrase GRID ownership site not found")
          text = text.replace(old, new, 1)
          synth.write_text(text, encoding="utf-8")

          controls = Path("src/ui/phrase_instrument_controls.h")
          text = controls.read_text(encoding="utf-8")
          old = """  LengthChangeOutcome outcome{};\n  outcome.targetBars = lengthBars(current.lengthTicks);\n  if (!RuntimePhraseEdit::validate(current)) {\n    outcome.result = LengthChangeResult::InvalidLength;\n    return outcome;\n  }\n  if (direction != -1 && direction != 1) {\n"""
          new = """  LengthChangeOutcome outcome{};\n  if (!RuntimePhraseEdit::validLengthTicks(current.lengthTicks)) {\n    outcome.result = LengthChangeResult::InvalidLength;\n    return outcome;\n  }\n  outcome.targetBars = lengthBars(current.lengthTicks);\n  if (direction != -1 && direction != 1) {\n"""
          if old not in text:
              raise SystemExit("expected LENGTH preflight validation site not found")
          text = text.replace(old, new, 1)

          old = """  if (targetTicks == current.lengthTicks) {\n    outcome.result = LengthChangeResult::Unchanged;\n    return outcome;\n  }\n  if (shrinkWouldTruncateEvent(current, targetTicks)) {\n    outcome.result = LengthChangeResult::WouldTruncateEvent;\n    return outcome;\n  }\n\n  const bool committed =\n"""
          new = """  if (targetTicks == current.lengthTicks) {\n    outcome.result = LengthChangeResult::Unchanged;\n    return outcome;\n  }\n\n  if (targetTicks > current.lengthTicks) {\n    PhraseRuntime::RuntimeSynthEventBuffer candidate{};\n    if (!prepareLengthTarget(current, outcome.targetBars, candidate)) {\n      outcome.result = LengthChangeResult::InvalidLength;\n      return outcome;\n    }\n  } else {\n    if (!RuntimePhraseEdit::validate(current)) {\n      outcome.result = LengthChangeResult::InvalidLength;\n      return outcome;\n    }\n    if (shrinkWouldTruncateEvent(current, targetTicks)) {\n      outcome.result = LengthChangeResult::WouldTruncateEvent;\n      return outcome;\n    }\n  }\n\n  const bool committed =\n"""
          if old not in text:
              raise SystemExit("expected LENGTH shrink preflight site not found")
          text = text.replace(old, new, 1)
          controls.write_text(text, encoding="utf-8")

          song = Path("src/ui/pages/song_page.cpp")
          text = song.read_text(encoding="utf-8")
          old = """  char key = ui_event.key;\n  if (!key) return false;\n"""
          new = """  char key = ui_event.key;\n  if (!key && ui_event.scancode == GROOVEPUTER_NO_SCANCODE) return false;\n"""
          if old not in text:
              raise SystemExit("expected Song scancode ownership gate not found")
          text = text.replace(old, new, 1)

          old = """  char lowerKey = static_cast<char>(std::tolower(static_cast<unsigned char>(key)));\n"""
          new = """  char lowerKey = key\n      ? static_cast<char>(std::tolower(static_cast<unsigned char>(key)))\n      : 0;\n"""
          if old not in text:
              raise SystemExit("expected Song lowercase normalization site not found")
          text = text.replace(old, new, 1)
          song.write_text(text, encoding="utf-8")
          PY
          git diff --check
          git diff -- src/ui/pages/synth_sequencer_page.cpp src/ui/phrase_instrument_controls.h src/ui/pages/song_page.cpp
      - name: Run focused UI input ownership gate
        run: bash tests/run_c0_ui_input_ownership_tests.sh
      - name: Commit proven repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/pages/synth_sequencer_page.cpp src/ui/phrase_instrument_controls.h src/ui/pages/song_page.cpp
          git commit -m "fix(ui): restore Phrase input ownership"
          git push origin HEAD:fix/20260911-0.9.11-c0-ui-input-ownership
          echo "PROVEN_REPAIR_SHA=$(git rev-parse HEAD)"
