name: 0.9.11 C0 UI Input Ownership

on:
  push:
    branches:
      - fix/20260911-0.9.11-c0-ui-input-ownership
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_HEAD: ${{ github.sha }}

jobs:
  focused-ui-input-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0
      - name: Prove exact checkout
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${CANDIDATE_HEAD}"
      - name: Install SDL host dependencies
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends build-essential libsdl2-dev libsdl2-gfx-dev pkg-config
      - name: Run C0 UI input ownership regression
        run: bash tests/run_c0_ui_input_ownership_tests.sh

      # Measurement-only expansion of tests/run_ui_pattern_phrase_instrument_tests.sh.
      # Commands and ordering intentionally match the runner so the first failing
      # sub-contract is visible in GitHub Actions without changing test semantics.
      - name: Pattern Phrase gate - instrument controls
        run: |
          set -euo pipefail
          mkdir -p build/ui-pattern-phrase-instrument
          g++ -std=c++17 -I. tests/test_ui_pattern_phrase_instrument_controls.cpp \
            -o build/ui-pattern-phrase-instrument/test_ui_pattern_phrase_instrument_controls
          build/ui-pattern-phrase-instrument/test_ui_pattern_phrase_instrument_controls
      - name: Pattern Phrase gate - selected event edits
        run: |
          set -euo pipefail
          g++ -std=c++17 -I. tests/test_ui_phrase_selected_event_edits.cpp \
            -o build/ui-pattern-phrase-instrument/test_ui_phrase_selected_event_edits
          build/ui-pattern-phrase-instrument/test_ui_phrase_selected_event_edits
      - name: Pattern Phrase gate - roll selection causality
        run: python3 tests/test_ui_phrase_roll_selection_causality.py
      - name: Pattern Phrase gate - instrument integration
        run: python3 tests/test_ui_pattern_phrase_instrument_integration.py
      - name: Pattern Phrase gate - U4B7
        run: bash tests/run_ui_constitution_u4b7_tests.sh
      - name: Pattern Phrase gate - U4B8
        run: bash tests/run_ui_constitution_u4b8_tests.sh
      - name: Pattern Phrase gate - U4B9
        run: bash tests/run_ui_constitution_u4b9_tests.sh
      - name: Pattern Phrase gate - U4C1
        run: bash tests/run_ui_constitution_u4c1_tests.sh
      - name: Pattern Phrase gate - U4C2
        run: bash tests/run_ui_constitution_u4c2_tests.sh
      - name: Pattern Phrase gate - U4C3
        run: bash tests/run_ui_constitution_u4c3_tests.sh
      - name: Pattern Phrase gate - U4D1
        run: bash tests/run_ui_constitution_u4d1_tests.sh
      - name: Pattern Phrase gate - hardware controls
        run: bash tests/run_ui_pattern_phrase_hardware_controls_tests.sh
      - name: Pattern Phrase gate - content bounds
        run: bash tests/run_ui_content_bounds_tests.sh

      - name: Preserve hardware findings runtime contract
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Werror -I. \
            tests/test_c0_hardware_findings.cpp \
            src/phrase/runtime_synth_events.cpp \
            -o /tmp/test_c0_hardware_findings
          /tmp/test_c0_hardware_findings
      - name: Preserve Phrase LENGTH surface truth contract
        run: python3 tests/test_c0_phrase_length_ui_truth.py
      - name: Preserve Phrase Bank QWERTYUI contract
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -I. \
            tests/test_phrase_bank_qwertyui_p1.cpp \
            -o /tmp/test_phrase_bank_qwertyui_p1
          /tmp/test_phrase_bank_qwertyui_p1
      - name: Preserve MIDI panic CC123 contract
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -I. \
            tests/test_midi_panic_cc123.cpp \
            src/midi/usb_midi_output.cpp \
            -o /tmp/test_midi_panic_cc123
          /tmp/test_midi_panic_cc123
      - name: Black-box default-scene Phrase G in STOP and PLAY
        run: bash tests/run_c0_default_phrase_generation.sh
      - name: Build SDL exact head
        run: make -C platform_sdl -j2 CXX=g++

  host-regressions:
    needs: focused-ui-input-ownership
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0
      - name: Prepare deterministic Ubuntu package sources
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends build-essential clang libsdl2-dev libsdl2-gfx-dev pkg-config
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "${CANDIDATE_HEAD}"
      - name: Prove U4B9 source-toggle owner
        run: bash tests/run_ui_constitution_u4b9_tests.sh
      - name: Run full host regressions
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          set -o pipefail
          bash tests/run_host_tests.sh 2>&1 | tee c0-ui-input-ownership-full-host.log
      - name: Upload full-host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c0-ui-input-ownership-full-host-${{ github.sha }}
          path: c0-ui-input-ownership-full-host.log
          if-no-files-found: error

  cardputer-adv-prehardware:
    needs: focused-ui-input-ownership
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "${CANDIDATE_HEAD}"
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"
      - name: Install pinned M5Stack dependencies
        run: bash scripts/install_arduino_deps.sh
      - name: Build exact-head Cardputer ADV firmware
        run: bash scripts/build.sh --warnings all
      - name: Check exact-head fixed DRAM budget
        run: bash scripts/check_cardputer_dram_budget.sh build/cardputer-adv-current/GroovePuter.ino.elf
      - name: Record exact-head provenance
        run: |
          set -euo pipefail
          {
            echo "candidate_head=${CANDIDATE_HEAD}"
            echo "elf_sha256=$(sha256sum build/cardputer-adv-current/GroovePuter.ino.elf | awk '{print $1}')"
            echo "bin_sha256=$(sha256sum build/cardputer-adv-current/GroovePuter.ino.bin | awk '{print $1}')"
          } | tee cardputer-c0-ui-input-ownership-provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: c0-ui-input-ownership-cardputer-adv-${{ github.sha }}
          path: |
            build/cardputer-adv-current/GroovePuter.ino.elf
            build/cardputer-adv-current/GroovePuter.ino.bin
            cardputer-c0-ui-input-ownership-provenance.txt
          if-no-files-found: error
