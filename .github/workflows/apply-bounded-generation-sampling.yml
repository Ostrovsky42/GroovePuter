name: Apply bounded generation sampling

on:
  push:
    branches:
      - agent/groovebox-rng-domains

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/groovebox-rng-domains
          fetch-depth: 0

      - name: Apply bounded sampling cleanup
        run: python3 .github/scripts/apply_bounded_generation_sampling.py

      - name: Check source contract
        run: |
          python3 tests/test_generation_rng_source_regressions.py
          git diff --check

      - name: Run host tests
        run: bash tests/run_host_tests.sh

      - name: Commit visible source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/dsp/mode_manager.cpp \
            src/dsp/advanced_pattern_generator.cpp \
            tests/test_generation_rng_source_regressions.py
          git diff --cached --check
          git commit -m "fix: use bounded RNG sampling in generation"
          git push origin HEAD:agent/groovebox-rng-domains
