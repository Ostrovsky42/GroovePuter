name: 0.9.11 MaterialId Project Persistence G2

on:
  push:
    branches:
      - fix/20260911-0.9.11-material-id-independence
  workflow_dispatch:

permissions:
  contents: read

env:
  G1_ROOT: 28ec6ad0210c45e015222552b45c359b9896603c
  CANDIDATE_HEAD: ${{ github.sha }}

jobs:
  material-id-project-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0

      - name: Prove exact checkout and G1 ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_HEAD}"
          git merge-base --is-ancestor "${G1_ROOT}" HEAD
          echo "G1_ROOT=${G1_ROOT}"
          echo "HEAD=$(git rev-parse HEAD)"

      - name: Prove G2 delta stays inside material persistence owners
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "${G1_ROOT}"..HEAD)"
          printf '%s\n' "${changed}"
          test -n "${changed}"
          bad="$(printf '%s\n' "${changed}" | grep -Ev '^(docs/|tests/|\.github/workflows/|src/state/material_slot\.h$|src/audio/pattern_paging\.h$|src/audio/pattern_paging\.cpp$)' || true)"
          if [ -n "${bad}" ]; then
            echo "G2 changed files outside project identity persistence owners:" >&2
            printf '%s\n' "${bad}" >&2
            exit 2
          fi

      - name: Preserve G1 address-reuse contract
        run: bash tests/run_0_9_11_material_id_independence_red.sh

      - name: Run G2 project persistence contract
        run: bash tests/run_0_9_11_material_id_project_persistence.sh

      - name: Prove v3 v4 page compatibility
        run: bash tests/run_0_9_11_material_id_legacy_page_compat.sh

      - name: Run existing project paging regression
        run: |
          set -euo pipefail
          mkdir -p build/host-tests
          cat > build/host-tests/pattern_paging_scratch.cpp <<'CPP'
          #include "scenes.h"
          Scene& sceneTransactionScratch() {
            static Scene scratch{};
            return scratch;
          }
          CPP
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Wno-c++20-extensions -I. \
            tests/test_pattern_paging.cpp \
            src/audio/pattern_paging.cpp \
            src/audio/pattern_project_cleanup.cpp \
            build/host-tests/pattern_paging_scratch.cpp \
            -o build/host-tests/test_pattern_paging
          build/host-tests/test_pattern_paging

      - name: Diff hygiene
        run: git diff --check "${G1_ROOT}"..HEAD

  host-regressions:
    needs: material-id-project-persistence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0
      - name: Prepare deterministic Ubuntu package sources
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends build-essential clang libsdl2-dev libsdl2-gfx-dev pkg-config
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "${CANDIDATE_HEAD}"
      - name: Run full host regressions
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          set -o pipefail
          bash tests/run_host_tests.sh 2>&1 | tee material-id-g2-full-host.log
      - name: Upload full-host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-id-g2-full-host-${{ github.sha }}
          path: material-id-g2-full-host.log
          if-no-files-found: error

  cardputer-adv-prehardware:
    needs: material-id-project-persistence
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "${CANDIDATE_HEAD}"
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"
      - name: Install pinned M5Stack dependencies
        run: bash scripts/install_arduino_deps.sh
      - name: Build exact-head Cardputer ADV firmware
        run: bash scripts/build.sh --warnings all
      - name: Check exact-head fixed DRAM budget
        run: bash scripts/check_cardputer_dram_budget.sh build/cardputer-adv-current/GroovePuter.ino.elf
      - name: Record exact-head provenance
        run: |
          set -euo pipefail
          {
            echo "candidate_head=${CANDIDATE_HEAD}"
            echo "elf_sha256=$(sha256sum build/cardputer-adv-current/GroovePuter.ino.elf | awk '{print $1}')"
            echo "bin_sha256=$(sha256sum build/cardputer-adv-current/GroovePuter.ino.bin | awk '{print $1}')"
          } | tee material-id-g2-cardputer-provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: material-id-g2-cardputer-adv-${{ github.sha }}
          path: |
            build/cardputer-adv-current/GroovePuter.ino.elf
            build/cardputer-adv-current/GroovePuter.ino.bin
            material-id-g2-cardputer-provenance.txt
          if-no-files-found: error
