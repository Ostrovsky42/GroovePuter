name: Integration merge diagnostic

on:
  push:
    branches:
      - integration/genre-song-ui
    paths:
      - .github/workflows/integration-merge-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/genre-song-ui
          fetch-depth: 0

      - name: Record exact merge conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/genre-feel-generation-texture-analysis
          set +e
          git merge --no-commit --no-ff origin/agent/genre-feel-generation-texture-analysis
          status=$?
          set -e
          {
            echo "merge_status=$status"
            git diff --name-only --diff-filter=U
          } > /tmp/integration-merge-conflicts.txt
          git merge --abort || true
          cp /tmp/integration-merge-conflicts.txt .integration-merge-conflicts.txt
          git add .integration-merge-conflicts.txt
          git commit -m "chore: record integration merge conflicts" || exit 0
          git push origin HEAD:integration/genre-song-ui
